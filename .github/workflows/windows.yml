name: Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'scripts/windows-smoke.ts'
      - 'scripts/vitest-summary.ts'
      - 'scripts/acp-reply.ts'
      - 'scripts/windows-installer-smoke.ts'
      - 'apps/desktop/scripts/**'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  smoke:
    name: smoke (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Smoke checks
        shell: bash
        run: pnpm exec tsx scripts/windows-smoke.ts
      - name: Unit tests
        if: always()
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run --project unit --reporter=default --reporter=json --outputFile=vitest-windows.json
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: pnpm exec tsx scripts/vitest-summary.ts vitest-windows.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unit-report
          path: |
            vitest-windows.json
            windows-smoke.md
          if-no-files-found: ignore
          retention-days: 14

  installer:
    name: installer (windows-2025, unsigned)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the unsigned installer
        shell: bash
        run: |
          pnpm --filter @spark-outpost/web build
          pnpm --filter @spark-outpost/desktop build
          pnpm --filter @spark-outpost/desktop package --platform win
      - name: Install, start and uninstall
        shell: bash
        run: pnpm exec tsx scripts/windows-installer-smoke.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-unsigned
          path: apps/desktop/release/*/Spark-Outpost-*-x64.exe
          if-no-files-found: ignore
          retention-days: 3

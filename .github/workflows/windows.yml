name: Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'scripts/windows-smoke.ts'
      - 'scripts/vitest-summary.ts'
      - 'scripts/acp-reply.ts'
      - 'scripts/windows-installer-smoke.ts'
      - 'apps/desktop/scripts/**'
      - 'apps/server/src/terminal/session-host/**'
      - 'apps/desktop/native/win-helper/**'
      - 'apps/desktop/src/win-helper/**'
      - 'apps/desktop/src/windows-hello*.ts'
      - 'apps/desktop/src/app-lock*.ts'
      - 'apps/server/src/terminal/windows-cli*'
      - 'apps/server/src/terminal/native-hook-command*'
      - 'apps/server/src/terminal/chat-port-windows*'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  smoke:
    name: smoke (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Smoke checks
        shell: bash
        run: pnpm exec tsx scripts/windows-smoke.ts
      - name: Session host
        if: always()
        shell: bash
        run: pnpm exec vitest run --project unit apps/server/src/terminal/session-host apps/server/src/terminal/kept-choice.test.ts apps/server/src/terminal/windows-cli.test.ts apps/server/src/terminal/native-hook-command.test.ts apps/server/src/terminal/chat-port-windows.test.ts
      - name: Unit tests
        if: always()
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run --project unit --reporter=default --reporter=json --outputFile=vitest-windows.json
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: pnpm exec tsx scripts/vitest-summary.ts vitest-windows.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unit-report
          path: |
            vitest-windows.json
            windows-smoke.md
          if-no-files-found: ignore
          retention-days: 14

  installer:
    name: installer (windows-2025, unsigned)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Build and test the Windows helper
        shell: bash
        run: pnpm desktop:win-helper --test
      - name: Build the unsigned installer
        shell: bash
        run: |
          pnpm --filter @spark-outpost/web build
          pnpm --filter @spark-outpost/desktop build
          pnpm --filter @spark-outpost/desktop package --platform win
      - name: Install, start and uninstall
        shell: bash
        run: pnpm exec tsx scripts/windows-installer-smoke.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-unsigned
          path: apps/desktop/release/*/Spark-Outpost-*-windows-alpha-x64.exe
          if-no-files-found: ignore
          retention-days: 3

name: Set up the workspace
description: Install pnpm, Node from .nvmrc and the workspace dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Set a git identity for tests that commit
      shell: bash
      run: |
        git config --global user.name "Spark CI"
        git config --global user.email "ci@example.invalid"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Outpost</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="boot.css" />
    <link rel="stylesheet" href="boot-party.css" />
    <link rel="stylesheet" href="boot-teasers.css" />
    <script src="appearance.js"></script>
    <script src="boot-faces.js"></script>
    <script src="boot-party-plan.js"></script>
    <script src="boot-party.js"></script>
    <script src="boot-teasers.js"></script>
    <script src="boot.js"></script>
  </head>
  <body>
    <main class="boot" aria-label="Spark Outpost is starting" aria-busy="true">
      <div class="boot-stage">
        <div class="boot-spark">
          <span class="boot-glow" aria-hidden="true"></span>
          <svg class="boot-blob" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
            <g class="bb-stretch">
              <g class="bb-breathe">
                <path
                  class="bb-ant"
                  d="M38 18C39 13 42 10 46 9"
                  fill="none"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <path
                  class="bb-spark"
                  d="M48 2.4Q48.9 2.4 49.5 3L53.5 7Q54.6 8.5 53.5 10L49.5 14Q48 15.1 46.5 14L42.5 10Q41.4 8.5 42.5 7L46.5 3Q47.1 2.4 48 2.4Z"
                />
                <path
                  class="bb-body"
                  d="M11 40C11 25 18 17 32 17C46 17 53 25 53 40C53 56 51 58 32 58C13 58 11 56 11 40Z"
                />
                <g class="bb-eyes">
                  <rect class="bb-eye" x="22.5" y="32" width="5.6" height="11" rx="2.8" />
                  <rect class="bb-eye" x="35.9" y="32" width="5.6" height="11" rx="2.8" />
                </g>
                <path class="bb-closed" d="M22.8 39.5H27.8M36.2 39.5H41.2" />
              </g>
            </g>
          </svg>
        </div>
      </div>
      <div class="boot-foot">
        <p class="boot-status" role="status" aria-live="polite"></p>
      </div>
    </main>
  </body>
</html>

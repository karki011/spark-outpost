<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Outpost</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/theme-map.css" />
    <link rel="stylesheet" href="/shell.css" />
    <script>
      if (location.pathname === '/island') document.documentElement.dataset.island = '';
      try {
        var key = 'spark-outpost.theme';
        var desktop = window.sparkDesktop && window.sparkDesktop.theme;
        var skin = localStorage.getItem(key);
        if (!skin && desktop && desktop.saved) {
          skin = desktop.saved;
          localStorage.setItem(key, skin);
        }
        skin = skin || 'graphite';
        if (skin !== 'system') document.documentElement.dataset.skin = skin;
      } catch (error) {
        document.documentElement.dataset.skin = 'graphite';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="shell-sk" id="shell-skeleton" aria-hidden="true">
      <div class="shell-sk-rail">
        <span class="shell-sk-logo"></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span class="shell-sk-end"></span>
      </div>
      <div class="shell-sk-main">
        <div class="shell-sk-col">
          <div class="shell-sk-hello">
            <span class="shell-sk-blob"></span>
            <span class="shell-sk-title"></span>
          </div>
          <span class="shell-sk-line"></span>
          <span class="shell-sk-composer"></span>
          <span class="shell-sk-head"></span>
          <span class="shell-sk-card"></span>
          <span class="shell-sk-card"></span>
          <span class="shell-sk-card"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture login, step 1</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <h1>Sign in</h1>
    <form method="post" action="login-password.html">
      <label for="identifier">Email or phone</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" />
      <input name="password" type="password" hidden />
      <button type="submit">Next</button>
    </form>
  </body>
</html>

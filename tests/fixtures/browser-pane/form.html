<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture sign in</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <h1>Sign in</h1>
    <form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="ada@example.test" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="hunter2-fixture-secret" />
      <label for="card">Card number</label>
      <input id="card" name="cardnumber" autocomplete="cc-number" value="4242424242424242" />
      <label for="note">Note</label>
      <input id="note" name="note" value="visible note" />
      <button type="submit">Continue</button>
    </form>
  </body>
</html>

}

  }
}

}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
svg{flex-shrink:0;display:block}
[hidden]{display:none!important}

/* ---------- Frame ---------- */
.app{height:100%;display:flex}
.side{width:268px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:width .35s var(--out),opacity .25s}
body.collapsed .side{width:0;opacity:0}
.side-in{width:268px;display:flex;flex-direction:column;height:100%;padding:14px 10px 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;position:relative;transition:margin .35s var(--out)}
body.collapsed .main{margin-left:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .2s var(--spring)}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.icon-btn:active{transform:scale(.9)}

/* Context menu + toast */
.ctx{position:fixed;z-index:60;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);animation:menuin .24s var(--spring)}
@keyframes menuin{from{opacity:0;transform:scale(.92) translateY(-4px)}}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-sm);font-size:13.5px;text-align:left}
.ctx button:hover{background:var(--raise)}
.ctx button svg{color:var(--muted)}
.ctx .lab{font-size:12px;color:var(--faint);padding:6px 8px 2px}
.ctx hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.ctx .danger,.ctx .danger svg{color:var(--danger)}
.ctx .tk{margin-left:auto;color:var(--accent-text)}
.toasts{position:relative}
.toast{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px 11px;border-radius:var(--r-sm);background:var(--text);color:var(--panel);font-size:13px;position:relative;overflow:hidden;animation:toastin .45s var(--spring)}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.toast.out{animation:toastout .25s var(--out) forwards}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
.toast span{flex:1;min-width:0;line-height:1.4}
.toast button{font-weight:600;color:var(--panel);text-decoration:underline;text-underline-offset:2px}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--accent);transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* Header */
.head{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px}
.title{min-width:0;display:flex;align-items:baseline;gap:8px}
.crumb{font-size:14px;color:var(--faint);white-space:nowrap}
.title h1{margin:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch{font-size:12px;color:var(--faint);white-space:nowrap}
.head-r{margin-left:auto;display:flex;gap:2px;position:relative}
.theme-dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,var(--text) 0);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.pop{position:absolute;right:0;top:40px;z-index:30;width:200px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.18);transform-origin:top right;transform:scale(.92) translateY(-4px);opacity:0;pointer-events:none;transition:transform .25s var(--spring),opacity .15s}
.pop.open{transform:none;opacity:1;pointer-events:auto}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-sm);font-size:13.5px;text-align:left}
.pop button:hover{background:var(--raise)}
.pop .sw{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--a) 0 50%,var(--b) 0);box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.pop .tick{margin-left:auto;opacity:0;color:var(--accent-text)}
.pop button[aria-checked="true"] .tick{opacity:1}

/* ---------- Thread ---------- */
.thread-wrap{flex:1;position:relative;min-height:0}
.thread{position:absolute;inset:0;overflow-y:auto;padding:4px 0 32px}
.inner{max-width:700px;margin:0 auto;padding:0 24px}
.inner.show{animation:fade .35s var(--out)}
.divider{text-align:center;font-size:12px;color:var(--faint);margin:28px 0 8px;animation:rise .45s var(--out) both}
.empty{text-align:center;padding:16vh 12px 0;animation:rise .5s var(--out)}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted);font-size:14px}

.msg{position:relative;margin-top:20px;animation:rise .45s var(--out) both}
.msg.cont{margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.msg.me{display:flex;flex-direction:column;align-items:flex-end}
.msg.me.flying{animation:none}
.bubble{max-width:82%;background:var(--user);color:var(--user-text);padding:8px 14px;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word;transform-origin:bottom right}
.msg.me.fresh{animation:none}
.msg.me.fresh .bubble{animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}}
.bubble.pending{opacity:.6}
.bubble.failed{background:var(--danger-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--danger);animation:shake .4s var(--out)}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.meta{display:flex;align-items:center;gap:2px;height:28px;font-size:12px;color:var(--faint);opacity:0;transition:opacity .2s}
.msg:hover .meta,.msg:focus-within .meta{opacity:1}
.meta time{padding:0 6px}
.meta .icon-btn{width:26px;height:26px}
.msg.me .meta{flex-direction:row-reverse}
.who{padding-right:6px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);height:24px;animation:rise .3s var(--out)}
.status.err{color:var(--danger)}
.status .check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .05s var(--out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.link{color:var(--danger);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.ai p{margin:0 0 8px}
.ai p:last-child{margin-bottom:0}
.ai code{font-family:"Geist Mono",monospace;font-size:.86em;background:var(--raise);padding:1px 5px;border-radius:5px}
.w{animation:fade .35s var(--out) both}
@keyframes fade{from{opacity:0;filter:blur(3px)}}
.errline{padding:9px 12px;border-radius:var(--r-sm);background:var(--danger-soft);font-size:14px;margin-bottom:4px}
.question{padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn) 11%,transparent);box-shadow:inset 2px 0 0 var(--warn)}

.steps{margin:0 0 10px}
.steps-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:3px 0}
.steps-head:hover{color:var(--text)}
.steps-head .chev,.diff .chev{transition:transform .3s var(--out)}
.steps.open .chev,.diff.open .chev{transform:rotate(90deg)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--out)}
.open>.collapse,.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden;min-height:0}
.steps ul{list-style:none;margin:4px 0 0 6px;padding:0 0 0 14px;border-left:1px solid var(--line)}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:3px 0;animation:rise .35s var(--out) both}
.steps li code{font-size:12px}
.ic{width:14px;height:14px;display:grid;place-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--accent-text);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ok{color:var(--accent-text)}
.ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s var(--out) forwards}
.diff{border:1px solid var(--line);border-radius:var(--r-sm);margin:10px 0;overflow:hidden;background:var(--code)}
.diff-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;font-size:13px}
.diff-head .f{font-family:"Geist Mono",monospace;font-size:12.5px;flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:var(--r-sm);background:var(--raise);font-size:13px;animation:pop .4s var(--spring) both;transform-origin:left center}
.chip small{color:var(--faint)}
.chip.out{animation:chipout .2s var(--out) forwards}
@keyframes chipout{to{opacity:0;transform:scale(.8)}}
.chip button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--line)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:3px;border-radius:var(--r-sm);background:var(--raise)}
.seg button{position:relative;z-index:1;padding:5px 0;font-size:12.5px;color:var(--muted);transition:color .2s}
.seg button[aria-checked="true"]{color:var(--text);font-weight:500}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,4));border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .4s var(--spring)}
/* ================= Onboarding ================= */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.onb::before{content:"";position:fixed;inset:0;background:radial-gradient(50% 40% at 50% 12%,var(--accent-soft),transparent 70%);pointer-events:none}
.onb.leave{animation:onbout .7s var(--out) forwards}
@keyframes onbout{to{opacity:0;transform:scale(1.04);filter:blur(6px)}}
body.entering .app{animation:appin .8s var(--out)}
@keyframes appin{from{opacity:0;transform:scale(.96)}}
.onb-card{position:relative;width:100%;max-width:580px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 8px);box-shadow:0 24px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:cardin .7s var(--spring)}
@keyframes cardin{from{opacity:0;transform:translateY(20px) scale(.97)}}
.onb-top{display:flex;align-items:center;gap:9px;padding:18px 22px 0}
.onb-top b{font-weight:600;font-size:14.5px}
.stepper{margin-left:auto;display:flex;gap:6px;align-items:center}
.stepper button{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .45s var(--spring),background .3s}
.stepper button.done{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.stepper button.cur{width:24px;background:var(--accent)}
.stepper button:disabled{cursor:default}
.onb-body{padding:24px 26px 12px;min-height:380px;position:relative;overflow:hidden}
.onb-body h1{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.2}
.onb-body h2{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px;line-height:1.25}
.lede{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.onb-foot{display:flex;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.onb-foot .why{flex:1;font-size:12.5px;color:var(--muted)}
.onb-foot .why.ok{color:var(--accent-text)}
.onb-foot .btn.primary{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .2s var(--spring),background .2s,opacity .2s,box-shadow .2s,border-color .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){box-shadow:0 0 0 4px var(--accent-soft)}
.btn.ghost{color:var(--muted)}.btn.ghost:hover:not(:disabled){background:var(--raise);color:var(--text)}
.btn.line{border:1px solid var(--line)}.btn.line:hover:not(:disabled){border-color:var(--faint)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.inp.big{font-size:18px;padding:13px 15px}
.inp.bad,.inp.bad:focus{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.greet{display:flex;align-items:center;gap:12px;margin-top:18px;min-height:44px}
.greet p{margin:0;color:var(--muted);font-size:14px}
.greet p b{color:var(--text);font-weight:500}
.ava{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;font-weight:600;font-size:16px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--text)));color:var(--accent-ink)}
.ava.bump{animation:bump2 .4s var(--spring)}
@keyframes bump2{50%{transform:scale(1.14) rotate(-5deg)}}
.greet.in{animation:rise .4s var(--out)}
.spark-hero{display:block;animation:sparkin 1s var(--spring) both}
@keyframes sparkin{from{transform:scale(0) rotate(-120deg);opacity:0}}
.spark-hero .glow{animation:glow 3.2s ease-in-out infinite;transform-origin:32px 32px}
@keyframes glow{50%{opacity:.4;transform:scale(1.18)}}
.spark-hero .mini{transform-origin:46px 18px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.6) rotate(45deg);opacity:.6}}
.pane{animation:paneIn .45s var(--out) both}
.pane.back{animation-name:paneBack}
@keyframes paneIn{from{opacity:0;transform:translateX(28px)}}
@keyframes paneBack{from{opacity:0;transform:translateX(-28px)}}
.drifts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.drift{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;animation:drift 10s linear infinite}
@keyframes drift{0%{opacity:0;transform:translateY(0)}20%{opacity:.45}100%{opacity:0;transform:translateY(-320px)}}

/* Provider cards */
.pcard{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--panel);transition:border-color .3s}
.pcard.open{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.pcard.connected{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.pcard.celebrate{animation:celebrate 1.1s var(--out)}
@keyframes celebrate{0%{box-shadow:0 0 0 0 var(--accent-soft)}35%{box-shadow:0 0 0 10px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.pcard.nope{animation:shake .4s var(--out)}
.pc-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.plogo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--raise);color:var(--text);flex-shrink:0}
.pc-head .nm{flex:1;min-width:0}
.pc-head .nm b{display:block;font-weight:600;font-size:15px}
.pc-head .nm small{display:block;color:var(--muted);font-size:12.5px}
.pill-ok{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent-text);animation:popin .5s var(--spring)}
.pc-head>.chev{color:var(--faint);transition:transform .3s var(--out)}
.pcard.open .pc-head>.chev{transform:rotate(90deg)}
.pc-body{padding:0 16px 16px}
.methods{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:var(--r-sm);background:var(--raise);margin-bottom:14px}
.methods button{position:relative;z-index:1;padding:7px 4px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.methods button[aria-selected="true"]{color:var(--text);font-weight:500}
.m-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .4s var(--spring)}
.mpanel{animation:fade .3s var(--out)}
.mpanel p,.chg-note{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.mpanel code,.vlog code,.conn-sum code{font-family:"Geist Mono",monospace;font-size:12.5px;background:var(--raise);padding:1px 5px;border-radius:5px;color:var(--text)}
.keyrow{display:flex;gap:8px;margin-bottom:6px}
.keyrow .inp{font-family:"Geist Mono",monospace;font-size:13.5px;padding:9px 12px}
.hintline{font-size:12.5px;color:var(--faint);margin:6px 0 12px;min-height:18px;transition:color .2s}
.hintline.bad{color:var(--danger)}
.hintline[data-dmsg]:empty{display:none}
.hintline.good{color:var(--accent-text)}
.vlog{list-style:none;margin:12px 0 0;padding:0}
.vlog:empty{display:none}
.vlog li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);padding:3px 0;animation:rise .35s var(--out) both}
.vlog li .ic{margin-top:3px}
.vlog li.bad{color:var(--danger)}
.vlog li.good{color:var(--text)}
.xic{color:var(--danger)}
.conn-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px}
.conn-sum>span{flex:1;min-width:200px}
.dhead{font-size:15px;font-weight:600;margin:26px 0 12px}

/* Defaults */
.dsec{margin-bottom:24px;animation:rise .45s var(--out) both}
.dsec h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:15px;font-weight:600}
.dsec h3 .plogo{width:28px;height:28px;border-radius:8px}
.dlabel{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcard{text-align:left;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:border-color .2s,background .2s,transform .2s var(--spring)}
.rcard:hover{border-color:var(--faint)}
.rcard:active{transform:scale(.97)}
.rcard[aria-checked="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.rcard b{display:block;font-size:13.5px;font-weight:500}
.rcard small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:border-color .2s,background .2s}
.rrow:hover{border-color:var(--faint)}
.rrow[aria-checked="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);margin-top:2px;flex-shrink:0;display:grid;place-items:center;transition:border-color .2s}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .3s var(--spring)}
[aria-checked="true"]>.radio{border-color:var(--accent-text)}
[aria-checked="true"]>.radio::after{transform:scale(1)}
.rrow b{display:block;font-size:13.5px;font-weight:500}
.rrow small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.rrow.warnrow small{color:var(--warn)}

/* Connectors */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);transition:border-color .3s;animation:rise .45s var(--out) both}
.ccard.connected{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .top b{font-weight:600;font-size:14.5px;flex:1}
.ccard .top .plogo{width:32px;height:32px;border-radius:9px}
.ccard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45;flex:1}
.ccard .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.ccard .state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}

/* Done */
.done-wrap{text-align:center;padding-top:6px}
.done-wrap .spark-hero{margin:0 auto}
.done-list{list-style:none;padding:0;margin:18px auto 0;max-width:380px;text-align:left}
.done-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;animation:rise .45s var(--out) both}
.done-list li:last-child{border:0}
.done-list li .ic{margin-top:4px}
.done-list b{font-weight:500}
.done-list small{color:var(--muted);display:block;font-size:12.5px}

/* Particles */
.spk{position:fixed;z-index:300;border-radius:50%;pointer-events:none;background:var(--accent)}
.spk.star{border-radius:1px}
.spk.warm{background:var(--warn)}

/* Settings */
.set{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.42);animation:fade .25s}
.set.closing{animation:fadeout .2s forwards}
@keyframes fadeout{to{opacity:0}}
.set-panel{width:100%;max-width:840px;height:min(660px,100%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;animation:cardin .45s var(--spring)}
.set-nav{width:196px;flex-shrink:0;padding:16px 10px;border-right:1px solid var(--line);background:var(--bg)}
.set-nav h2{font-size:15px;font-weight:600;margin:2px 10px 14px}
.set-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:14px;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.set-nav button:hover{background:var(--raise);color:var(--text)}
.set-nav button[aria-selected="true"]{background:var(--raise);color:var(--text);font-weight:500}
.set-nav .badge{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column}
.set-head{display:flex;align-items:center;padding:14px 14px 0 26px}
.set-head h3{flex:1;margin:0;font-size:17px;font-weight:600}
.set-body{flex:1;overflow-y:auto;padding:12px 26px 26px}
.set-body>div{animation:fade .3s var(--out)}
.themes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{padding:8px;border-radius:var(--r);border:1px solid var(--line);text-align:left;transition:border-color .2s,transform .25s var(--spring),box-shadow .2s}
.tcard:hover{transform:translateY(-2px)}
.tcard[aria-checked="true"]{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.tprev{height:70px;border-radius:calc(var(--r-sm) + 2px);margin-bottom:8px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.tprev i{position:absolute;border-radius:4px}
.tcard b{display:block;font-size:13px;font-weight:500;padding:0 4px 2px}
.sep{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.sep b{font-size:14px;font-weight:500}
.sep p{margin:4px 0 10px;color:var(--muted);font-size:13.5px}

/* Sidebar footer + picker extras */
.brandrow{display:flex;align-items:center;gap:8px;flex:1;padding-left:4px}
.brandrow b{font-weight:600;padding:0!important}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 4px 0;border-top:1px solid var(--line);margin-top:8px}
.side-foot .ava{width:30px;height:30px;border-radius:9px;font-size:12px;cursor:pointer}
.side-foot .who2{flex:1;min-width:0;line-height:1.25;text-align:left}
.side-foot b{display:block;font-size:13.5px;font-weight:500}
.side-foot small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .icon-btn:hover svg{transform:rotate(60deg)}
.side-foot .icon-btn svg{transition:transform .5s var(--spring)}
.mgroup{font-size:12px;color:var(--faint);padding:8px 10px 2px}
.perm{border-top:1px solid var(--line);margin-top:6px}
.perm-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 6px 6px;font-size:13px;font-weight:500}
.perm-head span{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.perm .chev{color:var(--faint);transition:transform .3s var(--out)}
.perm.open .chev{transform:rotate(90deg)}
.perm .rlist{padding:4px 2px 6px}
.perm .rrow{padding:7px 10px}
.mpop{max-height:min(560px,calc(100vh - 160px));overflow-y:auto}

@media (max-width:640px){
  .cards3,.cgrid{grid-template-columns:1fr}
  .set{padding:0}
  .set-panel{height:100%;max-width:none;border-radius:0;border:0;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .set-nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
  .set-nav h2{display:none}
  .set-nav button{width:auto;white-space:nowrap}
  .set-head{padding:12px 10px 0 18px}.set-body{padding:10px 18px 24px}
  .onb{padding-left:10px;padding-right:10px}
  .onb-body{padding:20px 18px 10px;min-height:0}
  .onb-foot{padding:12px 14px 14px}
  .onb-foot{flex-wrap:wrap}
  .onb-foot .why{order:-1;flex-basis:100%}
  .onb-foot .why:empty{display:none}
  .methods button{font-size:12.5px;gap:4px}
}

/* ================= App rail + views ================= */
.rail{width:70px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px;position:relative}
.rail-logo{width:44px;height:44px;display:grid;place-items:center;margin-bottom:10px;border-radius:14px;transition:background .2s}
.rail-logo:hover{background:var(--raise)}
/* ---- Blob Scout (logo with moods) ---- */
.scout{overflow:visible;--sc-a:var(--accent);--sc-b:var(--warn);--sc-eye:#0c0f12;cursor:pointer;-webkit-tap-highlight-color:transparent}
body[data-skin="contrast"] .scout,body[data-skin="fjord"] .scout,body[data-skin="lagoon"] .scout,body[data-skin="iris"] .scout{--sc-eye:#fff}
.scout .sc-hop,.scout .sc-body{transform-box:view-box}
.scout .sc-body{transform-origin:32px 58px;animation:sc-breathe 3.4s ease-in-out infinite}
@keyframes sc-breathe{50%{transform:scale(1.03,.97)}}
.scout .sc-eye{fill:var(--sc-eye);transform-box:fill-box;transform-origin:center;animation:sc-blink 4.8s infinite;transition:opacity .2s}
.scout .sc-eye:nth-of-type(2){animation-delay:.04s}
@keyframes sc-blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.scout .sc-look{transition:transform .3s var(--out)}
.scout .sc-spark{transform-box:fill-box;transform-origin:center;animation:sc-twinkle 3s ease-in-out infinite}
@keyframes sc-twinkle{50%{transform:rotate(45deg) scale(.78);opacity:.8}}
.scout .sc-ant{transform-box:view-box;transform-origin:38px 19px}
.scout .sc-happy,.scout .sc-sleep{fill:none;stroke:var(--sc-eye);stroke-width:2.8;stroke-linecap:round;opacity:0;transition:opacity .2s}
.scout .sc-cheeks{fill:var(--sc-b);opacity:0;transition:opacity .3s}
.scout.working .sc-spark{animation:sc-spin .9s linear infinite;filter:drop-shadow(0 0 3px var(--sc-b))}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.scout.working .sc-look{animation:sc-scan 2.2s ease-in-out infinite}
@keyframes sc-scan{0%,100%{transform:translate(-1.8px,-1px)}50%{transform:translate(1.8px,-1px)}}
.scout.alert .sc-ant{animation:sc-wiggle .45s ease-in-out infinite}
@keyframes sc-wiggle{50%{transform:rotate(-12deg)}}
.scout.alert .sc-spark{animation:sc-ping .9s ease-in-out infinite}
@keyframes sc-ping{50%{transform:scale(1.4)}}
.scout.alert .sc-eye{animation:none;transform:scaleY(1.12)}
.scout.happy .sc-eye,.scout.sleep .sc-eye{opacity:0}
.scout.happy .sc-happy,.scout.sleep .sc-sleep{opacity:1}
.scout.happy .sc-cheeks{opacity:.55}
.scout.happy .sc-hop{animation:sc-hop .55s var(--spring) 2}
@keyframes sc-hop{40%{transform:translateY(-6px)}}
.scout.sad .sc-eye{animation:none;transform:translateY(2px) scaleY(.62)}
.scout.sad .sc-spark{animation:none;opacity:.35}
.scout.sad .sc-ant{transform:rotate(18deg)}
.scout.sleep .sc-spark{animation:none;opacity:.4}
.scout.poke .sc-body{animation:sc-squish .5s var(--spring)}
@keyframes sc-squish{30%{transform:scale(1.14,.84)}60%{transform:scale(.94,1.07)}}
.scout-say{position:absolute;left:68px;top:12px;z-index:45;width:max-content;max-width:250px;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--text);color:var(--panel);font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateX(-8px) scale(.94);transform-origin:left top;pointer-events:none;transition:opacity .2s,transform .4s var(--spring)}
.scout-say.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.hh{display:flex;align-items:center;gap:14px}
.empty .scout{display:block;margin:0 auto 14px}
.hero-scout{display:block}
.done-wrap .hero-scout{margin:0 auto}
.rail-ind{position:absolute;left:7px;top:0;width:56px;height:52px;border-radius:13px;background:var(--raise);transition:transform .5s var(--spring),height .3s;pointer-events:none}
.rail-ind::before{content:"";position:absolute;left:-7px;top:15px;bottom:15px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail-btn{position:relative;z-index:1;width:56px;padding:8px 0 6px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s}
.rail-btn svg{transition:transform .3s var(--spring),color .2s}
.rail-btn:hover{color:var(--text)}
.rail-btn:hover svg{transform:translateY(-2px)}
.rail-btn:active svg{transform:scale(.88)}
.rail-btn[aria-current="page"]{color:var(--text)}
.rail-btn[aria-current="page"] svg{color:var(--accent-text)}
.rbadge{position:absolute;top:3px;right:9px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:#1b1300;font-size:12px;font-weight:700;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:popin .45s var(--spring)}
.rbadge:empty{display:none}
.rail-sp{flex:1}
.rail-ava{width:34px;height:34px;border-radius:11px;font-size:12.5px;margin-top:8px;transition:transform .25s var(--spring)}
.rail-ava:hover{transform:scale(1.08)}
.view{flex:1;display:flex;min-width:0;height:100%}
.view[hidden]{display:none!important}
.view.in{animation:viewin .45s var(--out)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.page{margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;flex-direction:column}
.side-foot{display:none}

/* Home */
.home{flex:1;overflow-y:auto}
.home-wrap{max-width:860px;margin:0 auto;padding:44px 28px 56px}
.home-hero h1{font-size:30px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.2}
.home-hero p{margin:8px 0 0;color:var(--muted);font-size:15px}
.home-hero p b{color:var(--text);font-weight:500}
.home-compose{display:flex;align-items:center;gap:8px;margin:24px 0 34px;padding:6px 6px 6px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);transition:border-color .2s,box-shadow .3s var(--out)}
.home-compose:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.home-compose input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:9px 0}
.home-compose input::placeholder{color:var(--faint)}
.home-compose select{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted);outline:none;max-width:140px}
.hsec{margin-bottom:30px}
.hsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.hsec-h h2{font-size:15px;font-weight:600;margin:0}
.hsec-h button{font-size:13px;color:var(--muted)}
.hsec-h button:hover{color:var(--text)}
.hlist{display:flex;flex-direction:column;gap:8px}
.hcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s,transform .25s var(--spring),background .2s}
.hcard:hover{border-color:var(--faint);transform:translateY(-1px)}
.home-live.enter .hcard,.home-live.enter .hquiet,.home-live.enter .mrow{animation:rise .45s var(--out) both}
.hc-main{flex:1;min-width:0}
.hc-main b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-main small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj{color:var(--faint);margin-right:8px}
.hcard.asking{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 6%,transparent)}
.hcard.asking small{color:var(--warn)}
.hcard.error small{color:var(--danger)}
.hcard .go{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.hcard.asking .go{background:var(--text);color:var(--panel);border-color:transparent}
.hprog{display:block;height:3px;border-radius:3px;background:var(--raise);margin-top:8px;overflow:hidden}
.hprog i{display:block;height:100%;background:var(--accent);border-radius:3px;animation:progin .6s var(--out)}
@keyframes progin{from{transform:scaleX(.6);transform-origin:left;opacity:.5}}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hquiet{display:flex;align-items:center;gap:10px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13.5px}
.hquiet .btn{margin-left:auto}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);font-size:14px;transition:background .15s}
.mrow:hover{background:var(--raise)}
.mrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .k{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted)}

/* Tickets */
.tk{flex:1;display:flex;flex-direction:column;min-height:0}
.tk-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tk-head h2{margin:0 6px 0 0;font-size:17px;font-weight:600}
.tk-head .seg{width:240px}
.srcname{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tk-search{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--r-sm);background:var(--raise);color:var(--faint);font-size:13.5px}
.tk-search input{border:0;background:transparent;outline:none;width:160px;min-width:0}
.tk-body{flex:1;display:flex;min-height:0;position:relative}
.tk-list{flex:1;overflow-y:auto;min-width:0}
.tk-row{display:grid;grid-template-columns:16px 76px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;transition:background .15s;animation:rise .4s var(--out) both}
.tk-row:hover{background:var(--raise)}
.tk-row.sel{background:var(--accent-soft)}
.tk-key{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted)}
.tk-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-meta{display:flex;align-items:center;gap:10px}
.tk-meta .lk{color:var(--accent-text)}
.spill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--raise);color:var(--muted)}
.spill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.spill.prog{color:var(--accent-text);background:var(--accent-soft)}
.spill.rev{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.spill.done{color:var(--faint);text-decoration:line-through}
.spill.pop{animation:popin .45s var(--spring)}
.pri{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.pri i{width:3px;border-radius:1px;background:var(--line)}
.pri i:nth-child(1){height:5px}.pri i:nth-child(2){height:8px}.pri i:nth-child(3){height:12px}
.pri i.on{background:var(--muted)}
.pri.high i.on{background:var(--warn)}
.tk-detail{width:430px;flex-shrink:0;border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 28px;animation:slidein .4s var(--out)}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}}
.tk-detail h3{font-size:19px;font-weight:600;line-height:1.3;margin:6px 0 14px;letter-spacing:-.01em}
.tk-detail p{color:var(--muted);font-size:14px;margin:0 0 14px}
.tk-detail ul{margin:0 0 16px;padding-left:18px;font-size:14px;color:var(--muted)}
.tk-detail li{margin:4px 0}
.tk-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tk-props{display:grid;grid-template-columns:84px 1fr;gap:10px 12px;align-items:center;font-size:13.5px;margin:0 0 20px}
.tk-props dt{color:var(--faint)}
.tk-props dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-props .seg{width:100%}
.tk-props .seg button{font-size:12px}
.lbl{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--raise);color:var(--muted)}
.linked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px;margin-top:6px}
.tk-none{display:grid;place-items:center;text-align:center;color:var(--faint);font-size:14px}
.tk-back{display:none;margin:-6px 0 8px -10px}
.tk-empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px 22px;overflow-y:auto}
.tk-empty>div{max-width:440px}
.tk-empty .big{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;margin:0 auto 16px;animation:sparkin .8s var(--spring) both}
.tk-empty h2{margin:0 0 8px;font-size:21px;font-weight:600}
.tk-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media (max-width:1000px){.hgrid{grid-template-columns:1fr}}
@media (max-width:900px){
  .tk-detail{position:absolute;inset:0;width:auto;border:0;background:var(--panel);z-index:5}
  .tk-none{display:none}
  .tk-back{display:inline-flex}
  .tk-row{grid-template-columns:16px 1fr auto}
  .tk-row .tk-key{display:none}
}
@media (max-width:640px){
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:calc(60px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;align-items:flex-start;padding:4px 6px env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);z-index:18;gap:0}
  .rail-logo,.rail-sp,.rail-ava,.rail-ind{display:none}
  .rail-btn{flex:1;width:auto}
  .rail-btn[aria-current="page"]::after{content:"";position:absolute;top:-4px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--accent);animation:popin .35s var(--spring)}
  .rbadge{right:calc(50% - 22px)}
  .app{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .page{margin:0;border:0;border-radius:0}
  .home-wrap{padding:26px 16px 32px}
  .home-hero h1{font-size:25px}
  .home-compose select{max-width:110px}
  .tk-head{padding:12px 14px}
  .tk-head .seg{width:100%;order:3}
  .tk-search{margin-left:0;flex:1}
  .tk-row{padding:12px 14px}
  .tk-meta .spill{display:none}
}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .6s var(--out)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0))}}

.ctxbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;margin-left:2px;border-radius:var(--r-sm);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background .15s,color .2s}
.ctxbtn:hover,.ctxbtn[aria-expanded="true"]{background:var(--raise);color:var(--text)}
.ctxbtn svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:2.6}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:50.27;stroke-dashoffset:50.27;transition:stroke-dashoffset .8s var(--spring),stroke .3s}
.ctxbtn[data-level="warm"] .ring-fg{stroke:var(--warn)}
.ctxbtn[data-level="hot"] .ring-fg{stroke:var(--danger)}
.ctxbtn[data-level="hot"]{color:var(--danger)}
.ctxbtn[data-level="hot"] svg{animation:ctxpulse 2.2s ease-in-out infinite}
@keyframes ctxpulse{50%{filter:drop-shadow(0 0 4px var(--danger))}}
.ctxbtn.tick .ctxpct{animation:bump .4s var(--spring)}
.ctxpop{width:300px;padding:14px}
.ctx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.ctx-h b{font-size:14px;font-weight:600;white-space:nowrap}
.ctx-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx-bar{display:flex;height:8px;border-radius:999px;background:var(--raise);overflow:hidden;gap:1px}
.ctx-bar i{height:100%;animation:barin .6s var(--out) both;transform-origin:left}
@keyframes barin{from{transform:scaleX(0)}}
.ctx-legend{display:grid;gap:6px;margin:12px 0}
.ctx-legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.ctx-legend i{width:8px;height:8px;border-radius:2px}
.ctx-legend .free i{background:var(--raise);box-shadow:inset 0 0 0 1px var(--line)}
.ctx-legend span{flex:1;color:var(--muted)}
.ctx-legend b{font-weight:500;font-variant-numeric:tabular-nums}
.ctx-note{margin:0 0 12px;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:var(--r-sm);background:var(--raise);color:var(--muted)}
.ctx-note.warm{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--text)}
.ctx-note.hot{background:var(--danger-soft);color:var(--text)}
.ctx-foot{display:flex;align-items:center;gap:10px}
.ctx-foot small{flex:1;color:var(--faint);font-size:12px;line-height:1.35}
@media (max-width:640px){.ctxpct{display:none}.ctxbtn{padding:0 6px}}
.agent-head{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.agent-ava{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}
.agent-ava svg,.pblob svg,.hblob svg,.mblob svg,.blobava svg{display:block;overflow:visible}
.agent-head .mood{font-weight:400;color:var(--faint);font-size:12px;animation:fade .3s var(--out)}
.pblob{background:transparent!important}
.hblob{position:relative;width:36px;height:36px;flex-shrink:0;display:grid;place-items:center}
.hdot{position:absolute;right:-1px;bottom:1px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.hdot.asking{background:var(--warn)}.hdot.error{background:var(--danger)}.hdot.done{background:var(--accent)}.hdot.running{background:var(--accent);animation:pulse 1.4s infinite}
.mblob{width:18px;height:18px;display:grid;place-items:center}
.ava.blobava{background:var(--raise);color:inherit;overflow:hidden;padding:2px}
.ava.blobava svg{width:100%;height:100%;transform:scale(1.22)}
textarea:focus-visible,.home-compose input:focus-visible,.search input:focus-visible,.tk-search input:focus-visible{outline:none}
.hgrid>section{min-width:0}
.scrim{display:none}
#sideToggle{position:relative}
#sideToggle.alert::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel);animation:popin .4s var(--spring)}
@media (max-width:1000px){
  .side,.side-in{width:232px}
}
@media (max-width:640px){
  .side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:288px;background:var(--bg);transform:translateX(-100%);transition:transform .35s var(--out);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.collapsed .side{width:288px;opacity:1}
  .side-in{width:288px}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);animation:fade .25s}
  .main,body.collapsed .main{margin:0;border:0;border-radius:0}
  .inner{padding:0 16px}.cwrap{padding:0 10px 10px}
  .hint,.branch{display:none}
  .bubble{max-width:88%}
}
/* Approval card */
.appr{margin:12px 0 4px;border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--warn) 6%,var(--panel));overflow:hidden;animation:rise .45s var(--out) both;transition:border-color .3s,background .3s}
.appr-h{display:flex;align-items:center;gap:10px;padding:12px 14px 0;font-size:13.5px}
.appr-h b{font-weight:600}
.appr-h .ic{width:16px;height:16px}
.appr pre{margin:10px 14px 0;padding:9px 12px;border-radius:var(--r-sm);background:var(--code);border:1px solid var(--line);font:12.5px/1.5 "Geist Mono",ui-monospace,monospace;overflow-x:auto;color:var(--text);white-space:pre}
.appr p{margin:8px 14px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.appr p code{font-size:12px}
.appr-acts{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 14px}
.btn.deny{color:var(--danger)}.btn.deny:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.appr.decided{border-color:var(--line);background:var(--panel)}
.appr.denied{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.appr-res{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;font-size:13px;color:var(--muted);animation:fade .3s var(--out)}
.appr-res b{color:var(--text);font-weight:500}
.appr-res .link{color:var(--accent-text)}
.review-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:2px 9px;border-radius:999px;background:var(--raise);margin-bottom:8px}
.lchip{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;margin-bottom:6px;text-align:left;transition:border-color .2s;animation:rise .35s var(--out) both}
.lchip:hover{border-color:var(--faint)}
.lchip>svg{color:var(--muted)}
.lchip .t{flex:1;min-width:0}
.lchip .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lchip .t small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lchip .k{font-family:"Geist Mono",monospace;font-size:12px;color:var(--faint)}
.lchip .pend-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.lchip .pass-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.addlink{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px;border:1px dashed var(--line);border-radius:var(--r-sm);font-size:12.5px;color:var(--muted);transition:border-color .2s,color .2s}
.addlink:hover{border-color:var(--faint);color:var(--text)}
@media (prefers-reduced-motion:reduce){.tv-pk{display:none}.ok path,.status .check path,.enter .dchk path{stroke-dashoffset:0!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,::view-transition-new(root){animation:none!important;transition:none!important}}
/* ================= Tickets mockup additions (built only from the tokens above) ================= */
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Mockup chrome: not part of the app */
.mock-bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px dashed var(--line-strong);background:var(--bg);font-size:13px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.mock-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px dashed var(--warn);color:var(--warn);font-weight:600;font-size:12px}
.mock-bar b{color:var(--text);font-weight:600}
.mock-nav{display:flex;align-items:center;gap:2px}
.mock-nav span{color:var(--faint);margin-right:4px;font-size:12px}
.mock-nav a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:var(--r-sm);font-size:12.5px}
.mock-nav a:hover{background:var(--raise);color:var(--text)}
.mock-nav a[aria-current="page"],.mock-nav a[aria-current="true"]{background:var(--raise);color:var(--text);font-weight:500}
.mock-theme{margin-left:auto;display:flex;align-items:center;gap:8px}
.mock-theme .seg{width:140px}
.app{height:calc(100% - 44px)}
#toasts{position:fixed;left:84px;bottom:16px;z-index:120;width:340px}

/* Header, filters */
.tk-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tk-right .tk-search{margin-left:0}
.synced{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint)}
.synced.bad{color:var(--danger)}
.segn{font-size:12px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.tk-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
.tk-tools .sp{flex:1}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);transition:border-color .2s,background .2s,color .2s}
.fchip:hover{border-color:var(--faint);color:var(--text)}
.fchip[aria-pressed="true"]{border-color:var(--accent-text);background:var(--accent-soft);color:var(--text);font-weight:500}
.fchip .n{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.fsel-w{position:relative;display:inline-flex;align-items:center}
.fsel-w>svg{position:absolute;right:10px;pointer-events:none;color:var(--faint)}
.fsel{appearance:none;-webkit-appearance:none;padding:5px 30px 5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
.fsel:hover{border-color:var(--faint)}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px}

/* Source badge, status, links, sync */
.srcb{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;background:var(--raise);color:var(--muted);flex-shrink:0}
.native{font-size:12px;color:var(--faint);white-space:nowrap}
.tk-st{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.lks{display:flex;align-items:center;gap:8px;color:var(--accent-text);font-size:12px}
.lk{display:inline-flex;align-items:center;gap:3px}
.lk.pr{color:var(--muted);font-family:"Geist Mono",monospace}
.syncx{color:var(--danger);display:inline-flex}
.stale-tag{font-size:12px;padding:0 7px;border-radius:6px;background:var(--panel);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger);white-space:nowrap}
.tk-sub{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-tb{min-width:0}
.upd{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint)}
.cdot.running{background:var(--accent);animation:pulse 1.4s infinite}
.cdot.done{background:var(--accent-text)}
.cdot.asking{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:var(--r-sm);background:var(--raise);margin:-6px 0 18px}
.sync .ok{flex-shrink:0}
.sync.pend{background:color-mix(in srgb,var(--warn) 10%,transparent)}

/* Detail additions */

.ava.mini{width:22px;height:22px;border-radius:7px;font-size:12px}

.xlink{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;color:var(--muted)}

/* Alerts and loading */

@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-row{display:grid;grid-template-columns:16px 20px 76px 1fr 110px;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}

/* Start dialog */
.dlg{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.42);animation:fade .25s}
.dlg-panel{width:100%;max-width:720px;max-height:min(800px,100%);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;animation:cardin .45s var(--spring)}
.dlg-head{display:flex;align-items:flex-start;gap:10px;padding:18px 14px 4px 24px}
.dlg-head>div{flex:1;min-width:0}
.dlg-head h3{margin:0;font-size:17px;font-weight:600}
.dlg-head small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}
.dlg-body{flex:1;overflow-y:auto;padding:4px 24px 18px;position:relative}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.dlg-body .dlabel{font-weight:500;color:var(--text);font-size:13px;margin:16px 0 8px}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:14px 24px 18px;border-top:1px solid var(--line)}
.dlg-foot .why{flex:1;font-size:12.5px;color:var(--muted)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards2 .rcard{display:flex;flex-direction:column;justify-content:flex-start}
.rrow .fi{color:var(--muted);margin-top:1px}
.rrow .mono{font-size:12px;color:var(--faint)}
.selw{position:relative;display:block}
.selw>svg{position:absolute;right:12px;top:50%;margin-top:-6px;pointer-events:none;color:var(--faint)}
.selw select.inp{appearance:none;-webkit-appearance:none;font-size:14px;padding:9px 34px 9px 12px;cursor:pointer}
.check-row{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.45}

.set-hint{margin:6px 0 0;font-size:12.5px;color:var(--faint)}
.pv summary{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-weight:500;cursor:pointer;list-style:none}

.pv pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:var(--code);font:12.5px/1.55 "Geist Mono",ui-monospace,monospace;white-space:pre-wrap;max-height:470px;overflow-y:auto;color:var(--text)}

/* Settings: connectors as compact rows (same card as the AI providers) */
.conn-list{display:flex;flex-direction:column}

.conn-acts{display:flex;gap:8px;margin:0 0 14px}
.sw-one{padding:12px 0;border-top:1px solid var(--line)}
.map-wrap{padding-top:12px;border-top:1px solid var(--line)}

.pill-bad{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:500;background:var(--danger-soft);color:var(--danger)}
.chip-soon{font-size:12px;padding:1px 8px;border-radius:999px;border:1px dashed var(--faint);color:var(--muted)}
.facts{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 10px;font-size:12.5px;margin:0}

.facts dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cform{display:grid;gap:8px}

.cform .inp{font-size:13.5px;padding:8px 11px}
.cform .hintline{margin:0}
.cform .acts{display:flex;gap:8px;align-items:center}
.map-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.map-h .sp{flex:1}
.map{width:100%;border-collapse:collapse;font-size:13.5px}
.map th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--line)}
.map td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.map td.cat{color:var(--muted);font-size:12.5px}
.map td .fsel{border-radius:var(--r-sm)}
.map .lbl{margin-left:8px}

/* Home: Your tickets */
.mrow .srcb{width:18px;height:18px}

@media (max-width:900px){.cards2,.two,.addrows{grid-template-columns:1fr}}

/* Start dialog: what the agent gets */
.ctxbox{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .2s}
.ctxbox.open{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.ctx-sum{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left;border-radius:var(--r)}
.ctx-sum:hover{background:var(--raise)}
.ctx-sum>.chev{color:var(--faint);transition:transform .3s var(--out)}
.ctx-sum[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.ctx-sum-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx-sum-t b{font-size:13.5px;font-weight:500}
.ctx-sum-t span{font-size:12.5px;color:var(--muted);line-height:1.4}
.ctx-tok{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctx-add{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--accent-text);white-space:nowrap}

.ctx-fs{border:0;margin:0;padding:0}

.piece{display:grid;grid-template-columns:16px minmax(0,1fr) auto 70px;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.piece input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.piece label{cursor:pointer}
.piece.none label{color:var(--faint);cursor:default}
.tk-est{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.pc-n .fsel{padding-top:3px;padding-bottom:3px}
.ctx-note{font-size:13.5px;padding:8px 11px;resize:vertical;min-height:58px;max-height:none;display:block}
.ctx-chips{padding:8px 0 0}
.ctxchip small{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addrows{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:10px}
.addrows .inp{font-size:13.5px;padding:7px 11px}
.addrows .selw select.inp{padding:7px 32px 7px 11px;font-size:13.5px}
.addl{font-size:12.5px;color:var(--muted)}
.pv-t{display:flex;align-items:center;gap:8px;margin-top:14px}
.pv-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:4px 6px 4px 2px;border-radius:var(--r-sm)}
.pv-btn>.chev{color:var(--faint);transition:transform .3s var(--out)}
.pv-btn[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.pv-t .native{margin-left:auto}
.pv-pre{margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--code);font:12.5px/1.55 "Geist Mono",ui-monospace,monospace;white-space:pre-wrap;max-height:340px;overflow-y:auto;color:var(--text)}
.pv-pre .hl{color:var(--accent-text)}

/* Variant 3: inbox */
.ib{flex:1;display:flex;min-height:0;position:relative}
.ib-nav{width:216px;flex-shrink:0;border-right:1px solid var(--line);padding:4px 8px 14px;overflow-y:auto}
.ib-sec{padding:14px 10px 4px;font-size:12px;color:var(--faint)}
.ib-item{position:relative;display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.ib-item:hover{background:var(--raise);color:var(--text)}
.ib-item[aria-pressed="true"]{background:var(--raise);color:var(--text);font-weight:500}
.ib-item[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.ib-item .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-item .n{font-size:12px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.ib-item .srcb{width:18px;height:18px}
.ib-item>svg{color:var(--faint)}
.ib-nav .fsel-w,.ib-nav .fsel{width:100%}
.ib-main{flex:1;min-width:0;overflow-y:auto}
.grp-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;width:100%;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint);text-align:left}
.grp-h b{color:var(--text);font-weight:600;font-size:13.5px}
.grp-h .chev{transition:transform .3s var(--out);transform:rotate(90deg)}
.grp-h[aria-expanded="false"] .chev{transform:none}
.grp-h .n{margin-left:auto;font-variant-numeric:tabular-nums}
.grp-h .srcb{width:18px;height:18px}
.irow{display:grid;grid-template-columns:14px 72px minmax(0,1fr) auto auto 70px;align-items:center;gap:10px;width:100%;padding:7px 18px 7px 18px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:left;transition:background .15s}
.irow:hover{background:var(--raise)}
.irow.sel{background:var(--accent-soft)}
.irow .tk-title{min-width:0}
.ir-st{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.irow.stale .tk-title{color:var(--muted)}
.bk{width:13px;height:13px;border-radius:50%;display:inline-block;flex-shrink:0;box-sizing:border-box}
.bk.todo{border:1.5px solid var(--line-strong)}
.bk.prog{border:1.5px solid var(--accent-text);background:conic-gradient(var(--accent-text) 0 50%,transparent 0)}
.bk.rev{border:1.5px solid var(--warn);background:radial-gradient(circle,var(--warn) 0 3px,transparent 3.5px)}
.bk.done{background:var(--faint);-webkit-mask:radial-gradient(circle,#000 6.5px,transparent 7px);box-shadow:inset 0 0 0 3px var(--faint)}
.tk-detail{width:420px}

/* ================= Inbox: the single Tickets layout (decided September 28, 2026) ================= */
.tk-head{gap:12px}
.tk-head h2{flex-shrink:0}
.tk-find{flex:1;min-width:220px;max-width:560px;display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--faint);transition:border-color .2s,box-shadow .2s}
.tk-find:focus-within{border-color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.tk-find input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--text)}
.tk-find input::placeholder{color:var(--faint)}
.tk-find input:focus-visible{outline:none}
.kbd{font:12px/1 "Geist Mono",monospace;padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--faint)}
.tk-find .icon-btn{width:26px;height:26px}
.scope{font-size:12.5px;color:var(--muted);padding:8px 18px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scope b{font-weight:500;color:var(--text)}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
.fbar .sp{flex:1}
.fbar .seg{width:210px}
.fsel.on{border-color:var(--accent-text);background:var(--accent-soft)}
.fclear{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* Smart views in the side column */
.ib-nav{width:208px}
.ib-item .dotw{width:15px;display:grid;place-items:center}
.ib-item.attn .n{color:var(--warn);font-weight:600}
.ib-foot{margin:18px 10px 0;font-size:12px;color:var(--faint);line-height:1.45}

/* Brief strip (the ticket slice of the Home brief) */
.brief{margin:12px 18px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.brief-h{display:flex;align-items:center;gap:10px;padding:8px 8px 0 12px}
.brief-h .icon-btn{width:28px;height:28px}
.brief-h h3{margin:0;font-size:14px;font-weight:600}
.brief-meta{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.brief-h .sp{flex:1}
.brief-h .hlink{font-size:12.5px;color:var(--muted);padding:4px 6px;border-radius:var(--r-sm)}
.brief-h .hlink:hover{background:var(--raise);color:var(--text)}
.brief ol{list-style:none;margin:6px 0 0;padding:0 6px 6px}
.bi{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 6px;border-radius:var(--r-sm)}
.bi:hover{background:var(--raise)}
.bi .num{width:20px;height:20px;border-radius:6px;background:var(--raise);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.bi p{margin:0;font-size:13.5px;line-height:1.45}
.bi p .kref{font-family:"Geist Mono",monospace;font-size:12.5px;color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.brief-foot{display:flex;align-items:center;gap:8px;padding:0 12px 10px;font-size:12px;color:var(--faint)}
.brief.off{border-style:dashed}
.brief.off .brief-foot{padding-top:6px}
.brief-sk{padding:10px 12px 12px;display:grid;gap:10px}
.brief-sk .sk{height:12px}

/* Sections and rows: lean rows (September 28, 2026). One line: priority, key, title, then one plain reason and a compact age.
   No pills, no source/project/status text in the row. Everything else lives in the detail pane. */
:root{--sel-bg:color-mix(in srgb,var(--accent) 11%,var(--panel));--row-h:40px}
body.compact{--row-h:32px}
body.compact .brief{display:none}
.sec-h{position:relative;display:flex;align-items:center;gap:6px;width:100%;padding:0 18px 0 12px;min-height:38px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.sec-t{display:inline-flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r-sm);text-align:left}
.sec-t:hover{background:var(--raise)}
.sec-h b{color:var(--text);font-weight:600;font-size:13.5px}
.sec-t .chev{transition:transform .3s var(--out);transform:rotate(90deg);color:var(--faint)}
.sec-t[aria-expanded="false"] .chev{transform:none}
.sec-h .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.sec-h.attn b{color:var(--warn)}
.sec-h.static{padding-left:18px}
.tipw{position:relative;display:inline-flex}
.info{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.info:hover{color:var(--text);background:var(--raise)}
.tip{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);z-index:9;width:max-content;max-width:260px;padding:6px 10px;border-radius:var(--r-sm);background:var(--text);color:var(--panel);font-size:12.5px;line-height:1.4;font-weight:400;white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
.tipw:hover .tip,.info:focus-visible+.tip{opacity:1;visibility:visible;pointer-events:auto}
.tipw.hush .tip{opacity:0!important;visibility:hidden!important}
.sec-empty{padding:12px 18px;font-size:13px;color:var(--faint);border-bottom:1px solid var(--line)}
.irow{display:flex;flex-wrap:wrap;align-items:stretch;padding:0;border-bottom:1px solid var(--line);position:relative;background:var(--panel);transition:background .15s;--row-bg:var(--panel)}
.irow:hover{--row-bg:var(--raise);background:var(--row-bg)}
.irow.sel{--row-bg:var(--sel-bg);background:var(--row-bg);box-shadow:inset 3px 0 0 var(--accent-text)}
.ir-main{flex:1;min-width:0;min-height:var(--row-h);display:grid;grid-template-columns:10px 16px 66px minmax(0,1fr) auto 34px;align-items:center;column-gap:10px;padding:0 18px 0 10px;text-align:left;font-size:13.5px}
.ir-main:focus-visible{outline:2px solid var(--accent-text);outline-offset:-2px;border-radius:0}
.ir-main.st{grid-template-columns:10px 14px 16px 66px minmax(0,1fr) auto 34px}
.ir-main .tk-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcl{font:500 10px/1 "Geist Mono",monospace;color:var(--faint);opacity:0;transition:opacity .15s;text-align:center}
.irow:hover .srcl,.irow:focus-within .srcl,.irow.sel .srcl{opacity:1}
.why-r{display:inline-flex;align-items:center;gap:6px;min-width:0;justify-content:flex-end;font-size:12.5px;color:var(--muted);white-space:nowrap}
.why-r .txt{overflow:hidden;text-overflow:ellipsis}
.sev{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:transparent}
.sev.warn{background:var(--warn)}
.sev.bad{background:var(--danger)}
.sev.run{background:var(--accent);animation:pulse 1.4s infinite}
.more{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.syncw{display:inline-grid;place-items:center;color:var(--danger)}
.syncw.stale{color:var(--warn)}
.age{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ir-acts{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding-left:12px;background:var(--row-bg);opacity:0;pointer-events:none;transition:opacity .12s}
.irow:hover .ir-acts,.irow:focus-within .ir-acts,.irow.sel .ir-acts,.ir-acts.pin{opacity:1;pointer-events:auto}
/* The action takes the place of the reason and age; the detail pane lists every reason */
.irow.acts:hover .ir-main>.why-r,.irow.acts:hover .ir-main>.age,.irow.acts:focus-within .ir-main>.why-r,.irow.acts:focus-within .ir-main>.age,.irow.acts.sel .ir-main>.why-r,.irow.acts.sel .ir-main>.age,.irow.pinned .ir-main>.why-r,.irow.pinned .ir-main>.age{visibility:hidden}
.qa{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
.qa:hover:not(:disabled){background:color-mix(in srgb,var(--text) 7%,transparent)}
.qa.primary{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent-text) 45%,transparent);font-weight:600}
.qa.primary:hover:not(:disabled){background:var(--accent-soft)}
.qa:disabled{opacity:.45;cursor:not-allowed}
.qa.done{color:var(--accent-text)}
.pri.urgent{width:14px;height:14px;border-radius:4px;background:var(--warn);color:var(--warn-ink);display:inline-grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.pri.none i{background:var(--line)}
.who-ava{width:18px;height:18px;border-radius:6px;font-size:12px;font-weight:600;display:inline-grid;place-items:center;background:var(--raise);color:var(--muted)}
.who-ava.me{background:var(--accent);color:var(--accent-ink)}
.unass{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line-strong);display:inline-block}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--accent-text);display:inline-block;animation:pulse 1.4s infinite}
.pend-line{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}

/* Assign confirm */
.confirm{position:absolute;right:14px;top:calc(100% - 4px);z-index:8;width:320px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);animation:menuin .24s var(--spring)}
.confirm p{margin:0 0 10px;font-size:13.5px;line-height:1.45}
.confirm small{display:block;margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.confirm .acts{display:flex;justify-content:flex-end;gap:8px}
.irow{flex-wrap:wrap}
.inline-err{flex-basis:100%;display:flex;align-items:flex-start;gap:8px;padding:8px 18px 10px 58px;font-size:12.5px;color:var(--text);background:var(--danger-soft);border-bottom:1px solid var(--line)}
.inline-err svg{color:var(--danger);margin-top:2px}
.res-h{padding:14px 18px 6px;font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line)}
.res-h b{font-size:13.5px;color:var(--text);font-weight:600}
.src-note{display:flex;align-items:center;gap:8px;margin:10px 18px 0;padding:8px 12px;border-radius:var(--r-sm);background:var(--raise);font-size:12.5px;color:var(--muted)}

/* Detail additions */
.whybox{margin:-6px 0 18px;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn) 9%,transparent);box-shadow:inset 3px 0 0 var(--warn);font-size:13px}
.whybox b{display:block;font-weight:600;margin-bottom:4px}
.whybox ul{margin:0;padding-left:16px;color:var(--text)}
.whybox li{margin:2px 0}
.whybox li small{color:var(--muted)}
.prbox{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;margin-top:6px}
.prbox dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:8px 0 0}
.prbox dt{color:var(--faint)}
.prbox dd{margin:0}
.na-txt{color:var(--muted);font-style:italic}
.dep{font-size:12px;color:var(--faint);margin:6px 0 0}

/* Skeletons: shaped like the content, never a spinner */
.sk-nav{display:grid;gap:12px;padding:16px 12px}
.sk-sec{display:flex;gap:10px;align-items:center;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.sk-irow{display:grid;grid-template-columns:10px 16px 66px minmax(0,1fr) 130px 34px;gap:10px;align-items:center;min-height:var(--row-h);padding:0 18px 0 10px;border-bottom:1px solid var(--line)}
.sk.c{border-radius:50%}
.sk-detail{padding:22px;display:grid;gap:12px}
.sk-detail .sk{height:12px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* Toast with undo */
.toast .undo{margin-left:auto}

@media (max-width:1180px){
  .tk-detail{position:absolute;top:0;right:0;bottom:0;z-index:6;background:var(--panel);box-shadow:-24px 0 60px rgba(0,0,0,.2)}
  .tk-none{display:none}
}
@media (max-width:900px){
  .ib-nav{display:none}

  .ir-main,.ir-main.st{grid-template-columns:16px 58px minmax(0,1fr) 34px;grid-template-areas:"pri key title age" ". . why why";row-gap:2px;padding:8px 14px 8px 12px}
  .ir-main .srcl,.ir-main .bk{display:none}
  .ir-main .pri{grid-area:pri}.ir-main .tk-key{grid-area:key}.ir-main .tk-title{grid-area:title}.ir-main .age{grid-area:age}
  .ir-main .why-r{grid-area:why;justify-content:flex-start}
  .ir-acts{top:auto;bottom:4px;height:30px}
}

.bi .ir-acts{position:static;opacity:1;pointer-events:auto;background:none;padding:0}
.why-l{margin-top:2px}
.why-l .why-r{justify-content:flex-start}

  {id:"review-slow",kind:"warn",rule:"In review for 3 days or more.",test:t=>t.b==="In review"&&(t.statusDays||0)>=3,reason:t=>[t.pr?`PR #${t.pr.n} in review`:"In review",days(t.statusDays),`In review for ${t.statusDays} days`],long:t=>`In review ${t.statusDays} days · review status not available yet`}
];
const dueWord=t=>t.dueDays<0?`Overdue by ${-t.dueDays} days`:t.dueDays===0?"Due today":t.dueDays===1?"Due tomorrow":`Due in ${t.dueDays} days`;
const flagsOf=t=>mine(t)?RULES.filter(r=>r.test(t)):[];

/* ---------- Smart views: every ticket assigned to you lands in exactly one ---------- */
const SECTIONS=[
  ["attn","Needs attention","Flagged by rules; each row says why."],
  ["work","Working on","A linked chat is running or open, or the ticket is in progress."],
  ["pr","PR ready","Spark opened a draft PR. Review and CI status aren't read yet."],
  ["review","In review","Waiting on others. Age counts from when it entered review."],
  ["next","Up next","Assigned to you, not started. Highest priority first."],
  ["done","Done recently","Finished in the last 7 days."]
];
function sectionOf(t){
  if(!mine(t))return null;
  if(flagsOf(t).length)return "attn";
  if(t.b==="Done")return "done";
  if(t.pr)return "pr";
  if(t.chat||t.b==="In progress")return "work";
  if(t.b==="In review")return "review";
  return "next";
}
const ruleRank=t=>{const f=flagsOf(t);return f.length?RULES.indexOf(f[0]):9};
function sortIn(sec,list){
  if(sec==="attn")return list.sort((a,b)=>ruleRank(a)-ruleRank(b)||b.pri-a.pri);
  if(sec==="next")return list.sort((a,b)=>b.pri-a.pri||(a.dueDays??99)-(b.dueDays??99));
  return list;
}

/* ---------- State ---------- */
const S={q:"",src:"all",proj:"all",sprint:"any",pri:"any",label:"any",who:"any",view:"all",sel:"API-81",error:false,loading:false,empty:false,
  compact:false,brief:"on",briefPop:false,confirm:null,assignErr:null,collapsed:{done:true},startKey:"API-84",startMode:"plan"};
function passes(t){
  if(S.src!=="all"&&srcOf(t)!==S.src)return false;
  if(S.proj!=="all"&&t.p!==S.proj)return false;
  if(S.sprint!=="any"){const sp=PROJ[t.p].sprint;if(S.sprint==="none"?sp:sp!==S.sprint)return false}
  if(S.pri!=="any"&&t.pri<+S.pri)return false;
  if(S.label!=="any"&&!t.labels.includes(S.label))return false;
  return true;
}
function searching(){return S.q.trim().length>0}
function searchHits(){
  const q=S.q.trim().toLowerCase();
  return T.filter(t=>passes(t)&&(`${t.key} ${t.title} ${t.labels.join(" ")}`).toLowerCase().includes(q)
    &&(S.who==="any"||(S.who==="none"?!t.who:t.who===S.who)));
}
function inbox(){
  const list=T.filter(t=>mine(t)&&passes(t));
  return SECTIONS.map(([id,label,rule])=>[id,label,rule,sortIn(id,list.filter(t=>sectionOf(t)===id))]);
}
const stale=t=>S.error&&srcOf(t)==="jira";

/* ---------- Small pieces ---------- */
const spill=b=>`<span class="spill ${b==="In progress"?"prog":b==="In review"?"rev":b==="Done"?"done":""}">${b}</span>`;
const priHTML=n=>n===4?`<span class="pri urgent" role="img" aria-label="Urgent priority">!</span>`:`<span class="pri${n===3?" high":""}${n===0?" none":""}" role="img" aria-label="${PRI[n]}${n?" priority":""}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
const srcb=s=>`<span class="srcb" role="img" aria-label="${SRC[s].name}" title="${SRC[s].name}">${svg(P[SRC[s].icon],12,2)}</span>`;
const bkCls=b=>b==="To do"?"todo":b==="In progress"?"prog":b==="In review"?"rev":"done";
const bk=t=>`<i class="bk ${bkCls(t.b)}" role="img" aria-label="${t.b}" title="${esc(t.st)} in ${SRC[srcOf(t)].name}"></i>`;
/* The one reason a row shows. Extra flags become a +N counter; sync problems become a small glyph. */
function reasonOf(t,sec){
  const f=sec==="attn"?flagsOf(t):[];
  if(f.length){const [text,age,title]=f[0].reason(t);return {sev:f[0].kind,text,age,title,more:f.slice(1).filter(r=>r.id!=="sync-failed"),lead:f[0].id}}
  const up={age:ago(t.updated),title:`Updated ${t.updated}`};
  if(sec==="work"){
    if(t.chat&&t.chat.state==="running")return {sev:"run",text:t.chat.when.replace(/^Running, /,"Running · "),...up};
    if(t.chat)return {text:"Finished, not shipped",age:ago(t.chat.when),title:t.chat.when};
    return {text:"In progress · no chat",...up};
  }
  if(sec==="pr")return {text:`Draft PR #${t.pr.n}`,age:ago(t.pr.when),title:t.pr.when};
  if(sec==="review")return {text:t.pr?`PR #${t.pr.n} in review`:"In review",age:days(t.statusDays),title:t.statusDays?`In review for ${t.statusDays} day${t.statusDays>1?"s":""}`:"Entered review today"};
  if(sec==="next")return {text:t.due?`Due ${t.due==="Tomorrow"||t.due==="Today"?t.due.toLowerCase():t.due}`:"Not started",age:days(t.assignedDays),title:`Assigned ${t.assignedDays} day${t.assignedDays===1?"":"s"} ago`};
  if(sec==="done")return {text:"Done",age:ago(t.doneAgo),title:`Done ${t.doneAgo}`};
  if(sec==="search")return {text:mine(t)?"Assigned to you":t.who?`Assigned to ${PEOPLE[t.who]}`:"Unassigned",...up};
  return {text:"",...up};
}
function syncGlyph(t,r){
  if(stale(t))return `<span class="syncw stale" title="Out of date: showing the copy from 11:02">${svg(P.warn,13,2.2)}<span class="vh">Out of date</span></span>`;
  if(t.sync&&t.sync.s==="pend")return `<span class="syncw" title="${esc(t.sync.text)}"><i class="pdot" aria-hidden="true"></i><span class="vh">${esc(t.sync.text)}</span></span>`;
  if(t.sync&&t.sync.s==="fail"&&r.lead!=="sync-failed")return `<span class="syncw" title="${esc(t.sync.text)} Details and Retry in the ticket.">${svg(P.warn,13,2.2)}<span class="vh">${esc(t.sync.text)}</span></span>`;
  return "";
}
function reasonHTML(t,sec,r=reasonOf(t,sec)){
  const more=r.more&&r.more.length?`<span class="more" title="${esc(r.more.map(x=>x.reason(t)[0]).join("; "))}">+${r.more.length}<span class="vh"> more: ${esc(r.more.map(x=>x.reason(t)[0]).join("; "))}</span></span>`:"";
  return `<span class="why-r"><i class="sev${r.sev?" "+r.sev:""}" aria-hidden="true"></i><span class="txt">${esc(r.text)}</span>${more}${syncGlyph(t,r)}</span>`;
}
const tipHTML=(id,label,text)=>`<span class="tipw"><button class="info" type="button" aria-label="About ${esc(label)}" aria-describedby="tip-${id}">${svg(P.info,14,2)}</button><span class="tip" role="tooltip" id="tip-${id}">${esc(text)}</span></span>`;

function toast(msg,undo){
  const box=$("toasts");const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");
  d.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="undo" data-act="undo" data-k="${undo}">Undo</button>`:""}<i class="tbar"></i>`;box.appendChild(d);

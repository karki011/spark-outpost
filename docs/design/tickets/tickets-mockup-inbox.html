  render();moveRailInd();
  if(h==="assigned")toast("Assigned WEB-440 to you in Linear.","WEB-440");
  if(h==="assign-confirm")requestAnimationFrame(()=>{const b=document.querySelector('[data-act="confirm-assign"]');if(b)b.focus({preventScroll:true})});
  if(h.startsWith("start")){CTX.open=h!=="start";CTX.preview=h==="start-prompt";
    if(h!=="start"&&!CTX.added.length){CTX.note="Keep the public webhook payload unchanged; two customers parse it strictly.";CTX.added=[{kind:"file",name:"retry-timeline.png",size:"184 KB",tokens:250},{kind:"mention",name:"src/webhooks/",size:"folder",tokens:0},{kind:"link",name:"acme.example.com/wiki/webhook-retries",tokens:0},{kind:"ticket",name:"API-81",title:"Paginate the audit export endpoint",tokens:30}]}
    if(h==="start"){CTX.note="";CTX.added=[]}
    S.startKey="API-84";S.sel="API-84";renderDetail();
    openStart(findT(S.startKey));
    if(h!=="start")requestAnimationFrame(()=>{const b=$("dlgBody"),target=h==="start-prompt"?$("pvText"):$("ctxRoot");if(b&&target)b.scrollTop=target.offsetTop-b.offsetTop-8})}
  if(h==="settings")openSettings("connected");
  if(h==="settings-error")openSettings("error");
  if(h==="connect")openSettings("connect","linear");
  if(h==="connect-jira")openSettings("connect","jira");
  if(h==="settings-open")openSettings("connected","jira");
  document.querySelectorAll("#stateNav a").forEach(a=>a.setAttribute("aria-current",a.dataset.state===h?"true":"false"));
}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function closeTo(){return S.error?"error":""}
function closeDlg(){$("dlgRoot").innerHTML="";if(location.hash.startsWith("#start"))history.replaceState(null,"",location.pathname+location.search);document.querySelectorAll("#stateNav a").forEach(a=>a.setAttribute("aria-current",a.dataset.state===""?"true":"false"));const r=document.querySelector(`.ir-main[data-k="${S.startKey}"]`);if(r)r.focus({preventScroll:true})}

/* ---------- Assign to me ---------- */
function doAssign(t){
  if(t.p==="ENG"&&t.who==="SO"){S.confirm=null;S.assignErr=t.key;renderList();return}
  S.confirm=null;S.assignErr=null;t.assigning=true;renderList();
  setTimeout(()=>{t.assigning=false;t.prev=t.who;t.who="RP";t.justAssigned=true;renderList();if(S.sel===t.key)renderDetail();
    toast(`Assigned ${t.key} to you in ${SRC[srcOf(t)].name}.`,t.key);
    setTimeout(()=>{if(t.justAssigned){t.justAssigned=false;delete t.prev;if($("tkList"))renderList()}},10000)},reduce?0:700);
}
function undoAssign(k){
  const t=findT(k);if(!t||t.prev===undefined)return;
  const was=t.prev;t.who=was;delete t.prev;t.justAssigned=false;renderList();if(S.sel===k)renderDetail();
  toast(was?`Gave ${k} back to ${PEOPLE[was]}.`:`${k} is unassigned again.`);
}

/* ---------- Events ---------- */
function selectRow(k,fromRow){
  S.sel=k;S.confirm=null;renderList();renderDetail();
  const d=$("tkDetail");if(d&&matchMedia("(max-width:1180px)").matches){d.focus();return}
  if(fromRow){const r=document.querySelector(`.ir-main[data-k="${k}"]`);if(r)r.focus()}
}
function onClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,k=b.dataset.k;
  if(b.tagName==="A")e.preventDefault();
  if(a==="theme"){const r=b.getBoundingClientRect();applyTheme(v,r.left+r.width/2,r.top+r.height/2);return}
  if(a==="nav-home"){location.href="home-brief-mockup.html"+location.search;return}
  if(a==="nav-chats"){toast("Chats is not part of this mockup.");return}
  if(a==="nav-tickets"){go("");return}
  if(a==="nav-settings"){go("settings");return}
  if(a==="sel"){selectRow(k,b.classList.contains("ir-main"));return}
  if(a==="view"){S.view=v;S.q="";render();return}
  if(a==="sec-toggle"){S.collapsed[v]=!S.collapsed[v];renderList();const nb=$("sh-"+v);if(nb)nb.focus();return}
  if(a==="density"){S.compact=v==="compact";render();return}
  if(a==="clear-q"){S.q="";S.who="any";S.confirm=null;S.assignErr=null;render();$("tkQ").focus();return}
  if(a==="clear-filters"){Object.assign(S,{src:"all",proj:"all",sprint:"any",pri:"any",label:"any",who:"any"});render();return}
  if(a==="refresh"){toast(S.error?"Linear refreshed. Jira needs a new token first.":"Refreshed. Nothing changed since 1 min ago.");return}
  if(a==="brief-refresh"){S.brief="writing";renderList();setTimeout(()=>{S.brief="on";renderList()},reduce?0:1600);return}
  if(a==="brief-pop"){S.briefPop=!S.briefPop;renderList();const p=document.querySelector('[data-act="brief-pop"]');if(p)p.focus();return}
  if(a==="brief-switch"){S.brief=b.checked?"on":"off";renderList();const sw=document.querySelector('[data-act="brief-switch"]');if(sw)sw.focus();return}
  if(a==="brief-on"){S.brief="writing";renderList();setTimeout(()=>{S.brief="on";renderList()},reduce?0:1600);return}
  if(a==="assign"){const t=findT(k);if(t.who&&t.who!=="RP"){S.confirm=k;renderList();requestAnimationFrame(()=>{const c=document.querySelector('[data-act="confirm-assign"]');if(c)c.focus()})}else doAssign(t);return}
  if(a==="confirm-assign"){doAssign(findT(k));return}
  if(a==="confirm-cancel"){S.confirm=null;renderList();const r=document.querySelector(`.ir-acts [data-act="assign"][data-k="${k}"]`);if(r)r.focus();return}
  if(a==="undo"){undoAssign(k);return}
  if(a==="start"){S.startKey=k;S.sel=k;CTX.note="";CTX.added=[];CTX.open=false;CTX.preview=false;openStart(findT(k));return}
  if(a==="close"){if($("set")){go(closeTo());return}closeDlg();return}
  if(a==="folder"){b.parentElement.querySelectorAll("[data-act=folder]").forEach(x=>x.setAttribute("aria-checked",x===b));syncStart(findT(S.startKey));return}
  if(a==="mode"){S.startMode=v;b.parentElement.querySelectorAll("[data-act=mode]").forEach(x=>x.setAttribute("aria-checked",x===b));syncStart(findT(S.startKey));return}
  if(ctxClick(a,b))return;
  if(a==="start-go"){const t=findT(k),mv=$("mv").checked,s=SRC[srcOf(t)].name,asg=$("asg");
    if(asg&&asg.checked){t.who="RP"}
    t.chat={title:`${t.key}: ${t.title}`,state:"running",when:S.startMode==="plan"?"Writing a plan":"Running, step 1 of 5"};
    if(mv&&t.b==="To do"){t.sync={s:"pend",text:`Moving to In Progress in ${s}`}}
    closeDlg();S.q="";render();toast(mv?`Started a chat for ${t.key}. Moving it to In progress in ${s}.`:`Started a chat for ${t.key}.`);
    if(mv&&t.b==="To do")setTimeout(()=>{t.b="In progress";t.st="In Progress";t.sync={s:"ok",text:`Moved to In Progress in ${s}`,when:"just now"};render()},1400);return}
  if(a==="retry"){const t=findT(k);t.sync={s:"pend",text:`Moving to In Progress in Jira`};render();
    setTimeout(()=>{t.sync={s:"fail",text:"Could not move API-81 to In Progress in Jira.",why:"Jira still says the Team field must be set first."};render();toast("Jira refused the move again. Set the Team field in Jira, then retry.")},1200);return}
  if(a==="open-chat"){toast(`This would open the chat for ${k}.`);return}
  if(a==="open-pr"){const t=findT(k);toast(`This would open ${t.pr.repo}#${t.pr.n} on GitHub.`);return}
  if(a==="ext"){const t=findT(k);toast(`This would open ${SRC[srcOf(t)].url(t.key)}`);return}
  if(a==="ext-url"){toast(`This would open ${b.dataset.url}`);return}
  if(a==="reconnect"){go("settings-error");return}
  if(a==="connect"){go(v==="jira"?"connect-jira":"connect");return}
  if(a==="conn-toggle"){openConn=openConn===v?null:v;redrawConnectors(`#ch-${v}`);return}
  if(a==="conn-open"){openConn=v;redrawConnectors(`#cb-${v} input`);return}
  if(a==="replace"){REPL[v]=true;redrawConnectors(`#cb-${v} input[type=password]`);return}
  if(a==="replace-cancel"){REPL[v]=false;redrawConnectors(`#ch-${v}`);return}
  if(a==="remove"){toast(`This would remove the ${SRC[v].name} connection and delete its token from the keychain.`);return}
  if(a==="save-conn"){const body=b.closest(".pc-body");const hint=body.querySelector(".hintline");const inp=body.querySelector('input[type="password"]');
    if(!inp.value.trim()){hint.className="hintline bad";hint.textContent="Paste a "+(v==="jira"?"token":"key")+" first.";inp.classList.add("bad");inp.setAttribute("aria-invalid","true");inp.focus();return}
    hint.className="hintline";hint.innerHTML=`<i class="pdot" style="margin-right:6px" aria-hidden="true"></i>Checking with ${SRC[v].name}…`;
    setTimeout(()=>{CS[v]="connected";REPL[v]=false;redrawConnectors(`#ch-${v}`);toast(`Connected ${SRC[v].name}. Your tickets will show up in a moment.`)},1100);return}
  if(a==="map-reset"){MAP[mapSel[v]].set={};redrawConnectors(`[data-act="map-reset"][data-v="${v}"]`);toast("Status mapping reset to automatic.");return}
  if(a==="sec"){if(v!=="tools")toast("Only Connectors is part of this mockup.");return}
  if(a==="close-detail"){S.sel=null;renderList();renderDetail();return}
}
function boot(){
  document.body.insertAdjacentHTML("afterbegin",shellHTML());
  document.addEventListener("click",onClick);
  document.addEventListener("change",e=>{const c=e.target.dataset.change;
    if(c&&c in S&&c!=="map"){S[c]=e.target.value;if(c==="src")S.proj="all";render();const f=document.querySelector(`[data-change="${c}"]`);if(f)f.focus();return}
    if(c==="map"){const src=e.target.dataset.src;mapSel[src]=e.target.value;redrawConnectors(`[data-change="map"][data-src="${src}"]`)}
    if(e.target.id==="perm")syncStart(findT(S.startKey));
    if(e.target.dataset.piece){CTX.pieces[e.target.dataset.piece]=e.target.checked;redrawCtx(findT(S.startKey),`#${e.target.id}`)}
    if(e.target.id==="nCom"){CTX.n=+e.target.value;redrawCtx(findT(S.startKey),"#nCom")}
  });
  document.addEventListener("input",e=>{if(e.target.id==="tkQ"){const was=searching();S.q=e.target.value;S.confirm=null;S.assignErr=null;
      if(was!==searching()){render();const q=$("tkQ");q.focus();q.setSelectionRange(q.value.length,q.value.length)}
      else{const box=$("tkList");box.innerHTML=`<div class="res-h" role="status"><b>Searching Linear and Jira…</b></div>`+[66,52,71].map(w=>`<div class="sk-irow" aria-hidden="true"><span></span><span class="sk" style="height:12px"></span><span class="sk" style="height:11px"></span><span class="sk" style="width:${w}%"></span><span class="sk" style="height:11px"></span><span class="sk" style="height:11px"></span></div>`).join("");
        clearTimeout(boot.t);boot.t=setTimeout(renderList,reduce?0:450)}}
    if(e.target.id==="ctxNote"){CTX.note=e.target.value;syncCtx(findT(S.startKey))}});
  document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="ctxAt"||e.target.id==="ctxUrl")){e.preventDefault();ctxClick(e.target.id==="ctxAt"?"ctx-mention":"ctx-link")}});
  document.addEventListener("keydown",e=>{
    if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("dlg")&&!$("set")){const q=$("tkQ");if(q){e.preventDefault();q.focus()}return}
    /* Arrow keys or j/k move the selection between rows; the selected row keeps focus and shows its action */
    const ae=document.activeElement;
    if(ae&&ae.classList.contains("ir-main")&&["ArrowDown","ArrowUp","j","k"].includes(e.key)){
      const rows=[...document.querySelectorAll("#tkList .ir-main")],i=rows.indexOf(ae),nx=rows[i+(e.key==="ArrowDown"||e.key==="j"?1:-1)];
      e.preventDefault();if(nx)selectRow(nx.dataset.k,true);return}
    if(e.key!=="Escape")return;
    if(ae&&ae.classList.contains("info")){const w=ae.closest(".tipw");w.classList.add("hush");ae.addEventListener("blur",()=>w.classList.remove("hush"),{once:true});w.addEventListener("mouseleave",()=>w.classList.remove("hush"),{once:true});return}
    if($("dlg")){e.preventDefault();closeDlg();return}
    if($("set")){e.preventDefault();go(closeTo());return}
    if(S.confirm){const k=S.confirm;S.confirm=null;renderList();const r=document.querySelector(`.ir-acts [data-act="assign"][data-k="${k}"]`);if(r)r.focus();return}
    if(S.briefPop){S.briefPop=false;renderList();const p=document.querySelector('[data-act="brief-pop"]');if(p)p.focus();return}
    if(e.target.id==="tkQ"&&S.q){S.q="";render();$("tkQ").focus()}});
  document.addEventListener("click",e=>{if(e.target.id==="dlg"){closeDlg()}if(e.target.id==="set")go(closeTo())});
  addEventListener("hashchange",route);addEventListener("resize",moveRailInd);
  route();
}
boot();
})();
</script>

/* ---------- Brief (the Digest card, grown) ---------- */
function briefPop(){
  return `<div class="pop open bpop" id="briefPop" role="dialog" aria-label="Brief settings">
    <label class="check-row"><input type="checkbox" role="switch" data-act="brief-switch"${H.brief!=="off"?" checked":""}><span><b style="font-weight:500">Write a brief with AI</b><br><small style="color:var(--muted)">Off means rules only: nothing is sent to a model.</small></span></label>
    <dl class="facts"><dt>Model</dt><dd>Sonnet 5, the middle tier of your default provider (Claude). Never the fast tier or a retiring model.</dd>
      <dt>Reads</dt><dd>Titles, keys, statuses, priorities, due dates, PR numbers, rule flags and recent chat activity. Never descriptions, comments or code.</dd>
      <dt>Cost</dt><dd>About $0.01 a brief. $0.31 so far this month.</dd></dl>
    <label class="field" style="margin-top:10px"><span style="font-size:12.5px">Write a new one when you open Home, at most every</span><span class="selw"><select class="inp"><option>30 minutes</option><option selected>1 hour</option><option>Only when I press Refresh</option></select>${svg(P.chevd,12,2.2)}</span></label>
    <p class="set-hint">Only when something changed. Refresh works 10 minutes after the last brief.</p></div>`;
}
function itemRow(b,i){
  const f=find(b.id);const title=b.title||(f?f.title:"");const key=f&&f.key?`<span class="key">${f.key}</span>`:"";
  return `<li><span class="num" aria-hidden="true">${i+1}</span><span class="dg-next-main"><b>${key}${esc(title)}</b><small>${esc(b.text)}</small></span>
    <button class="btn sm line" data-act="brief-go" data-v="${b.id}" data-verb="${b.verb}" aria-label="${b.verb} ${esc(f&&f.key?f.key:title)}">${b.verb}</button></li>`;
}
function awayHTML(){
  return `<button class="hlink dg-toggle" data-act="away" aria-expanded="${H.away}" aria-controls="awayList">${H.away?"Hide":"Show"} what happened since you were away (${AWAY.length})</button>
    <ul class="dg-lines" id="awayList"${H.away?"":" hidden"}>${AWAY.map(a=>`<li><button class="dg-line" data-act="noop" data-msg="This would open the chat.">${esc(a.text)}</button></li>`).join("")}</ul>`;
}
function briefPanel(n){
  if(H.noAI)return "";
  const skel=`<div class="sk-lines" aria-hidden="true"><span class="sk" style="width:86%;height:14px"></span><span class="sk" style="width:72%"></span><span class="sk" style="width:64%"></span></div>`;
  if(H.loading)return `<div class="hpanel dg" aria-hidden="true"><div class="dg-head"><span class="sk c" style="width:28px;height:28px;border-radius:50%"></span><span class="sk" style="width:220px"></span></div>${skel}</div>`;
  if(H.brief==="off")return `<p class="dg-off">${scoutSVG(22,"sleep")}The brief is off. Rules still sort the list below. <button class="hlink" data-act="brief-on">Turn on (about $0.01 each)</button></p>`;
  if(H.brief==="writing")return `<div class="hpanel dg" aria-busy="true"><div class="dg-head">${scoutSVG(28,"working")}<p class="dg-meta" role="status">Reading ${n} flagged items and your recent chats…</p></div>${skel}</div>`;
  if(H.brief==="failed")return `<div class="hpanel dg"><div class="dg-head">${scoutSVG(28,"sad")}<p class="dg-meta">Last brief 08:31 · Sonnet 5 · ~$0.01</p></div>
    <p class="dg-error" role="status">${svg(P.warn,14,2)}<span><b style="color:var(--text);font-weight:500">Couldn't write a new brief.</b> Claude answered 529 (overloaded). Nothing was charged. The list below is complete; only the summary is missing. <button class="hlink" data-act="refresh">Retry</button></span></p></div>`;
  const items=(H.noTickets?BRIEF.itemsChats:BRIEF.items);
  return `<div class="hpanel dg"><div class="dg-head">${scoutSVG(28)}<p class="dg-meta" aria-live="polite">Generated 09:12 · Sonnet 5 · ~$0.01 · from ${n} flagged</p><button class="hlink" data-act="audit">Audit</button></div>
    <p class="dg-headline">${H.noTickets?esc(BRIEF.headlineChats):BRIEF.headline}</p>
    <ol class="dg-next" aria-label="Do these first">${items.map(itemRow).join("")}</ol>
    ${awayHTML()}</div>`;
}
function feedHTML(){
  const all=feed();
  if(H.loading)return `<ul class="lrows sk-rows" aria-hidden="true" style="margin-top:14px">${[62,48,70,54].map(w=>`<li class="lrow"><span class="lr-main"><span class="sk" style="width:14px;height:14px;border-radius:4px"></span><span class="sk" style="width:52px"></span><span class="sk" style="width:${w}%"></span><span class="sk" style="width:120px"></span><span class="sk" style="width:24px"></span></span></li>`).join("")}</ul>`;
  const counts={all:all.length,chat:0,ticket:0,pr:0};all.forEach(f=>counts[f.kind]++);
  const kinds=["chat","ticket","pr"].filter(k=>counts[k]);
  const list=all.filter(f=>H.filter==="all"||f.kind===H.filter);
  const tip=`<span class="tipw"><button class="info" type="button" aria-label="How this list is sorted" aria-describedby="tip-feed">${svg(P.info,14,2)}</button><span class="tip" role="tooltip" id="tip-feed">Flagged by rules; each row says why. Waiting on you first, then errors and failed moves, then priority and dates, then finished chats.</span></span>`;
  const chips=kinds.length>1?`<ul class="fchips" aria-label="Show">${[["all","All"],["chat","Chats"],["ticket","Tickets"],["pr","PRs"]].filter(([k])=>k==="all"||counts[k]).map(([k,l])=>`<li><button class="fchip" data-act="filter" data-v="${k}" aria-pressed="${H.filter===k}">${l} <span class="n">${counts[k]}</span></button></li>`).join("")}</ul>`:"";
  const rows=list.map(f=>`<li class="lrow"><button class="lr-main" data-act="go" data-v="${f.id}">
      ${f.kind==="chat"?`<span class="g" role="img" aria-label="Chat with ${PROV[f.prov].name}">${blob(f.prov,18,f.sev==="bad"?"sad":f.sev==="done"?"happy":"unsure")}</span><span class="t wide">${esc(f.title)}</span>`:`${priHTML(f.pri)}<span class="tk-key">${f.key}</span><span class="t">${esc(f.title)}</span>`}
      ${reasonHTML(f)}<span class="age" title="${esc(f.why[2])}">${f.why[1]}</span></button><span class="lr-acts"><button class="qa${f.primary?" primary":""}" data-act="go" data-v="${f.id}" aria-label="${esc(f.go)}: ${esc(f.key||f.title)}">${esc(f.go)}</button></span></li>`).join("");
  const foot=H.noTickets&&!H.dismissed?`<p class="feed-foot">Tickets and pull requests from Linear or Jira can show here too. <a class="hlink" href="tickets-mockup-inbox.html${location.search.replace("frame=1","")}#connect">Connect</a><button class="icon-btn" data-act="dismiss" aria-label="Don't show this again">${svg(P.close,12,2.2)}</button></p>`:"";
  return `<div class="feed-bar">${chips}${tip}</div><ul class="lrows" aria-label="Needs you">${rows}</ul>${foot}`;
}
function needsHTML(){
  const n=feed().length;
  const acts=H.noAI||H.loading?"":`<span class="acts"><button class="hlink" data-act="refresh"${H.brief==="off"||H.brief==="writing"?" disabled":""} title="${H.brief==="writing"?"":"You can refresh 10 minutes after the last brief"}">${H.brief==="writing"?"Writing…":"Refresh"}</button><span style="position:relative"><button class="icon-btn" data-act="pop" aria-expanded="${H.pop}" aria-controls="briefPop" aria-label="Brief settings" title="Brief settings">${svg(P.gear,15,2)}</button>${H.pop?briefPop():""}</span></span>`;
  /* All quiet: the list and Running now collapse. The brief stays only if it has something to pick up. */
  if(!H.loading&&!n){
    if(H.bare||H.noAI||H.brief==="off")return "";
    return `<section class="hsec" id="home-needs" aria-labelledby="needsH"><div class="hsec-h"><h2 id="needsH">Pick up where you left off</h2>${acts}</div>
      <div class="hpanel dg"><div class="dg-head">${scoutSVG(28,"happy")}<p class="dg-meta">Nothing is flagged · Generated 08:40 · Sonnet 5 · ~$0.01</p><button class="hlink" data-act="audit">Audit</button></div>
      <ol class="dg-next" aria-label="Pick up where you left off">${BRIEF.quiet.map(itemRow).join("")}</ol>${awayHTML()}</div></section>`;
  }
  return `<section class="hsec" id="home-needs" aria-labelledby="needsH"${H.loading?' aria-busy="true"':""}><div class="hsec-h"><h2 id="needsH">What needs you today${H.loading?"":` <span class="n">${n}</span>`}</h2>${acts}</div>
    ${briefPanel(n)}${feedHTML()}</section>`;
}
function runningHTML(){
  if(H.loading)return `<section class="hsec" aria-hidden="true"><div class="hsec-h"><span class="sk" style="width:110px;height:14px"></span></div><div class="sk-card"><span class="sk c"></span><span class="lines"><span class="sk" style="width:58%"></span><span class="sk" style="width:38%;height:10px"></span></span><span class="sk pill"></span></div></section>`;
  const rs=running();if(!rs.length)return "";
  return `<section class="hsec" aria-labelledby="runH"><div class="hsec-h"><h2 id="runH">Running now <span class="n">${rs.length}</span></h2></div><ul class="hlist">${rs.map(r=>`<li class="hcard running"><span class="hblob" aria-hidden="true">${blob(r.prov,34,"thinking")}<i class="hdot running"></i></span>
      <span class="hc-main"><b>${r.key?`<span class="key">${r.key}</span>`:""}${esc(r.title)}</b><small><span class="pj">${r.project}</span>${esc(r.step)}</small>${r.pct==null?`<span class="hprog wait" role="progressbar" aria-label="Progress, no plan yet"><i></i></span>`:`<span class="hprog" role="progressbar" aria-label="Plan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.pct*100}"><i style="transform:scaleX(${r.pct})"></i></span>`}</span>
      <button class="go" data-act="go" data-v="${r.id}" aria-label="Watch: ${esc(r.title)}">Watch</button></li>`).join("")}</ul></section>`;
}
function gridHTML(){
  const skRows=ws=>`<ul class="mlist" aria-hidden="true">${ws.map(w=>`<li class="mrow"><span class="sk" style="width:18px;height:18px;border-radius:50%"></span><span class="sk" style="width:${w}%"></span></li>`).join("")}</ul>`;
  const up=H.noTickets?"":`<section class="hsec" aria-labelledby="upH"><div class="hsec-h"><h2 id="upH">Up next</h2>${H.loading?"":`<a class="hlink" href="tickets-mockup-inbox.html">Tickets</a>`}</div>${H.loading?skRows([64,52,70,48]):`<ul class="mlist">${UPNEXT.map(t=>`<li><button class="mrow" data-act="go" data-v="${t.key}">${priHTML(t.pri)}<span class="key">${t.key}</span><span class="t">${esc(t.title)}</span><span class="k">${t.due?"Due "+t.due:""}</span></button></li>`).join("")}</ul>`}</section>`;
  const recent=`<section class="hsec" aria-labelledby="recentH"><div class="hsec-h"><h2 id="recentH">Recent chats</h2>${H.loading?"":`<button class="hlink" data-act="chats">View all</button>`}</div>${H.loading?skRows([66,50,58,72,44]):`<ul class="mlist">${RECENT.map(([p,t,a])=>`<li><button class="mrow" data-act="chats" title="${esc(t)}">${p?`<span class="mblob" aria-hidden="true">${blob(p,18)}</span>`:svg(P.folder,16,1.8)}<span class="t">${esc(t)}</span><span class="k">${a}</span></button></li>`).join("")}</ul>`}</section>`;
  return `<div class="hgrid${H.noTickets?" one":""}">${up}${recent}</div>`;
}
function spendHTML(){
  const body=H.loading?`<div aria-hidden="true"><span class="sk" style="width:180px;height:18px"></span><span class="sk" style="width:100%;height:6px;margin-top:14px"></span><span class="sk" style="width:220px;margin-top:10px"></span></div>`
    :`<div class="cost-total"><b>$4.82</b><span>23 runs · 1.2M tokens</span></div>
      <div class="cost-bar" role="img" aria-label="Cost by provider: Claude $3.10, Codex $1.52, Jev ~$0.20"><i style="width:64%;background:var(--c-claude)"></i><i style="width:32%;background:var(--c-codex)"></i><i style="width:4%;background:var(--c-jev)"></i></div>
      <ul class="cost-legend" aria-label="Cost by provider"><li><i style="background:var(--c-claude)"></i><span>Claude</span><b>$3.10</b></li><li><i style="background:var(--c-codex)"></i><span>Codex</span><b>$1.52</b></li><li><i style="background:var(--c-jev)"></i><span>Jev</span><b>~$0.20</b><span class="spend-est">estimated</span></li></ul>
      <button class="hlink foot" data-act="noop" data-msg="This would open Settings, Usage and audit.">Open usage and audit</button>`;
  return `<div class="hsecondary"><section class="hsec hspend" aria-labelledby="spendH"><div class="hsec-h"><h2 id="spendH">Spend</h2><div class="seg" style="--n:2" role="radiogroup" aria-label="Spend period"><span class="seg-ind"></span><button role="radio" aria-checked="true">Today</button><button role="radio" aria-checked="false">This week</button></div></div><div class="hpanel"${H.loading?' aria-busy="true"':""}>${body}</div></section></div>`;
}
function render(){
  if(H.narrow){
    const th=document.documentElement.dataset.theme||"light";
    $("view").innerHTML=`<div class="narrow-stage">${[["","Default"],["all-quiet","All quiet"],["loading","Loading"]].map(([h,l])=>`<figure><iframe data-frame="${h}" title="Home at 390 px: ${l}" src="home-brief-mockup.html?frame=1&theme=${th}#${h}"></iframe><figcaption>${l}, 390 px</figcaption></figure>`).join("")}</div>`;
    return;
  }
  const focusId=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fid:null;
  $("view").innerHTML=`<div class="home"><div class="home-wrap">${heroHTML()}${composerHTML()}
    <div class="home-live"${H.loading?' aria-busy="true"':""}>${H.loading?'<p class="vh" role="status">Loading your chats, tickets and pull requests</p>':""}${needsHTML()}${runningHTML()}${gridHTML()}${spendHTML()}</div></div></div>`;
}

/* ---------- Shell, routing, events ---------- */
const STATES=[["","Default"],["tickets","Ticket slice"],["all-quiet","All quiet"],["quiet-bare","All quiet, nothing to pick up"],["no-tickets","No ticket source"],["writing","Brief writing"],["failed","Brief failed"],["off","Brief off"],["settings","Brief settings"],["no-ai","No AI provider"],["loading","Loading"],["narrow","Narrow"]];
function shellHTML(){
  const th=document.documentElement.dataset.theme||"light",q=location.search;
  const bar=FRAME?"":`<div class="mock-bar" role="region" aria-label="Mockup controls">
    <span class="mock-tag">Sample data</span><b class="vh">Integrated Home mockup</b>
    <nav class="mock-nav" aria-label="Screens"><span>Screen</span><a href="home-brief-mockup.html${q}" aria-current="page">Home</a><a href="tickets-mockup-inbox.html${q}">Tickets</a></nav>
    <nav class="mock-nav" aria-label="States" id="stateNav"><span>State</span>${STATES.map(([h,l])=>`<a href="#${h}" data-state="${h}">${l}</a>`).join("")}</nav>
    <div class="mock-theme"><div class="seg" id="themeSeg" style="--n:2" role="radiogroup" aria-label="Theme"><span class="seg-ind" style="transform:translateX(${th==="dark"?100:0}%)"></span><button role="radio" data-act="theme" data-v="light" aria-checked="${th==="light"}">Light</button><button role="radio" data-act="theme" data-v="dark" aria-checked="${th==="dark"}">Dark</button></div></div>
  </div>`;
  return `${bar}<div class="app">
    <nav class="rail" aria-label="Main">
      <button class="rail-logo" aria-label="Spark Outpost">${scoutSVG(34)}</button>
      <span class="rail-ind" id="railInd"></span>
      <button class="rail-btn" data-view="home" aria-current="page">${svg(P.home,20,1.8)}Home</button>
      <button class="rail-btn" data-act="chats">${svg(P.chat,20,1.8)}Chats<i class="rbadge" id="badgeChats"></i></button>
      <button class="rail-btn" data-act="noop" data-msg="Analytics is not part of this mockup.">${svg(P.bars,20,1.8)}Analytics</button>
      <button class="rail-btn" data-act="tickets">${svg(P.ticket,20,1.8)}Tickets<i class="rbadge" id="badgeTickets"></i></button>
      <span class="rail-sp"></span>
      <button class="icon-btn" aria-label="Settings" data-act="providers">${svg(P.gear,18,1.8)}</button>
    </nav>
    <main class="view page" id="view" aria-labelledby="home-greet"></main>
  </div><div id="toasts" aria-live="polite"></div>`;
}
function badges(){
  const f=feed(),c=f.filter(x=>x.kind==="chat").length,t=f.length-c;
  const bc=$("badgeChats"),bt=$("badgeTickets");
  bc.textContent=H.loading||!c?"":c;bc.setAttribute("aria-label",`${c} chats need you`);if(!c||H.loading)bc.removeAttribute("aria-label");
  bt.textContent=H.loading||!t?"":t;bt.setAttribute("aria-label",`${t} tickets need attention`);if(!t||H.loading)bt.removeAttribute("aria-label");
}
function moveRailInd(){const b=document.querySelector('.rail-btn[data-view="home"]'),ind=$("railInd");if(!b||!ind)return;ind.style.transform=`translateY(${b.offsetTop}px)`;ind.style.height=b.offsetHeight+"px"}
function route(){
  const h=location.hash.slice(1);
  Object.assign(H,RESET);
  if(h==="tickets")H.filter="ticket";
  if(h==="all-quiet")H.quiet=true;
  if(h==="quiet-bare"){H.quiet=true;H.bare=true}
  if(h==="no-tickets")H.noTickets=true;
  if(h==="writing")H.brief="writing";
  if(h==="failed")H.brief="failed";
  if(h==="off")H.brief="off";
  if(h==="settings")H.pop=true;
  if(h==="no-ai")H.noAI=true;
  if(h==="loading")H.loading=true;
  if(h==="narrow")H.narrow=true;
  $("view").setAttribute("aria-label",H.narrow?"Home at narrow widths":"Home");
  if(H.narrow)$("view").removeAttribute("aria-labelledby");else{$("view").removeAttribute("aria-label");$("view").setAttribute("aria-labelledby","home-greet")}
  render();badges();moveRailInd();
  document.querySelectorAll("#stateNav a").forEach(a=>a.setAttribute("aria-current",a.dataset.state===h?"true":"false"));
}
if(FRAME)document.body.classList.add("frame");
document.body.insertAdjacentHTML("afterbegin",shellHTML());
const refocus=sel=>{const el=document.querySelector(sel);if(el)el.focus()};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="theme"){applyTheme(v);return}
  if(a==="jump"){e.preventDefault();const s=$("home-needs");if(s){s.scrollIntoView({behavior:reduce?"auto":"smooth"});const f=s.querySelector(".lr-main");if(f)f.focus({preventScroll:true})}return}
  if(a==="tickets"){location.href="tickets-mockup-inbox.html";return}
  if(a==="chats"){toast("This would open Chats.");return}
  if(a==="providers"){toast("This would open Settings, AI providers.");return}
  if(a==="noop"){toast(b.dataset.msg||"Not part of this mockup.");return}
  if(a==="filter"){H.filter=v;render();refocus(`[data-act="filter"][data-v="${v}"]`);return}
  if(a==="pop"){H.pop=!H.pop;render();refocus('[data-act="pop"]');return}
  if(a==="brief-switch"){H.brief=b.checked?"ready":"off";render();refocus('[data-act="brief-switch"]');return}
  if(a==="brief-on"||a==="refresh"){H.brief="writing";H.pop=false;render();refocus('[data-act="pop"]');setTimeout(()=>{H.brief="ready";render();refocus('[data-act="refresh"]')},reduce?0:1600);return}
  if(a==="away"){H.away=!H.away;render();refocus('[data-act="away"]');return}
  if(a==="dismiss"){H.dismissed=true;render();refocus(".lr-main");toast("Hidden. Connect Linear or Jira any time in Settings, Connectors.");return}
  if(a==="audit"){toast("This would open the brief's audit: the exact input, the model's reply and the cost.");return}
  if(a==="brief-go"){const verb=b.dataset.verb,f=find(v);toast(verb==="Continue"?`This would open ${f&&f.key?f.key:"the chat"} with the drafted message in the composer.`:`This would open the chat to answer.`);return}
  if(a==="go"){const f=find(v);toast(f?`This would ${f.go.toLowerCase()} for ${f.key||f.title}.`:`This would open ${v}.`);return}
});
document.addEventListener("keydown",e=>{const ae=document.activeElement;
  if(e.key==="Enter"&&!e.shiftKey&&ae&&ae.id==="homeMsg"){e.preventDefault();if(ae.value.trim()){const t=ae.value.trim().slice(0,40);ae.value="";document.querySelector(".home-started").innerHTML=`<span>Started ‘${esc(t)}’ · <button class="hlink" data-act="chats">Open</button></span>`}return}
  if(e.key==="Escape"&&ae&&ae.classList.contains("info")){const w=ae.closest(".tipw");w.classList.add("hush");ae.addEventListener("blur",()=>w.classList.remove("hush"),{once:true});return}
  if(ae&&ae.classList.contains("lr-main")&&["ArrowDown","ArrowUp"].includes(e.key)){const rows=[...document.querySelectorAll(".lr-main")],nx=rows[rows.indexOf(ae)+(e.key==="ArrowDown"?1:-1)];e.preventDefault();if(nx)nx.focus();return}
  if(e.key==="Escape"&&H.pop){H.pop=false;render();refocus('[data-act="pop"]')}});
document.addEventListener("input",e=>{if(e.target.id==="homeMsg")document.querySelector(".send").disabled=!e.target.value.trim()});
addEventListener("hashchange",route);addEventListener("resize",moveRailInd);
route();
})();
</script>
</body>
</html>

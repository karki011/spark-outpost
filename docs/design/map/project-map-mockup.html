<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Outpost · Project Map (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var q=new URLSearchParams(location.search).get("theme"),s=null;try{s=localStorage.getItem("spark-map-theme")}catch(e){}
document.documentElement.dataset.theme=q||s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})()</script>
<style>
/* Design mockup for the Project Map page.
   Real data: files, imports, git history and web-to-server API links come from this repo
   (docs/design/map/build-map-data.mjs rewrites the map-data block below). Jev labels,
   confidences, "updating 12 files" and the chat are made up.
   App tokens are copied from docs/design/mockup/spark-outpost-mockup.html. */
:root{
  box-sizing:border-box;
  --bg:#f4f5f7; --panel:#ffffff; --raise:#eef0f3; --line:#e2e5ea;
  --text:#16191e; --muted:#495160; --faint:#575f6a;
  --accent:#078470; --accent-ink:#fff; --accent-soft:rgba(7,132,112,.11);
  --danger:#bb3430; --warn:#8a4a00; --r:14px; --r-sm:8px;
  --out:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  --line-strong:#85888d; --accent-text:#00715d;
  --c-jev:oklch(.615 .2 330);
  /* Map: paper star chart */
  --sky-0:#f7f1e3; --sky-1:#ebe0c6; --grid:rgba(74,60,34,.30); --dust:rgba(74,60,34,.22);
  --star:#18202d; --star-line:rgba(24,32,45,.78); --gold:#8a5d00; --gold-soft:rgba(138,93,0,.14);
  --warm:#d0460f; --cross:rgba(24,32,45,.20); --skel:rgba(74,60,34,.4);
  --k-ui:#0c8a5c; --k-api:#1f64c8; --k-data:#a87400; --k-test:#c2347f; --k-config:#6b4fd0;
  --bridge:#0b6f8a; --event:#7a3fc0; --types:#8a5d00; --tint-web:#0a7389; --tint-server:#7b3fb8;
  --glass:rgba(255,253,247,.9); --glass-line:rgba(74,60,34,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f12; --panel:#12161a; --raise:#1a1f25; --line:#232a31;
    --text:#e7eaee; --muted:#a3aebc; --faint:#909aa7;
    --accent:#34c3a3; --accent-ink:#05231c; --accent-soft:rgba(52,195,163,.13);
    --danger:#f06b63; --warn:#e8b04b; --line-strong:#646c74; --accent-text:#34c3a3; --c-jev:oklch(.62 .2 330);
    --sky-0:#10203f; --sky-1:#070e1f; --grid:rgba(98,140,204,.42); --dust:rgba(120,158,220,.55);
    --star:#f5f8ff; --star-line:rgba(236,242,255,.72); --gold:#eab52e; --gold-soft:rgba(234,181,46,.14);
    --warm:#ff8a3d; --cross:rgba(150,180,230,.16); --skel:rgba(120,158,220,.45);
    --k-ui:#3ddc97; --k-api:#5ab4ff; --k-data:#f5cb45; --k-test:#ff7ac6; --k-config:#b49cff;
    --bridge:#6fd3ff; --event:#c19bff; --types:#eab52e; --tint-web:#5fd4c4; --tint-server:#b69cff;
    --glass:rgba(12,22,44,.86); --glass-line:rgba(120,158,220,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f12; --panel:#12161a; --raise:#1a1f25; --line:#232a31;
  --text:#e7eaee; --muted:#a3aebc; --faint:#909aa7;
  --accent:#34c3a3; --accent-ink:#05231c; --accent-soft:rgba(52,195,163,.13);
  --danger:#f06b63; --warn:#e8b04b; --line-strong:#646c74; --accent-text:#34c3a3; --c-jev:oklch(.62 .2 330);
  --sky-0:#10203f; --sky-1:#070e1f; --grid:rgba(98,140,204,.42); --dust:rgba(120,158,220,.55);
  --star:#f5f8ff; --star-line:rgba(236,242,255,.72); --gold:#eab52e; --gold-soft:rgba(234,181,46,.14);
  --warm:#ff8a3d; --cross:rgba(150,180,230,.16); --skel:rgba(120,158,220,.45);
  --k-ui:#3ddc97; --k-api:#5ab4ff; --k-data:#f5cb45; --k-test:#ff7ac6; --k-config:#b49cff;
  --bridge:#6fd3ff; --event:#c19bff; --types:#eab52e; --tint-web:#5fd4c4; --tint-server:#b69cff;
  --glass:rgba(12,22,44,.86); --glass-line:rgba(120,158,220,.22);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
svg{flex-shrink:0;display:block}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- Mockup bar (not product UI) ---------- */
.mock-bar{height:44px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px dashed var(--line-strong);background:var(--bg);font-size:13px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.mock-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px dashed var(--warn);color:var(--warn);font-weight:600;font-size:12px}
.mock-nav{display:flex;align-items:center;gap:2px}
.mock-nav span{color:var(--faint);margin-right:4px;font-size:12px}
.mock-nav a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:var(--r-sm);font-size:12.5px}
.mock-nav a:hover{background:var(--raise);color:var(--text)}
.mock-nav a[aria-current="true"]{background:var(--raise);color:var(--text);font-weight:500}
.mock-theme{margin-left:auto}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);padding:3px;border-radius:var(--r-sm);background:var(--raise)}
.seg button{position:relative;z-index:1;padding:4px 10px;font-size:12.5px;color:var(--muted);transition:color .2s;white-space:nowrap}
.seg button[aria-checked="true"]{color:var(--text);font-weight:500}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .4s var(--spring)}
.mock-theme .seg{width:140px}

/* ---------- App frame ---------- */
.app{flex:1;min-height:0;display:flex}
.rail{width:70px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px}
.rail-logo{width:44px;height:44px;display:grid;place-items:center;margin-bottom:10px;border-radius:14px}
.rail-logo:hover{background:var(--raise)}
.rail-btn{position:relative;width:56px;padding:8px 0 6px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s,background .2s}
.rail-btn:hover{color:var(--text)}
.rail-btn[aria-current="page"]{color:var(--text);background:var(--raise)}
.rail-btn[aria-current="page"]::before{content:"";position:absolute;left:-7px;top:15px;bottom:15px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail-btn[aria-current="page"] svg{color:var(--accent-text)}
.rail-sp{flex:1}
.ava{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--raise);font-size:12.5px;font-weight:600;color:var(--muted)}
.page{flex:1;min-width:0;display:flex;flex-direction:column;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;position:relative}

/* ---------- Blob Scout (Spark) ---------- */
.scout{overflow:visible;--sc-a:var(--accent);--sc-b:var(--warn);--sc-eye:#0c0f12}
.scout .sc-hop,.scout .sc-body{transform-box:view-box}
.scout .sc-body{transform-origin:32px 58px;animation:sc-breathe 3.4s ease-in-out infinite}
@keyframes sc-breathe{50%{transform:scale(1.03,.97)}}
.scout .sc-eye{fill:var(--sc-eye);transform-box:fill-box;transform-origin:center;animation:sc-blink 4.8s infinite;transition:opacity .2s}
@keyframes sc-blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.scout .sc-spark{transform-box:fill-box;transform-origin:center;animation:sc-twinkle 3s ease-in-out infinite}
@keyframes sc-twinkle{50%{transform:rotate(45deg) scale(.78);opacity:.8}}
.scout .sc-happy{fill:none;stroke:var(--sc-eye);stroke-width:2.8;stroke-linecap:round;opacity:0;transition:opacity .2s}
.scout .sc-cheeks{fill:var(--sc-b);opacity:0;transition:opacity .3s}
.scout.working .sc-spark{animation:sc-spin .9s linear infinite;filter:drop-shadow(0 0 3px var(--sc-b))}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.scout.working .sc-look{animation:sc-scan 2.2s ease-in-out infinite}
@keyframes sc-scan{0%,100%{transform:translate(-1.8px,-1px)}50%{transform:translate(1.8px,-1px)}}
.scout.happy .sc-eye{opacity:0}
.scout.happy .sc-happy{opacity:1}
.scout.happy .sc-cheeks{opacity:.55}

/* ---------- Top bar ---------- */
.mhead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;min-height:54px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:6;background:var(--panel)}
.mtitle{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.mtitle h1{margin:0;font-size:14.5px;font-weight:500;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:var(--r-sm);font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--panel);transition:border-color .2s,color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--faint);color:var(--text)}
.btn[aria-expanded="true"],.btn[aria-pressed="true"]{border-color:var(--accent-text);color:var(--text);background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn .n{color:var(--faint);font-variant-numeric:tabular-nums}
.repo-btn{color:var(--text);font-weight:500}
.repo-btn .mono{font-weight:400;font-size:12px;color:var(--faint)}
.repo-dots{display:flex}
.repo-dots i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.repo-dots i+i{margin-left:-3px}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;height:32px;padding:0 60px 0 32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raise);font-size:13.5px;outline:none;transition:border-color .2s,background .2s}
.search input:focus{border-color:var(--accent-text);background:var(--panel)}
.search>svg{position:absolute;left:10px;top:9px;color:var(--faint);pointer-events:none}
.kbd{position:absolute;right:8px;top:7px;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px;pointer-events:none}
.results{position:absolute;left:0;right:0;top:38px;z-index:40;margin:0;padding:5px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);animation:menuin .22s var(--spring)}
@keyframes menuin{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.results li{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-sm);font-size:13px;cursor:pointer}
.results li[aria-selected="true"],.results li:hover{background:var(--raise)}
.results .nm{font-weight:500;white-space:nowrap}
.results .pt{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.results .empty{color:var(--faint);cursor:default}
.kdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.sp{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);white-space:nowrap;padding:0 4px}
.status b{font-weight:500;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 10px 0 8px;border-radius:var(--r-sm);font-size:13px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.switch:hover{background:var(--raise);color:var(--text)}
.switch .tr{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .25s}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{color:var(--text)}
.switch[aria-checked="true"] .tr{background:var(--warm)}
.switch[aria-checked="true"] .tr::after{transform:translateX(12px)}
.switch .cnt{font-size:12px;color:var(--warm);font-weight:600;font-variant-numeric:tabular-nums}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--raise);color:var(--text)}

/* Repo popover */
.pop{position:absolute;z-index:40;width:300px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);animation:menuin .22s var(--spring)}
.pop .lab{font-size:12px;color:var(--faint);padding:6px 8px 4px}
.pop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-sm);font-size:13.5px;cursor:pointer}
.pop label:hover{background:var(--raise)}
.pop label small{display:block;color:var(--faint);font-size:12px;line-height:1.3}
.pop input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.pop .note{font-size:12px;color:var(--faint);padding:6px 8px 4px;line-height:1.4;border-top:1px solid var(--line);margin-top:4px}

/* Filter bar */
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;row-gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);position:relative;z-index:5;background:var(--panel)}
.fbar::-webkit-scrollbar{display:none}
.fgroup{display:flex;align-items:center;gap:5px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.fgroup:last-of-type{border-right:0}
.fgroup>span{font-size:12px;color:var(--faint);margin-right:2px;white-space:nowrap}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:border-color .2s,background .2s,color .2s,opacity .2s}
.fchip:hover{border-color:var(--faint);color:var(--text)}
.fchip[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c,var(--accent-text)) 70%,transparent);background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);color:var(--text)}
.fchip[aria-pressed="false"] .kdot{opacity:.35}
.fchip:disabled{opacity:.5;cursor:default}
.fchip .n{color:var(--faint);font-variant-numeric:tabular-nums}
.tier-ic{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tier-ic.shared{opacity:.65}.tier-ic.feature{opacity:.35}
.tier-ic.core{box-shadow:0 0 0 3px var(--gold-soft)}
.line-ic{width:14px;height:0;border-top:2px solid var(--c);flex-shrink:0}
.line-ic.dash{border-top-style:dashed}.line-ic.dot{border-top-style:dotted}

/* ---------- Stage ---------- */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;overflow:clip;background:var(--sky-1)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
#sky.pointer{cursor:pointer}
#sky:focus-visible{outline:2px solid var(--gold);outline-offset:-4px;border-radius:0}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;padding:3px;gap:2px;z-index:3}
.zoom button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.zoom button:hover{background:var(--gold-soft);color:var(--text)}
.legend{position:absolute;left:14px;bottom:14px;z-index:3;width:250px;padding:10px 12px 11px;font-size:12.5px;animation:rise .35s var(--out)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.legend h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center}
.legend h3 button{margin-left:auto;color:var(--faint);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.legend h3 button:hover{background:var(--gold-soft);color:var(--text)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.legend li{display:flex;align-items:center;gap:9px;color:var(--muted);line-height:1.3}
.legend .sym{width:22px;display:grid;place-items:center;flex-shrink:0}
.lg-star{border-radius:50%;background:var(--star)}
.lg-ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--warm);box-shadow:0 0 8px var(--warm)}
.legend-btn{position:absolute;left:14px;bottom:14px;z-index:3;height:32px;padding:0 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.crumb{position:absolute;left:14px;top:14px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;max-width:calc(100% - 28px);animation:rise .35s var(--out)}
.crumb .back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.crumb .back:hover{background:var(--gold-soft);color:var(--text)}
.crumb h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.crumb .meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.kbar{display:flex;height:6px;width:120px;border-radius:999px;overflow:hidden;gap:1px}
.kbar i{height:100%}
.jev{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.jev .jb{width:16px;height:16px;display:grid;place-items:center}
.jev .jb svg{overflow:visible}
.jev b{font-weight:500;color:var(--text)}
.conf{font-variant-numeric:tabular-nums}
.conf.low{color:var(--warm);font-weight:600}

/* Tooltip */
.tip{position:absolute;z-index:8;pointer-events:none;width:max-content;max-width:330px;padding:10px 12px;font-size:12.5px;line-height:1.45;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .14s,transform .2s var(--out);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.tip.show{opacity:1;transform:none}
.tip .path{font-family:"Geist Mono",monospace;font-size:12px;color:var(--text);word-break:break-all}
.tip .path b{font-weight:500}
.tip .big{font-size:13.5px;margin:6px 0 2px;color:var(--text)}
.tip .big strong{font-weight:600;font-variant-numeric:tabular-nums}
.tip .sub{color:var(--muted)}
.tip .row{display:flex;align-items:center;gap:8px;margin-top:7px;padding-top:7px;border-top:1px solid var(--glass-line)}
.tip .warmtag{color:var(--warm);font-weight:600}
.tip .ep{display:flex;gap:7px;align-items:baseline;font-family:"Geist Mono",monospace;font-size:12px}
.meth{font-family:"Geist Mono",monospace;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;line-height:17px;background:var(--gold-soft);color:var(--gold);flex-shrink:0;letter-spacing:.02em}
.meth.GET{color:var(--k-api);background:color-mix(in srgb,var(--k-api) 14%,transparent)}
.meth.POST{color:var(--k-ui);background:color-mix(in srgb,var(--k-ui) 14%,transparent)}
.meth.DELETE{color:var(--k-test);background:color-mix(in srgb,var(--k-test) 14%,transparent)}
.meth.SSE{color:var(--event);background:color-mix(in srgb,var(--event) 14%,transparent)}

/* Side sheet */
.sheet{position:absolute;top:0;right:0;bottom:0;z-index:7;width:400px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-18px 0 48px rgba(0,0,0,.16);transform:translateX(104%);transition:transform .42s var(--out);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:14px 12px 10px 18px}
[tabindex="-1"]:focus{outline:none}
.sh-head h2{margin:0;font-size:16px;font-weight:600;font-family:"Geist Mono",monospace;word-break:break-all;line-height:1.35}
.sh-head p{margin:2px 0 0;font-size:12px;color:var(--faint);font-family:"Geist Mono",monospace;word-break:break-all}
.sh-body{flex:1;overflow-y:auto;padding:0 18px 18px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--raise);font-size:12px;color:var(--muted)}
.badge.warm{background:color-mix(in srgb,var(--warm) 14%,transparent);color:var(--warm);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:14px}
.stats div{background:var(--panel);padding:8px 10px}
.stats b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stats span{font-size:11.5px;color:var(--faint);line-height:1.2;display:block}
.sh-sec{margin:0 0 14px}
.sh-sec h3{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--faint)}
.jevcard{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);background:var(--raise);font-size:13px}
.jevcard .jb{width:26px;height:26px;display:grid;place-items:center}
.jevcard small{display:block;color:var(--faint);font-size:12px}
.preview{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raise);padding:10px 0;font-family:"Geist Mono",monospace;font-size:12px;position:relative;overflow:hidden}
.preview .ln{display:flex;align-items:center;gap:12px;height:19px;padding:0 12px}
.preview .ln em{font-style:normal;color:var(--faint);width:18px;text-align:right;font-size:11px;opacity:.7}
.sk{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 55%,var(--panel)) 50%,var(--line) 75%);background-size:200% 100%;animation:skel 1.6s linear infinite}
@keyframes skel{from{background-position:100% 0}to{background-position:-100% 0}}
.preview .cap{position:absolute;right:10px;bottom:8px;font-family:"Geist",sans-serif;font-size:11.5px;color:var(--faint);background:var(--raise);padding:0 4px}
.flist{list-style:none;margin:0;padding:0}
.flist button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px;margin:0 -6px;border-radius:6px;font-size:12.5px;text-align:left}
.flist button:hover{background:var(--raise)}
.flist .nm{font-family:"Geist Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.flist .n{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.sh-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sh-foot .btn{height:36px}
.sh-foot .primary{flex:1;justify-content:center}

/* Review areas panel */
.review{position:absolute;top:0;right:0;bottom:0;z-index:7;width:420px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-18px 0 48px rgba(0,0,0,.14);transform:translateX(104%);transition:transform .42s var(--out);visibility:hidden}
.review.open{transform:none;visibility:visible}
.rv-head{padding:14px 12px 10px 18px;display:flex;gap:10px;align-items:flex-start}
.rv-head h2{margin:0;font-size:15px;font-weight:600}
.rv-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.rv-list{flex:1;overflow-y:auto;padding:0 12px 14px;list-style:none;margin:0}
.rv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 8px;border-radius:var(--r-sm);border-bottom:1px solid var(--line)}
.rv-item:hover{background:color-mix(in srgb,var(--raise) 60%,transparent)}
.rv-name{display:flex;align-items:center;gap:7px;min-width:0}
.rv-name button{font-weight:500;font-size:13.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-name button:hover{text-decoration:underline;text-underline-offset:3px}
.rv-name .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-meta{grid-column:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.rv-item .seg{grid-row:1/3;grid-column:2;--n:3;width:176px}
.check,.you{white-space:nowrap}
.rv-item .seg button{padding:3px 0;font-size:12px}
.you{font-size:11px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:0 7px;line-height:17px}
.undo{font-size:12px;color:var(--faint);text-decoration:underline;text-underline-offset:2px}
.check{font-size:11px;font-weight:600;color:var(--warm);background:color-mix(in srgb,var(--warm) 13%,transparent);border-radius:999px;padding:0 7px;line-height:17px}
.meter{width:36px;height:4px;border-radius:999px;background:var(--line);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--c-jev);border-radius:999px}
.rv-foot{padding:10px 18px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.45}

/* Unmatched panel */
.unm{position:absolute;right:14px;top:14px;z-index:4;width:330px;max-height:min(400px,calc(100% - 80px));display:flex;flex-direction:column;animation:rise .35s var(--out);overflow:hidden}
.unm-h{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 12px}
.unm-h h3{margin:0;font-size:13px;font-weight:600}
.unm .seg{margin:0 10px 6px;--n:2}
.unm .seg button{font-size:12px;padding:3px 0}
.unm ul{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto}
.unm li button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border-radius:7px;text-align:left;font-size:12px}
.unm li button:hover{background:var(--gold-soft)}
.unm .ep{font-family:"Geist Mono",monospace;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unm .fl{color:var(--faint);font-size:11px;font-family:"Geist Mono",monospace}
.unm .note{font-size:11.5px;color:var(--faint);padding:6px 12px 10px;line-height:1.4;border-top:1px solid var(--glass-line)}
.unm .none{padding:14px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:center}

/* Path card (combined view) */
.pathcard{position:absolute;left:50%;bottom:14px;z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px;max-width:calc(100% - 120px);overflow-x:auto;animation:rise .35s var(--out)}
.pathcard .ep{display:flex;align-items:center;gap:6px;font-family:"Geist Mono",monospace;font-size:12px;white-space:nowrap;padding-right:10px;margin-right:4px;border-right:1px solid var(--glass-line)}
.step{display:flex;flex-direction:column;align-items:flex-start;padding:3px 8px;border-radius:8px;white-space:nowrap}
.step:hover{background:var(--gold-soft)}
.step small{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.step span{font-family:"Geist Mono",monospace;font-size:12px}
.arrow{color:var(--faint);flex-shrink:0}

/* Spark line (first build) */
.spark-say{position:absolute;left:50%;top:18px;z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;max-width:calc(100% - 28px);animation:rise .45s var(--out)}
.spark-say p{margin:0;font-size:13.5px;line-height:1.45}
.spark-say small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:3px;border-radius:999px;background:var(--glass-line);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .5s var(--out)}

/* Toast */
.toasts{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20}
.toast{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-sm);background:var(--text);color:var(--panel);font-size:13px;animation:rise .3s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}

@media (max-width:1300px){.status span.long{display:none}}
@media (max-width:1100px){.status{display:none}}
@media (max-width:900px){.search{max-width:none}}
@media (max-width:640px){
  .rail{display:none}
  .page{margin:0;border:0;border-radius:0}
  .mhead{padding:8px 10px;gap:6px}
  .mtitle{display:none}
  .search{order:5;flex-basis:100%;max-width:none}
  .status{display:none}
  .switch .lbl,#reviewBtn .lbl{display:none}
  #reviewBtn{padding:0 9px}
  .sheet,.review{width:100%;top:auto;height:78%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  .sheet.open,.review.open{transform:none}
  .legend{width:auto;right:60px}
  .unm{left:14px;right:14px;width:auto;top:auto;bottom:60px;max-height:45%}
  .pathcard{max-width:calc(100% - 28px);bottom:60px}
  .crumb .kbar,.crumb .jev{display:none}
  .fbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .fbar::-webkit-scrollbar{display:none}
  .fgroup{flex-shrink:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .sk{animation:none}
}

  slot.innerHTML=`<section class="legend glass" aria-label="Legend"><h3>${area?"Area":"How to read the sky"}<button data-act="hide-legend" aria-label="Hide legend"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h3><ul>
  ${area?KINDS.map(([k,l])=>li(`<i class="kdot" style="width:10px;height:10px;background:var(--k-${k})"></i>`,{ui:"UI: screens, components, styles",api:"API and server logic",data:"Data: schema, persistence, contracts",test:"Tests, seeds and stubs",config:"Config, scripts and build"}[k])).join("")+li(`<svg width="22" height="8"><path d="M1 4h20" stroke="var(--muted)" stroke-width="1"/></svg>`,"Line: one file imports the other")+li(`<i class="lg-star" style="width:12px;height:12px"></i>`,"Bigger: more files depend on it")
  :li(`<i class="lg-star" style="width:11px;height:11px"></i><i class="lg-star" style="width:4px;height:4px;margin-top:-2px"></i>`,"Star size: files that depend on it, plus how often it changes")
   +li(`<svg width="22" height="10"><path d="M2 8 11 3l9 4" stroke="var(--star-line)" stroke-width="1.2" fill="none"/><circle cx="2" cy="8" r="2" fill="var(--star)"/><circle cx="11" cy="3" r="2.4" fill="var(--star)"/><circle cx="20" cy="7" r="1.6" fill="var(--star)"/></svg>`,"Constellation: an area's main files, joined by their imports")
   +li(`<svg width="22" height="6"><path d="M1 3h20" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 4" stroke-linecap="round"/></svg>`,"Faint line: imports between areas")
   +li(`<span style="font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.08em">ABC</span>`,"Brighter areas are Core, dimmer are Feature")
   +(S.V.id==="combined"?li(`<i class="line-ic" style="--c:var(--bridge)"></i>`,"Bridge: a web call and the server route that answers it"):"")
   +li(`<i class="lg-ring"></i>`,"Changed in this chat")}
  </ul></section>`;
}
$("legendSlot").addEventListener("click",e=>{if(e.target.closest("[data-act=hide-legend]")){S.legend=false;renderLegend();renderFilters()}});
function renderUnm(){
  const slot=$("unmSlot");if(S.V.id!=="combined"||!S.unm||S.path!=null){slot.innerHTML="";return}
  const R=D.unmatched.routes,C=D.unmatched.calls,tab=S.unmTab;
  const list=tab==="routes"?R:C;
  slot.innerHTML=`<section class="unm glass" aria-labelledby="unmT"><div class="unm-h"><h3 id="unmT">Unmatched</h3><span class="sp"></span><button class="icon-btn" style="width:26px;height:26px" data-act="close-unm" aria-label="Close unmatched list"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="seg" role="tablist" aria-label="Unmatched kind"><span class="seg-ind" style="transform:translateX(${tab==="routes"?0:100}%)"></span><button role="tab" aria-selected="${tab==="routes"}" aria-checked="${tab==="routes"}" data-tab="routes">Routes nobody calls · ${R.length}</button><button role="tab" aria-selected="${tab==="calls"}" aria-checked="${tab==="calls"}" data-tab="calls">Calls with no route · ${C.length}</button></div>
    ${list.length?`<ul>${list.map(r=>`<li><button data-file="${r.file}"><span class="meth ${r.m}">${r.m}</span><span class="ep">${esc(r.path.replace(/^\/api/,""))}</span><span class="fl">${esc(F[r.file].name.replace(/\.ts$/,""))}</span></button></li>`).join("")}</ul>`
      :`<div class="none">${scoutSVG(22,"happy")}<span>Every call from spark-web reaches a route in spark-server.</span></div>`}
    <div class="note">Matched by method and path in the source. Downloads, uploads and streams opened another way can show up here.</div></section>`;
}
$("unmSlot").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.act==="close-unm"){S.unm=false;renderUnm();renderFilters();refit()}
  if(b.dataset.tab){S.unmTab=b.dataset.tab;renderUnm()}if(b.dataset.file)goFile(+b.dataset.file)});
$("unmSlot").addEventListener("pointerover",e=>{const b=e.target.closest("[data-file]");S.unmHover=b?+b.dataset.file:null;S.dirty=true});
$("unmSlot").addEventListener("pointerleave",()=>{S.unmHover=null;S.dirty=true});
const ROLE=["Component","Client call","Route","Handler","Data","Data"];
function setPath(j){S.path=j;hideTip();renderPath();renderUnm();renderLegend();S.dirty=true;
  if(j!=null){const p=PAIRS[j];const pts=p.chain.filter(i=>S.V.fg[i]>=0).map(fpos);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
    const b=[x0-240,y0-260,x1+240,y1+260];flyTo(camFor(b),900);announce(`Path for ${p.list[0].m} ${p.list[0].path}: ${p.chain.map(i=>F[i].name).join(", then ")}.`)}}
function renderPath(){
  const slot=$("pathSlot");if(S.path==null){slot.innerHTML="";return}const p=PAIRS[S.path],b=p.list[0];
  const hasUI=F[p.chain[0]].p.endsWith(".tsx");const roles=hasUI?ROLE:ROLE.slice(1);
  slot.innerHTML=`<nav class="pathcard glass" aria-label="Request path"><span class="ep"><span class="meth ${b.m}">${b.m}</span>${esc(b.path)}</span>${p.chain.map((i,k)=>`${k?`<svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>`:""}<button class="step" data-file="${i}"><small>${k+1} · ${roles[k]||"Step"}</small><span>${esc(F[i].name)}</span></button>`).join("")}
  <button class="icon-btn" data-act="close-path" aria-label="Clear path" style="margin-left:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></nav>`;
}
$("pathSlot").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.act==="close-path")setPath(null);if(b.dataset.file)openSheet(+b.dataset.file)});

/* ================= First build ================= */
function startBuild(freezeAt){
  const V=S.V;const order=V.groups.map((g,gi)=>gi).sort((a,b)=>{const ra=Math.hypot(V.groups[a].cx,V.groups[a].cy),rb=Math.hypot(V.groups[b].cx,V.groups[b].cy);return ra-rb});
  const step=reduce?600:520,t0=performance.now()+700;
  const appear={};S.build={t0,order,step,appear,freezeAt};
  if(freezeAt!=null){const n=Math.round(order.length*freezeAt);order.slice(0,n).forEach((gi,k)=>appear[gi]=-1e6);S.build.frozen=true}
  renderStatus();renderSpark();renderLegend();
}
function stepBuild(now){
  const B=S.build;if(B.frozen){return}
  const n=Math.floor((now-B.t0)/B.step)+1;let changed=false;
  for(let k=0;k<Math.min(n,B.order.length);k++){const gi=B.order[k];if(B.appear[gi]==null){B.appear[gi]=reduce?-1e6:now;changed=true}}
  if(changed)renderSpark();
  if(Object.keys(B.appear).length===B.order.length&&now-B.t0>B.order.length*B.step+900){S.build=null;renderStatus();renderSpark(true);renderLegend()}
}
function renderSpark(done){
  const slot=$("sparkSlot");
  if(done){slot.innerHTML=`<div class="spark-say glass" role="status">${scoutSVG(34,"happy")}<div><p>All ${S.V.groups.length} areas are on the map. Click a gold name to look inside.</p></div></div>`;setTimeout(()=>{if(!S.build)slot.innerHTML=""},3200);return}
  if(!S.build){slot.innerHTML="";return}
  const B=S.build,k=Object.keys(B.appear).length,N=B.order.length;const files=B.order.slice(0,k).reduce((s,gi)=>s+S.V.groups[gi].files.length,0);
  const last=k?A[S.V.groups[B.order[k-1]].area].name:"";
  slot.innerHTML=`<div class="spark-say glass" role="status">${scoutSVG(34,"working")}<div><p>${k===0?"I'm reading your project and sorting it into areas. Each one lights up when it's done.":`Charted <b style="font-weight:600">${esc(last)}</b>. The rest are on their way.`}</p>
    <small>${k} of ${N} areas · ${fmtN(files)} of ${fmtN(S.V.groups.reduce((s,g)=>s+g.files.length,0))} files</small><div class="pbar"><i style="width:${k/N*100}%"></i></div></div></div>`;
}

/* ================= View switching ================= */
function setView(anim=true){
  const id=viewId();S.V=view(id);S.mode="sky";S.T=0;NET=null;S.Tdir=0;S.path=null;S.focus=-1;hideTip();closeSheet();
  kFit=fitK(S.V.bounds);S.cam=camFor(S.V.bounds);placeLabels(S.V,S.cam.k);
  S.legend=id!=="combined"&&innerWidth>640;
  renderRepoBtn();renderFilters();renderCrumb();renderLegend();renderUnm();renderPath();
  $("chgCnt").textContent=S.changes?[...CHANGED].filter(inView).length:"";
  cv.setAttribute("aria-label",id==="combined"?`Combined map of spark-web and spark-server: ${S.V.groups.length} areas, ${D.bridges.length} API links.`:`Project map of ${$("repoLabel").textContent}: ${S.V.groups.length} areas as constellations, ${fmtN(F.filter(f=>S.V.fg[f.i]>=0).length)} files as stars.`);
  S.dirty=true;
}

/* ================= Theme + mockup states ================= */
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem("spark-map-theme",t)}catch(e){}
  document.querySelectorAll("#themeSeg button").forEach((b,k)=>b.setAttribute("aria-checked",b.dataset.themeV===t));
  document.querySelector("#themeSeg .seg-ind").style.transform=`translateX(${t==="dark"?100:0}%)`;readPalette();
  if(S.sel!=null||S.review||S.mode==="area"){renderCrumb();}}
$("themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTheme(b.dataset.themeV)});
const STATES=[["","Sky"],["area","Area network"],["hover","Hover"],["selected","File sheet"],["changes","Changes"],["review","Review areas"],["first-build","First build"],["combined","Combined repos"],["combined-path","Bridge path"],["combined-unmatched","Unmatched"]];
function renderStates(){const h=location.hash.slice(1);$("stateNav").innerHTML=`<span>State</span>`+STATES.map(([k,l])=>`<a href="#${k}" aria-current="${h===k}">${l}</a>`).join("")}
function route(){
  const h=location.hash.slice(1);renderStates();
  S.repos=new Set(h.startsWith("combined")?["web","server"]:["mono"]);S.changes=h==="changes";$("chgBtn").setAttribute("aria-checked",S.changes);
  A.forEach(a=>a.tier=a.jevTier);S.build=null;$("sparkSlot").innerHTML="";S.pinned=null;S.unm=h==="combined-unmatched";S.unmTab="routes";S.sel=null;$("sheet").classList.remove("open");
  toggleReview(false,true);setView(false);renderStatus();
  const find=p=>F.findIndex(f=>f.p===p);
  if(h==="area"){const gi=S.V.groups.findIndex(g=>A[g.area].id==="tickets");enterArea(gi,true)}
  if(h==="hover"){const i=find("apps/server/src/persistence/db.ts");setTimeout(()=>{S.hover={type:"file",i};showTip(fileTip(i),0,0);placeTipAtStar(i);S.dirty=true},60)}
  if(h==="selected"){const i=find("apps/web/src/api/client.ts");openSheet(i)}
  if(h==="review")toggleReview(true);
  if(h==="first-build"){const at=params.get("at");startBuild(at!=null?+at:null)}
  if(h==="combined-path"){const j=PAIRS.findIndex(p=>p.list.some(b=>b.path==="/api/tickets/search"));setPath(j)}
}
addEventListener("hashchange",route);
let roT=0;new ResizeObserver(()=>{cancelAnimationFrame(roT);roT=requestAnimationFrame(()=>{const zr=zoomRel();resize();kFit=fitK(S.V.bounds);placeLabels(S.V,camFor(S.V.bounds).k);if(S.mode==="sky"&&zr<1.25&&S.path==null)S.cam=camFor(S.V.bounds)})}).observe($("stage"));

/* ================= Boot ================= */
$("railLogo").innerHTML=scoutSVG(34);
readPalette();S.V=view(viewId());resize();route();
document.fonts&&document.fonts.ready.then(()=>{placeLabels(S.V,kFit);S.dirty=true});
requestAnimationFrame(frame);
window.__map={S,F,A,PAIRS,goFile,enterArea,openSheet,setPath};
})();
</script>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../apps/web/public/theme.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
  .pair { display: flex; gap: 40px; align-items: flex-start; }
  .col h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .rail { width: 272px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); color: var(--muted); font-size: 12.5px; overflow: hidden; }
  .sec { padding: 8px 6px; border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; min-height: 24px; padding: 0 6px; }
  .title { color: var(--faint); font-size: 12px; font-weight: 500; }
  .link { color: var(--accent); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: var(--r-sm); }
  .row.one { align-items: center; min-height: 28px; padding: 0 6px; }
  .ico { width: 16px; height: 17px; display: grid; place-items: center; color: var(--faint); flex-shrink: 0; }
  .ico svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .ok .ico { color: var(--success); } .warn .ico { color: var(--warn); }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .main { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .det { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .one .main { flex: 0 0 auto; max-width: 62%; }
  .one .det { flex: 1 1 0; min-width: 0; text-align: right; padding-left: 8px; }
  .add { color: var(--success); font-size: 12px; margin-left: 6px; } .rem { color: var(--danger); font-size: 12px; margin-left: 4px; }
  .note { padding: 2px 6px 6px; color: var(--faint); font-size: 12px; }
  .grp { padding: 4px 6px 2px; color: var(--faint); font-size: 12px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 3px 6px; }
  .item .main { flex: 1; }
  .item small { color: var(--faint); font-size: 12px; display: block; }
  .sw { width: 26px; height: 15px; border-radius: 8px; background: var(--accent); position: relative; flex-shrink: 0; }
  .sw::after { content: ''; position: absolute; right: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--panel); }
  .sw.off { background: var(--line); } .sw.off::after { right: auto; left: 2px; }
  .chev { color: var(--faint); margin-left: 6px; }
  .theme + .theme { margin-top: 28px; }
  .sub { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 6px 0 30px; }
  .sub .main { flex: 1; min-width: 0; }
  .sub .det { flex: 0 1 auto; }
  .chev.open { transform: rotate(90deg); display: inline-block; }
  .sel { background: var(--raise); }
  .tip { margin: 2px 6px 4px 30px; padding: 6px 8px; border-radius: var(--r-sm); background: var(--raise); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="folder" viewBox="0 0 16 16"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></symbol>
  <symbol id="who" viewBox="0 0 16 16"><circle cx="8" cy="6" r="2.5"/><path d="M3.5 13c.8-2.2 2.5-3.2 4.5-3.2s3.7 1 4.5 3.2"/></symbol>
  <symbol id="book" viewBox="0 0 16 16"><path d="M3 3.5h4.5v9H3zM8.5 3.5H13v9H8.5z"/></symbol>
  <symbol id="shield" viewBox="0 0 16 16"><path d="M8 2.5l4.5 1.6v3.6c0 2.8-2 4.6-4.5 5.8-2.5-1.2-4.5-3-4.5-5.8V4.1z"/></symbol>
  <symbol id="changes" viewBox="0 0 16 16"><path d="M4 2.5h6l2.5 2.5v8.5H4zM6.5 8h3M8 6.5v3M6.5 11h3"/></symbol>
  <symbol id="check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></symbol>
  <symbol id="pr" viewBox="0 0 16 16"><circle cx="4.5" cy="4" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="11.5" cy="12" r="1.5"/><path d="M4.5 5.5v5M11.5 10.5V6.5c0-1.2-.8-2-2-2H7.5"/></symbol>
  <symbol id="usage" viewBox="0 0 16 16"><path d="M3 12.5V9M6.3 12.5V6M9.6 12.5V8M13 12.5V3.5"/></symbol>
  <symbol id="plug" viewBox="0 0 16 16"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 01-7 0zM8 11.5v2"/></symbol>
  <symbol id="puzzle" viewBox="0 0 16 16"><path d="M3 5h3a1.5 1.5 0 013 0h3v3a1.5 1.5 0 010 3v2H3z"/></symbol>
  <symbol id="spark" viewBox="0 0 16 16"><path d="M8 2.5l1.4 4.1 4.1 1.4-4.1 1.4L8 13.5l-1.4-4.1L2.5 8l4.1-1.4z"/></symbol>
</svg>

<template id="before">
  <div class="rail">
    <div class="sec">
      <div class="head"><span class="title">Context</span></div>
      <div class="row"><span class="ico"><svg><use href="#folder"/></svg></span><span class="txt"><span class="main">spark-outpost</span><span class="det">spark/chat-rail-one-line · worktree</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#who"/></svg></span><span class="txt"><span class="main">Claude · Opus 5.5</span><span class="det">Bypass permissions</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#book"/></svg></span><span class="txt"><span class="main">Following AGENTS.md, CLAUDE.md</span><span class="det">and 2 more instruction files</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#shield"/></svg></span><span class="txt"><span class="main">Full auto → PR</span><span class="det">Opens a pull request when done</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#changes"/></svg></span><span class="txt"><span class="main">6 files<span class="add">+214</span><span class="rem">−37</span></span><span class="det">Uncommitted in the worktree</span></span></div>
      <div class="row ok"><span class="ico"><svg><use href="#check"/></svg></span><span class="txt"><span class="main">Checks passing</span><span class="det">12 of 12</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#pr"/></svg></span><span class="txt"><span class="main">PR #293</span><span class="det">Open</span></span></div>
      <div class="row"><span class="ico"><svg><use href="#usage"/></svg></span><span class="txt"><span class="main">1.2M tokens · $4.18</span><span class="det">38% context</span></span></div>
    </div>
    <div class="sec">
      <div class="head"><span class="title">Tools ›</span><span class="link">Manage</span></div>
      <div class="note">Changes apply to the next message.</div>
      <div class="grp">MCP servers</div>
      <div class="item"><span class="txt main">github<small>Read and write issues and pull requests</small></span><span class="sw"></span></div>
      <div class="item"><span class="txt main">linear<small>Tickets for the Spark project</small></span><span class="sw"></span></div>
      <div class="item"><span class="txt main">postgres<small>Local database, read only</small></span><span class="sw off"></span></div>
      <div class="grp">Plugins</div>
      <div class="item"><span class="txt main">code-review<small>Review the current diff</small></span><span class="sw"></span></div>
      <div class="item"><span class="txt main">design-kit<small>Spark design tokens and checks</small></span><span class="sw"></span></div>
      <div class="grp">Skills</div>
      <div class="item"><span class="txt main">release-notes<small>Write the What's new row</small></span><span class="sw"></span></div>
      <div class="item"><span class="txt main">db-migration<small>Add a numbered migration</small></span><span class="sw"></span></div>
    </div>
  </div>
</template>

<template id="after">
  <div class="rail">
    <div class="sec">
      <div class="head"><span class="title">Context</span></div>
      <div class="row one"><span class="ico"><svg><use href="#folder"/></svg></span><span class="main">spark-outpost</span><span class="det">spark/chat-rail-one-line</span></div>
      <div class="row one"><span class="ico"><svg><use href="#who"/></svg></span><span class="main">Opus 5.5</span><span class="det">Bypass</span></div>
      <div class="row one"><span class="ico"><svg><use href="#book"/></svg></span><span class="main">Following 4</span><span class="det">AGENTS.md…</span></div>
      <div class="row one"><span class="ico"><svg><use href="#shield"/></svg></span><span class="main">Full auto → PR</span></div>
      <div class="row one"><span class="ico"><svg><use href="#changes"/></svg></span><span class="main">6 files</span><span class="det"><span class="add">+214</span><span class="rem">−37</span></span></div>
      <div class="row one ok"><span class="ico"><svg><use href="#pr"/></svg></span><span class="main">PR #293</span><span class="det">Checks passing</span></div>
      <div class="row one"><span class="ico"><svg><use href="#usage"/></svg></span><span class="main">$4.18</span><span class="det">38% context</span></div>
    </div>
    <div class="sec">
      <div class="head"><span class="title">Tools</span><span class="link">Manage</span></div>
      <div class="row one"><span class="ico"><svg><use href="#plug"/></svg></span><span class="main">MCP servers</span><span class="det">2 of 3 on</span><span class="chev">›</span></div>
      <div class="row one"><span class="ico"><svg><use href="#puzzle"/></svg></span><span class="main">Plugins</span><span class="det">2 on</span><span class="chev">›</span></div>
      <div class="row one"><span class="ico"><svg><use href="#spark"/></svg></span><span class="main">Skills</span><span class="det">2 on</span><span class="chev">›</span></div>
    </div>
  </div>
</template>

  <div class="rail">
    <div class="sec">
      <div class="head"><span class="title">Context</span></div>
      <div class="row one"><span class="ico"><svg><use href="#folder"/></svg></span><span class="main">spark-outpost</span><span class="det">spark/chat-rail-one-line</span></div>
      <div class="row one"><span class="ico"><svg><use href="#who"/></svg></span><span class="main">Opus 5.5</span><span class="det">Bypass</span></div>
      <div class="row one"><span class="ico"><svg><use href="#book"/></svg></span><span class="main">Following 4</span><span class="det">AGENTS.md…</span></div>
      <div class="row one"><span class="ico"><svg><use href="#shield"/></svg></span><span class="main">Full auto → PR</span></div>
      <div class="row one"><span class="ico"><svg><use href="#changes"/></svg></span><span class="main">6 files</span><span class="det"><span class="add">+214</span><span class="rem">−37</span></span></div>
      <div class="row one ok"><span class="ico"><svg><use href="#pr"/></svg></span><span class="main">PR #293</span><span class="det">Checks passing</span></div>
      <div class="row one"><span class="ico"><svg><use href="#usage"/></svg></span><span class="main">$4.18</span><span class="det">38% context</span></div>
    </div>
    <div class="sec">
      <div class="head"><span class="title">Tools</span><span class="link">Manage</span></div>
      <div class="row one sel"><span class="ico"><svg><use href="#plug"/></svg></span><span class="main">MCP servers</span><span class="det">2 of 3 on</span><span class="chev open">›</span></div><div class="sub"><span class="main">github</span><span class="sw"></span></div><div class="sub"><span class="main">linear</span><span class="sw"></span></div><div class="sub"><span class="main">postgres</span><span class="det">Off</span><span class="sw off"></span></div><div class="row one"><span class="ico"><svg><use href="#puzzle"/></svg></span><span class="main">Plugins</span><span class="det">2 on</span><span class="chev">›</span></div><div class="row one"><span class="ico"><svg><use href="#spark"/></svg></span><span class="main">Skills</span><span class="det">2 on</span><span class="chev">›</span></div>
    </div>
  </div>
</template>

  <div class="rail">
    <div class="sec">
      <div class="head"><span class="title">Context</span></div>
      <div class="row one"><span class="ico"><svg><use href="#folder"/></svg></span><span class="main">spark-outpost</span><span class="det">spark/chat-rail-one-line</span></div>
      <div class="row one"><span class="ico"><svg><use href="#who"/></svg></span><span class="main">Opus 5.5</span><span class="det">Bypass</span></div>
      <div class="row one"><span class="ico"><svg><use href="#book"/></svg></span><span class="main">Following 4</span><span class="det">AGENTS.md…</span></div>
      <div class="row one"><span class="ico"><svg><use href="#shield"/></svg></span><span class="main">Full auto → PR</span></div>
      <div class="row one"><span class="ico"><svg><use href="#changes"/></svg></span><span class="main">6 files</span><span class="det"><span class="add">+214</span><span class="rem">−37</span></span></div>
      <div class="row one ok"><span class="ico"><svg><use href="#pr"/></svg></span><span class="main">PR #293</span><span class="det">Checks passing</span></div>
      <div class="row one"><span class="ico"><svg><use href="#usage"/></svg></span><span class="main">$4.18</span><span class="det">38% context</span></div>
    </div>

      <div class="head"><span class="title">Tools</span><span class="link">Manage</span></div>
      <div class="row one sel"><span class="ico"><svg><use href="#plug"/></svg></span><span class="main">MCP servers</span><span class="det">2 of 3 on</span><span class="chev open">›</span></div><div class="sub"><span class="main">github</span><span class="sw"></span></div><div class="tip">Read and write issues and pull requests</div><div class="sub"><span class="main">linear</span><span class="sw"></span></div><div class="sub"><span class="main">postgres</span><span class="sw off"></span></div><div class="row one sel"><span class="ico"><svg><use href="#puzzle"/></svg></span><span class="main">Plugins</span><span class="det">2 on</span><span class="chev open">›</span></div><div class="sub"><span class="main">code-review</span><span class="sw"></span></div><div class="sub"><span class="main">design-kit</span><span class="sw"></span></div><div class="row one sel"><span class="ico"><svg><use href="#spark"/></svg></span><span class="main">Skills</span><span class="det">2 on</span><span class="chev open">›</span></div><div class="sub"><span class="main">release-notes</span><span class="sw"></span></div><div class="sub"><span class="main">db-migration</span><span class="sw"></span></div><div class="note" style="padding:6px 6px 2px">Changes apply to the next message.</div>
    </div>
  </div>
</template>
<div class="theme" data-skin="apricot" style="background:var(--bg);padding:20px;border-radius:12px">
  <div class="pair"><div class="col"><h2>Today</h2><div data-use="before"></div></div><div class="col"><h2>One line per item</h2><div data-use="after"></div></div><div class="col"><h2>MCP servers opened</h2><div data-use="open1"></div></div><div class="col"><h2>All opened, hover on github</h2><div data-use="open2"></div></div></div>
</div>
<div class="theme" data-skin="void" style="background:var(--bg);padding:20px;border-radius:12px">
  <div class="pair"><div class="col"><h2>Today</h2><div data-use="before"></div></div><div class="col"><h2>One line per item</h2><div data-use="after"></div></div><div class="col"><h2>MCP servers opened</h2><div data-use="open1"></div></div><div class="col"><h2>All opened, hover on github</h2><div data-use="open2"></div></div></div>
</div>
<script>
  for (const slot of document.querySelectorAll('[data-use]')) slot.replaceWith(document.getElementById(slot.dataset.use).content.cloneNode(true));
</script>
</body>
</html>

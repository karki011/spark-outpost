<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Outpost</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --panel:#ffffff; --raise:#eef0f3; --line:#e2e5ea;
  --text:#16191e; --muted:#495160; --faint:#575f6a;
  --accent:#078470; --accent-ink:#fff; --accent-soft:rgba(7,132,112,.11);
  --user:#e8f3f0; --user-text:#16191e;
  --danger:#bb3430; --danger-soft:rgba(187,52,48,.09); --warn:#8a4a00;
  --code:#f5f6f8; --r:14px; --r-sm:8px;
  --out:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  --line-strong:#85888d; --accent-text:#00715d; --warn-ink:#fff; --success:#007460;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f12; --panel:#12161a; --raise:#1a1f25; --line:#232a31;
    --text:#e7eaee; --muted:#a3aebc; --faint:#909aa7;
    --accent:#34c3a3; --accent-ink:#05231c; --accent-soft:rgba(52,195,163,.13);
    --user:#172a2a; --user-text:#e7eaee; --danger:#f06b63; --danger-soft:rgba(240,107,99,.11); --warn:#e8b04b; --code:#0e1215;
    --line-strong:#646c74; --accent-text:#34c3a3; --warn-ink:#1b1300; --success:#34c3a3;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f12; --panel:#12161a; --raise:#1a1f25; --line:#232a31;
  --text:#e7eaee; --muted:#a3aebc; --faint:#909aa7;
  --accent:#34c3a3; --accent-ink:#05231c; --accent-soft:rgba(52,195,163,.13);
  --user:#172a2a; --user-text:#e7eaee; --danger:#f06b63; --danger-soft:rgba(240,107,99,.11); --warn:#e8b04b; --code:#0e1215;
  --line-strong:#646c74; --accent-text:#34c3a3; --warn-ink:#1b1300; --success:#34c3a3;
}
body[data-skin="graphite"]{--bg:#0c0f12;--panel:#12161a;--raise:#1a1f25;--line:#232a31;--text:#e7eaee;--muted:#a3aebc;--faint:#909aa7;--accent:#34c3a3;--accent-ink:#05231c;--accent-soft:rgba(52,195,163,.13);--user:#172a2a;--user-text:#e7eaee;--danger:#f06b63;--danger-soft:rgba(240,107,99,.11);--warn:#e8b04b;--code:#0e1215;--line-strong:#646c74;--accent-text:#34c3a3;--warn-ink:#1b1300;--success:#34c3a3}
body[data-skin="apricot"]{--bg:#f6f1ed;--panel:#fffdfb;--raise:#f5eae1;--line:#ecdfd3;--text:#241a13;--muted:#614a3b;--faint:#6d594a;--accent:#c05600;--accent-ink:#fff;--accent-soft:rgba(192,86,0,.11);--user:#fde7d6;--user-text:#241a13;--danger:#ba3129;--danger-soft:rgba(186,49,41,.09);--warn:#7d4e00;--code:#faf2eb;--r:20px;--r-sm:12px;--line-strong:#8f8378;--accent-text:#a53f00;--warn-ink:#fff;--success:#1f7335}
body[data-skin="void"]{--bg:#000;--panel:#07070a;--raise:#121218;--line:#1d1d26;--text:#eceaf6;--muted:#a2a0b9;--faint:#8f8da7;--accent:#9d8aff;--accent-ink:#130c33;--accent-soft:rgba(157,138,255,.13);--user:#17142c;--user-text:#eceaf6;--danger:#ff6b8a;--danger-soft:rgba(255,107,138,.11);--warn:#f5c26b;--code:#0b0b10;--line-strong:#62626d;--accent-text:#9d8aff;--warn-ink:#1b1300;--success:#6fdca0}
body[data-skin="fjord"]{--bg:#edf1f5;--panel:#fff;--raise:#e9eef4;--line:#d7dfe8;--text:#132033;--muted:#405066;--faint:#536070;--accent:#2f6fe4;--accent-ink:#fff;--accent-soft:rgba(47,111,228,.1);--user:#2f6fe4;--user-text:#fff;--danger:#be2c30;--danger-soft:rgba(190,44,48,.09);--warn:#864800;--code:#f3f6fa;--r:10px;--r-sm:6px;--line-strong:#808890;--accent-text:#1c5ccf;--warn-ink:#fff;--success:#00763a}
body[data-skin="moss"]{--bg:#11140e;--panel:#171b13;--raise:#20251a;--line:#2b3122;--text:#e9ecdf;--muted:#afb79f;--faint:#9da68d;--accent:#c7d96b;--accent-ink:#1a1f06;--accent-soft:rgba(199,217,107,.12);--user:#262c1b;--user-text:#e9ecdf;--danger:#f08a5d;--danger-soft:rgba(240,138,93,.11);--warn:#f0c05a;--code:#10130c;--line-strong:#6a7160;--accent-text:#c7d96b;--warn-ink:#1b1300;--success:#a9d67a}
body[data-skin="lagoon"]{--bg:#e8f2f1;--panel:#fbfefe;--raise:#e1eeec;--line:#d0e2df;--text:#0f2427;--muted:#37555a;--faint:#455f63;--accent:#0a7389;--accent-ink:#fff;--accent-soft:rgba(10,115,137,.11);--user:#d6eef0;--user-text:#0f2427;--danger:#b7302f;--danger-soft:rgba(183,48,47,.09);--warn:#7f4c00;--code:#f0f7f6;--r:16px;--r-sm:10px;--line-strong:#728584;--accent-text:#00657a;--warn-ink:#fff;--success:#17713c}
body[data-skin="plum"]{--bg:#150f17;--panel:#1c1520;--raise:#261d2b;--line:#322638;--text:#f2e9f0;--muted:#c0aebd;--faint:#ab99a9;--accent:#e9ab8c;--accent-ink:#2b130c;--accent-soft:rgba(233,171,140,.13);--user:#33212f;--user-text:#f2e9f0;--danger:#ff7a8a;--danger-soft:rgba(255,122,138,.11);--warn:#f2c46d;--code:#120d14;--r:18px;--r-sm:12px;--line-strong:#75667c;--accent-text:#efb89c;--warn-ink:#1d1400;--success:#86d4a6}
body[data-skin="sage"]{--bg:#ecefe4;--panel:#fbfcf8;--raise:#e7ecdd;--line:#d8dfcc;--text:#1b2118;--muted:#4a5443;--faint:#596352;--accent:#a85a2a;--accent-ink:#fff;--accent-soft:rgba(168,90,42,.11);--user:#f1e0d6;--user-text:#1b2118;--danger:#b3263f;--danger-soft:rgba(179,38,63,.09);--warn:#7a4f00;--code:#f3f6ee;--r:20px;--r-sm:12px;--line-strong:#7a8370;--accent-text:#904a1f;--warn-ink:#fff;--success:#2c6e3a}
body[data-skin="aurora"]{--bg:#110f26;--panel:#18152f;--raise:#211e3b;--line:#2c2a46;--text:#ececf6;--muted:#bbbbd4;--faint:#ababc4;--accent:#c1f354;--accent-ink:#150e34;--accent-soft:rgba(193,243,84,.13);--user:#2d1b69;--user-text:#ececf6;--danger:#fc7182;--danger-soft:rgba(252,113,130,.11);--warn:#f4c26a;--code:#0d0a21;--r:16px;--r-sm:10px;--line-strong:#727289;--accent-text:#c4f16a;--warn-ink:#1b1300;--success:#78d694}
body[data-skin="iris"]{--bg:#f3f0fe;--panel:#fdfcff;--raise:#edeafb;--line:#e0dded;--text:#1e192c;--muted:#57506c;--faint:#625c75;--accent:#5b3df5;--accent-ink:#fff;--accent-soft:rgba(91,61,245,.11);--user:#e9e3ff;--user-text:#1e192c;--danger:#b63039;--danger-soft:rgba(182,48,57,.09);--warn:#7a4f00;--code:#f7f5ff;--r:14px;--r-sm:8px;--line-strong:#817d90;--accent-text:#5234e6;--warn-ink:#fff;--success:#1d6e38}
body[data-skin="contrast"]{--bg:#fff;--panel:#fff;--raise:#f0f0f0;--line:#000;--text:#000;--muted:#2b2b2b;--faint:#4d4d4d;--accent:#0000e0;--accent-ink:#fff;--accent-soft:rgba(0,0,224,.08);--user:#000;--user-text:#fff;--danger:#b00000;--danger-soft:rgba(176,0,0,.07);--warn:#845400;--code:#f5f5f5;--r:4px;--r-sm:2px;--line-strong:#000;--accent-text:#0000e0;--warn-ink:#fff;--success:#006b1f}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
svg{flex-shrink:0;display:block}
[hidden]{display:none!important}

/* ---------- Frame ---------- */
.app{height:100%;display:flex}
.side{width:268px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:width .35s var(--out),opacity .25s}
body.collapsed .side{width:0;opacity:0}
.side-in{width:268px;display:flex;flex-direction:column;height:100%;padding:14px 10px 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;position:relative;transition:margin .35s var(--out)}
body.collapsed .main{margin-left:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .2s var(--spring)}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.icon-btn:active{transform:scale(.9)}

/* ---------- Sidebar ---------- */
.side-top{display:flex;align-items:center;gap:4px;padding:0 4px 10px}
.side-top b{font-weight:600;flex:1;padding-left:6px}
.search{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:0 2px 8px;border-radius:var(--r-sm);color:var(--faint);font-size:14px;transition:background .15s}
.search:focus-within{background:var(--raise);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}

.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:0 2px 8px;padding:3px;background:var(--raise);border-radius:var(--r-sm)}
.tabs button{position:relative;z-index:1;padding:5px 0;font-size:13px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:500}
.tabs .cnt{font-size:12px;color:var(--faint);font-weight:400}
.tabs .adot{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:popin .4s var(--spring)}
.tab-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/2);border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .4s var(--spring)}

.attn-btn{display:flex;align-items:center;gap:10px;width:calc(100% - 4px);margin:0 2px 8px;padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn) 13%,transparent);font-size:13px;text-align:left;transition:background .2s}
.attn-btn:hover{background:color-mix(in srgb,var(--warn) 20%,transparent)}
.attn-btn span{flex:1}

.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -2px;padding:0 2px}
.list.fadein{animation:fade .3s var(--out)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px 12px;font-size:12px;color:var(--faint)}
.sec .icon-btn{width:24px;height:24px}
.newp input{display:block;width:100%;margin:2px 0 6px;padding:6px 10px;border:1px solid var(--accent);border-radius:var(--r-sm);background:var(--panel);outline:none;font-size:14px;box-shadow:0 0 0 3px var(--accent-soft);animation:pop .35s var(--spring)}
.newp small{display:block;font-size:12px;color:var(--faint);padding:0 4px 6px}

.pblock,.cblock{border-radius:var(--r-sm);transition:background .2s,box-shadow .2s}
.list.dragging .pblock,.list.dragging .cblock{box-shadow:inset 0 0 0 1px var(--line)}
.pblock.over,.cblock.over{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1.5px var(--accent)!important}
.cblock{min-height:40px;padding-bottom:4px}
.proj{display:flex;align-items:center;padding-right:4px;border-radius:var(--r-sm);transition:background .15s}
.proj:hover{background:var(--raise)}
.proj-head{flex:1;display:flex;align-items:center;gap:8px;padding:7px 6px 7px 10px;font-size:14px;min-width:0;text-align:left}
.proj-head .chev{color:var(--faint);transition:transform .3s var(--out)}
.pblock.open .proj-head .chev{transform:rotate(90deg)}
.proj-head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-head .nm input{width:100%;border:0;border-bottom:1px solid var(--accent);background:transparent;outline:none;padding:0}
.proj-head .c{font-size:12px;color:var(--faint)}
.pa{display:flex;opacity:0;transition:opacity .15s}
.proj:hover .pa,.proj:focus-within .pa{opacity:1}
.pa .icon-btn,.rmenu,.ract .icon-btn{width:24px;height:24px}
.pbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--out)}
.pblock.open .pbody{grid-template-rows:1fr}
.pbody>div{overflow:hidden;min-height:0}
.pbody .row{padding-left:32px}
.pempty{padding:4px 12px 8px 34px;font-size:12.5px;color:var(--faint)}
.pempty button{color:var(--accent-text);font-weight:500}

.row{display:flex;align-items:center;gap:9px;padding:6px 4px 6px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:14px;position:relative;transition:background .15s,color .15s,opacity .2s}
.row:hover{background:var(--raise);color:var(--text)}
.row.active{background:var(--raise);color:var(--text)}
.row.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent);animation:grow .3s var(--out)}
@keyframes grow{from{transform:scaleY(0)}}
.row.dragging{opacity:.3}
.row.flash{animation:flash 1.1s var(--out)}
@keyframes flash{0%,30%{background:var(--accent-soft)}}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint)}
.sub:empty{display:none}
.row.st-asking .sub{color:var(--warn)}
.row.st-error .sub{color:var(--danger)}
.row.st-running .tt{background:linear-gradient(90deg,var(--muted) 35%,var(--text) 50%,var(--muted) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.row.st-done .tt{color:var(--text);font-weight:500}
.rmenu,.ract{opacity:0;transition:opacity .15s}
.ract{display:flex}
.row:hover .rmenu,.row:focus-within .rmenu,.row:hover .ract,.row:focus-within .ract{opacity:1}
@media (hover:none){.rmenu,.pa,.ract{opacity:1}}

/* Status icons */
.st{width:14px;height:14px;display:grid;place-items:center;flex-shrink:0;position:relative}
.orb{width:13px;height:13px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 20%,var(--accent));-webkit-mask:radial-gradient(circle,transparent 3.6px,#000 4.2px);mask:radial-gradient(circle,transparent 3.6px,#000 4.2px);animation:rot .8s linear infinite}
.enter .orb{animation:popin .35s var(--spring),rot .8s linear infinite}
.udot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dchk{position:absolute;color:var(--accent-text)}
.st:not(.enter) .dchk{display:none}
.enter .dchk path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s var(--out) forwards}
.enter .dchk{animation:chkout .3s 1.1s var(--out) forwards}
.enter .udot{animation:popin .45s 1.2s var(--spring) both}
@keyframes chkout{to{opacity:0;transform:scale(.4)}}
.ask{width:7px;height:7px;border-radius:50%;background:var(--warn);position:relative;display:block}
.ask::before,.ask::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--warn);animation:ripple 1.9s var(--out) infinite}
.ask::after{animation-delay:.95s}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
.enter .ask{animation:popin .5s var(--spring)}
.errdot{width:14px;height:14px;border-radius:50%;background:var(--danger);color:var(--panel);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.enter .errdot{animation:popin .4s var(--spring),shake .4s .35s}
@keyframes popin{from{transform:scale(0)}}

/* Context menu + toast */
.ctx{position:fixed;z-index:60;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);animation:menuin .24s var(--spring)}
@keyframes menuin{from{opacity:0;transform:scale(.92) translateY(-4px)}}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-sm);font-size:13.5px;text-align:left}
.ctx button:hover{background:var(--raise)}
.ctx button svg{color:var(--muted)}
.ctx .lab{font-size:12px;color:var(--faint);padding:6px 8px 2px}
.ctx hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.ctx .danger,.ctx .danger svg{color:var(--danger)}
.ctx .tk{margin-left:auto;color:var(--accent-text)}
.toasts{position:relative}
.toast{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px 11px;border-radius:var(--r-sm);background:var(--text);color:var(--panel);font-size:13px;position:relative;overflow:hidden;animation:toastin .45s var(--spring)}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.toast.out{animation:toastout .25s var(--out) forwards}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
.toast span{flex:1;min-width:0;line-height:1.4}
.toast button{font-weight:600;color:var(--panel);text-decoration:underline;text-underline-offset:2px}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--accent);transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* Header */
.head{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px}
.title{min-width:0;display:flex;align-items:baseline;gap:8px}
.crumb{font-size:14px;color:var(--faint);white-space:nowrap}
.title h1{margin:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch{font-size:12px;color:var(--faint);white-space:nowrap}
.head-r{margin-left:auto;display:flex;gap:2px;position:relative}
.theme-dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,var(--text) 0);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.pop{position:absolute;right:0;top:40px;z-index:30;width:200px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.18);transform-origin:top right;transform:scale(.92) translateY(-4px);opacity:0;pointer-events:none;transition:transform .25s var(--spring),opacity .15s}
.pop.open{transform:none;opacity:1;pointer-events:auto}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-sm);font-size:13.5px;text-align:left}
.pop button:hover{background:var(--raise)}
.pop .sw{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--a) 0 50%,var(--b) 0);box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.pop .tick{margin-left:auto;opacity:0;color:var(--accent-text)}
.pop button[aria-checked="true"] .tick{opacity:1}

/* ---------- Thread ---------- */
.thread-wrap{flex:1;position:relative;min-height:0}
.thread{position:absolute;inset:0;overflow-y:auto;padding:4px 0 32px}
.inner{max-width:700px;margin:0 auto;padding:0 24px}
.inner.show{animation:fade .35s var(--out)}
.divider{text-align:center;font-size:12px;color:var(--faint);margin:28px 0 8px;animation:rise .45s var(--out) both}
.empty{text-align:center;padding:16vh 12px 0;animation:rise .5s var(--out)}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted);font-size:14px}

.msg{position:relative;margin-top:20px;animation:rise .45s var(--out) both}
.msg.cont{margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.msg.me{display:flex;flex-direction:column;align-items:flex-end}
.msg.me.flying{animation:none}
.bubble{max-width:82%;background:var(--user);color:var(--user-text);padding:8px 14px;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word;transform-origin:bottom right}
.msg.me.fresh{animation:none}
.msg.me.fresh .bubble{animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}}
.bubble.pending{opacity:.6}
.bubble.failed{background:var(--danger-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--danger);animation:shake .4s var(--out)}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.meta{display:flex;align-items:center;gap:2px;height:28px;font-size:12px;color:var(--faint);opacity:0;transition:opacity .2s}
.msg:hover .meta,.msg:focus-within .meta{opacity:1}
.meta time{padding:0 6px}
.meta .icon-btn{width:26px;height:26px}
.msg.me .meta{flex-direction:row-reverse}
.who{padding-right:6px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);height:24px;animation:rise .3s var(--out)}
.status.err{color:var(--danger)}
.status .check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .05s var(--out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.link{color:var(--danger);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.ai p{margin:0 0 8px}
.ai p:last-child{margin-bottom:0}
.ai code{font-family:"Geist Mono",monospace;font-size:.86em;background:var(--raise);padding:1px 5px;border-radius:5px}
.w{animation:fade .35s var(--out) both}
@keyframes fade{from{opacity:0;filter:blur(3px)}}
.errline{padding:9px 12px;border-radius:var(--r-sm);background:var(--danger-soft);font-size:14px;margin-bottom:4px}
.question{padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn) 11%,transparent);box-shadow:inset 2px 0 0 var(--warn)}

.steps{margin:0 0 10px}
.steps-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:3px 0}
.steps-head:hover{color:var(--text)}
.steps-head .chev,.diff .chev{transition:transform .3s var(--out)}
.steps.open .chev,.diff.open .chev{transform:rotate(90deg)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--out)}
.open>.collapse,.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden;min-height:0}
.steps ul{list-style:none;margin:4px 0 0 6px;padding:0 0 0 14px;border-left:1px solid var(--line)}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:3px 0;animation:rise .35s var(--out) both}
.steps li code{font-size:12px}
.ic{width:14px;height:14px;display:grid;place-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--accent-text);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ok{color:var(--accent-text)}
.ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s var(--out) forwards}
.diff{border:1px solid var(--line);border-radius:var(--r-sm);margin:10px 0;overflow:hidden;background:var(--code)}
.diff-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;font-size:13px}
.diff-head .f{font-family:"Geist Mono",monospace;font-size:12.5px;flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{color:var(--success);font-family:"Geist Mono",monospace;font-size:12px}
.minus{color:var(--danger);font-family:"Geist Mono",monospace;font-size:12px}
.diff .chev{color:var(--faint)}
.diff pre{margin:0;padding:10px 0;border-top:1px solid var(--line);overflow-x:auto;font:12.5px/1.65 "Geist Mono",ui-monospace,monospace}
.diff pre span{display:block;padding:0 14px}
.diff .d{background:var(--danger-soft);color:var(--danger)}
.diff .a{background:var(--accent-soft)}
.diff .cm{color:var(--faint)}
.result{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:2px 0 8px}
.result b{color:var(--text);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.act{padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);transition:background .15s,border-color .15s,transform .15s var(--spring);animation:rise .4s var(--out) both}
.act:hover{border-color:var(--faint);transform:translateY(-1px)}
.act:active{transform:scale(.96)}
.act.primary{background:var(--text);color:var(--panel);border-color:transparent}
.acts.used .act{opacity:.4;pointer-events:none}
.typing{display:flex;gap:4px;height:24px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:wave 1.1s infinite var(--out)}
.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}
@keyframes wave{30%{transform:translateY(-4px);background:var(--accent)}}
.jump{position:absolute;left:50%;bottom:12px;transform:translate(-50%,16px) scale(.9);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--text);color:var(--panel);font-size:12.5px;transition:transform .35s var(--spring),opacity .2s}
.jump.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* ---------- Composer ---------- */
.cwrap{padding:0 24px 18px}
.composer{position:relative;max-width:700px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .2s,box-shadow .3s var(--out)}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.composer.exhale{animation:exhale .4s var(--out)}
@keyframes exhale{35%{transform:scale(.985)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:var(--r-sm);background:var(--raise);font-size:13px;animation:pop .4s var(--spring) both;transform-origin:left center}
.chip small{color:var(--faint)}
.chip.out{animation:chipout .2s var(--out) forwards}
@keyframes chipout{to{opacity:0;transform:scale(.8)}}
.chip button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--line)}
textarea{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;padding:13px 16px 4px;line-height:1.6;max-height:calc(1.6em*5 + 17px);overflow-y:auto}
textarea::placeholder{color:var(--faint)}
.bar{display:flex;align-items:center;gap:2px;padding:6px 8px 8px}
.hint{margin-left:6px;font-size:12px;color:var(--faint);opacity:0;transform:translateX(6px);transition:opacity .25s,transform .3s var(--out);white-space:nowrap;padding-right:6px}
.composer:focus-within .hint{opacity:1;transform:none}
.send{position:relative;width:32px;height:32px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;transition:opacity .2s,transform .2s var(--spring),background .2s}
.send:disabled{opacity:.25;cursor:default}
.send:not(:disabled):hover{transform:scale(1.06)}
.send:not(:disabled):active{transform:scale(.92)}
.send svg{position:absolute;transition:transform .3s var(--spring),opacity .2s}
.send .stop{opacity:0;transform:scale(.4) rotate(-90deg)}
.send.busy{background:var(--text);color:var(--panel)}
.send.busy .arrow{opacity:0;transform:scale(.4) translateY(-6px)}
.send.busy .stop{opacity:1;transform:none}
.send.launch .arrow{animation:launch .5s var(--out)}
@keyframes launch{40%{transform:translateY(-22px);opacity:0}41%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}

.mbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:5px 8px 5px 10px;border-radius:var(--r-sm);font-size:13px;transition:background .15s}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--raise)}
.mbtn .chev2{color:var(--faint);transition:transform .3s var(--out)}
.mbtn[aria-expanded="true"] .chev2{transform:rotate(180deg)}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.meter i{width:3px;border-radius:1px;background:var(--line);transition:background .25s}
.meter i:nth-child(1){height:4px}.meter i:nth-child(2){height:6px}.meter i:nth-child(3){height:8px}.meter i:nth-child(4){height:11px}
.meter i.on{background:var(--accent)}
.meter.bump i.on{animation:bump .4s var(--spring);transform-origin:bottom}
@keyframes bump{50%{transform:scaleY(1.35)}}
.mpop{position:absolute;bottom:calc(100% + 8px);right:0;z-index:30;width:300px;max-width:calc(100vw - 20px);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.22);transform-origin:bottom right;transform:scale(.94) translateY(6px);opacity:0;pointer-events:none;transition:transform .28s var(--spring),opacity .15s}
.mpop.open{transform:none;opacity:1;pointer-events:auto}
.mpop.left{left:0;right:auto;width:220px;transform-origin:bottom left}
.mopt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);text-align:left;transition:background .15s}
.mopt:hover{background:var(--raise)}
.mopt b{display:block;font-weight:500;font-size:14px}
.mopt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.mopt .tick{margin-left:auto;color:var(--accent-text);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.mopt[aria-checked="true"] .tick{opacity:1;transform:none}
.mopt .mi{width:28px;height:28px;border-radius:var(--r-sm);background:var(--raise);display:grid;place-items:center;color:var(--muted)}
.effort{border-top:1px solid var(--line);margin-top:6px;padding:10px 6px 4px}
.eff-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:500;margin-bottom:8px}
.eff-head span:last-child{color:var(--muted);font-size:12px;font-weight:400;text-align:right}
.eff-head .swap{animation:fade .3s var(--out)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:3px;border-radius:var(--r-sm);background:var(--raise)}
.seg button{position:relative;z-index:1;padding:5px 0;font-size:12.5px;color:var(--muted);transition:color .2s}
.seg button[aria-checked="true"]{color:var(--text);font-weight:500}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,4));border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .4s var(--spring)}
.eff-note{font-size:12px;color:var(--faint);padding:8px 2px 0}


/* ================= Onboarding ================= */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.onb::before{content:"";position:fixed;inset:0;background:radial-gradient(50% 40% at 50% 12%,var(--accent-soft),transparent 70%);pointer-events:none}
.onb.leave{animation:onbout .7s var(--out) forwards}
@keyframes onbout{to{opacity:0;transform:scale(1.04);filter:blur(6px)}}
body.entering .app{animation:appin .8s var(--out)}
@keyframes appin{from{opacity:0;transform:scale(.96)}}
.onb-card{position:relative;width:100%;max-width:580px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 8px);box-shadow:0 24px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:cardin .7s var(--spring)}
@keyframes cardin{from{opacity:0;transform:translateY(20px) scale(.97)}}
.onb-top{display:flex;align-items:center;gap:9px;padding:18px 22px 0}
.onb-top b{font-weight:600;font-size:14.5px}
.stepper{margin-left:auto;display:flex;gap:6px;align-items:center}
.stepper button{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .45s var(--spring),background .3s}
.stepper button.done{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.stepper button.cur{width:24px;background:var(--accent)}
.stepper button:disabled{cursor:default}
.onb-body{padding:24px 26px 12px;min-height:380px;position:relative;overflow:hidden}
.onb-body h1{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.2}
.onb-body h2{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px;line-height:1.25}
.lede{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.onb-foot{display:flex;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.onb-foot .why{flex:1;font-size:12.5px;color:var(--muted)}
.onb-foot .why.ok{color:var(--accent-text)}
.onb-foot .btn.primary{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .2s var(--spring),background .2s,opacity .2s,box-shadow .2s,border-color .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){box-shadow:0 0 0 4px var(--accent-soft)}
.btn.ghost{color:var(--muted)}.btn.ghost:hover:not(:disabled){background:var(--raise);color:var(--text)}
.btn.line{border:1px solid var(--line)}.btn.line:hover:not(:disabled){border-color:var(--faint)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.inp.big{font-size:18px;padding:13px 15px}
.inp.bad,.inp.bad:focus{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.greet{display:flex;align-items:center;gap:12px;margin-top:18px;min-height:44px}
.greet p{margin:0;color:var(--muted);font-size:14px}
.greet p b{color:var(--text);font-weight:500}
.ava{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;font-weight:600;font-size:16px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--text)));color:var(--accent-ink)}
.ava.bump{animation:bump2 .4s var(--spring)}
@keyframes bump2{50%{transform:scale(1.14) rotate(-5deg)}}
.greet.in{animation:rise .4s var(--out)}
.spark-hero{display:block;animation:sparkin 1s var(--spring) both}
@keyframes sparkin{from{transform:scale(0) rotate(-120deg);opacity:0}}
.spark-hero .glow{animation:glow 3.2s ease-in-out infinite;transform-origin:32px 32px}
@keyframes glow{50%{opacity:.4;transform:scale(1.18)}}
.spark-hero .mini{transform-origin:46px 18px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.6) rotate(45deg);opacity:.6}}
.pane{animation:paneIn .45s var(--out) both}
.pane.back{animation-name:paneBack}
@keyframes paneIn{from{opacity:0;transform:translateX(28px)}}
@keyframes paneBack{from{opacity:0;transform:translateX(-28px)}}
.drifts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.drift{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;animation:drift 10s linear infinite}
@keyframes drift{0%{opacity:0;transform:translateY(0)}20%{opacity:.45}100%{opacity:0;transform:translateY(-320px)}}

/* Provider cards */
.pcard{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--panel);transition:border-color .3s}
.pcard.open{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.pcard.connected{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.pcard.celebrate{animation:celebrate 1.1s var(--out)}
@keyframes celebrate{0%{box-shadow:0 0 0 0 var(--accent-soft)}35%{box-shadow:0 0 0 10px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.pcard.nope{animation:shake .4s var(--out)}
.pc-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.plogo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--raise);color:var(--text);flex-shrink:0}
.pc-head .nm{flex:1;min-width:0}
.pc-head .nm b{display:block;font-weight:600;font-size:15px}
.pc-head .nm small{display:block;color:var(--muted);font-size:12.5px}
.pill-ok{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent-text);animation:popin .5s var(--spring)}
.pc-head>.chev{color:var(--faint);transition:transform .3s var(--out)}
.pcard.open .pc-head>.chev{transform:rotate(90deg)}
.pc-body{padding:0 16px 16px}
.methods{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:var(--r-sm);background:var(--raise);margin-bottom:14px}
.methods button{position:relative;z-index:1;padding:7px 4px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.methods button[aria-selected="true"]{color:var(--text);font-weight:500}
.m-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:calc(var(--r-sm) - 2px);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .4s var(--spring)}
.mpanel{animation:fade .3s var(--out)}
.mpanel p,.chg-note{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.mpanel code,.vlog code,.conn-sum code{font-family:"Geist Mono",monospace;font-size:12.5px;background:var(--raise);padding:1px 5px;border-radius:5px;color:var(--text)}
.keyrow{display:flex;gap:8px;margin-bottom:6px}
.keyrow .inp{font-family:"Geist Mono",monospace;font-size:13.5px;padding:9px 12px}
.hintline{font-size:12.5px;color:var(--faint);margin:6px 0 12px;min-height:18px;transition:color .2s}
.hintline.bad{color:var(--danger)}
.hintline[data-dmsg]:empty{display:none}
.hintline.good{color:var(--accent-text)}
.vlog{list-style:none;margin:12px 0 0;padding:0}
.vlog:empty{display:none}
.vlog li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);padding:3px 0;animation:rise .35s var(--out) both}
.vlog li .ic{margin-top:3px}
.vlog li.bad{color:var(--danger)}
.vlog li.good{color:var(--text)}
.xic{color:var(--danger)}
.conn-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px}
.conn-sum>span{flex:1;min-width:200px}
.dhead{font-size:15px;font-weight:600;margin:26px 0 12px}

/* Defaults */
.dsec{margin-bottom:24px;animation:rise .45s var(--out) both}
.dsec h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:15px;font-weight:600}
.dsec h3 .plogo{width:28px;height:28px;border-radius:8px}
.dlabel{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcard{text-align:left;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:border-color .2s,background .2s,transform .2s var(--spring)}
.rcard:hover{border-color:var(--faint)}
.rcard:active{transform:scale(.97)}
.rcard[aria-checked="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.rcard b{display:block;font-size:13.5px;font-weight:500}
.rcard small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:border-color .2s,background .2s}
.rrow:hover{border-color:var(--faint)}
.rrow[aria-checked="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);margin-top:2px;flex-shrink:0;display:grid;place-items:center;transition:border-color .2s}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .3s var(--spring)}
[aria-checked="true"]>.radio{border-color:var(--accent-text)}
[aria-checked="true"]>.radio::after{transform:scale(1)}
.rrow b{display:block;font-size:13.5px;font-weight:500}
.rrow small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.rrow.warnrow small{color:var(--warn)}

/* Connectors */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);transition:border-color .3s;animation:rise .45s var(--out) both}
.ccard.connected{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .top b{font-weight:600;font-size:14.5px;flex:1}
.ccard .top .plogo{width:32px;height:32px;border-radius:9px}
.ccard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45;flex:1}
.ccard .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.ccard .state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}

/* Done */
.done-wrap{text-align:center;padding-top:6px}
.done-wrap .spark-hero{margin:0 auto}
.done-list{list-style:none;padding:0;margin:18px auto 0;max-width:380px;text-align:left}
.done-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;animation:rise .45s var(--out) both}
.done-list li:last-child{border:0}
.done-list li .ic{margin-top:4px}
.done-list b{font-weight:500}
.done-list small{color:var(--muted);display:block;font-size:12.5px}

/* Particles */
.spk{position:fixed;z-index:300;border-radius:50%;pointer-events:none;background:var(--accent)}
.spk.star{border-radius:1px}
.spk.warm{background:var(--warn)}

/* Settings */
.set{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.42);animation:fade .25s}
.set.closing{animation:fadeout .2s forwards}
@keyframes fadeout{to{opacity:0}}
.set-panel{width:100%;max-width:840px;height:min(660px,100%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;animation:cardin .45s var(--spring)}
.set-nav{width:196px;flex-shrink:0;padding:16px 10px;border-right:1px solid var(--line);background:var(--bg)}
.set-nav h2{font-size:15px;font-weight:600;margin:2px 10px 14px}
.set-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:14px;color:var(--muted);text-align:left;transition:background .15s,color .15s}
.set-nav button:hover{background:var(--raise);color:var(--text)}
.set-nav button[aria-selected="true"]{background:var(--raise);color:var(--text);font-weight:500}
.set-nav .badge{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column}
.set-head{display:flex;align-items:center;padding:14px 14px 0 26px}
.set-head h3{flex:1;margin:0;font-size:17px;font-weight:600}
.set-body{flex:1;overflow-y:auto;padding:12px 26px 26px}
.set-body>div{animation:fade .3s var(--out)}
.themes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{padding:8px;border-radius:var(--r);border:1px solid var(--line);text-align:left;transition:border-color .2s,transform .25s var(--spring),box-shadow .2s}
.tcard:hover{transform:translateY(-2px)}
.tcard[aria-checked="true"]{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.tprev{height:70px;border-radius:calc(var(--r-sm) + 2px);margin-bottom:8px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.tprev i{position:absolute;border-radius:4px}
.tcard b{display:block;font-size:13px;font-weight:500;padding:0 4px 2px}
.sep{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.sep b{font-size:14px;font-weight:500}
.sep p{margin:4px 0 10px;color:var(--muted);font-size:13.5px}

/* Sidebar footer + picker extras */
.brandrow{display:flex;align-items:center;gap:8px;flex:1;padding-left:4px}
.brandrow b{font-weight:600;padding:0!important}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 4px 0;border-top:1px solid var(--line);margin-top:8px}
.side-foot .ava{width:30px;height:30px;border-radius:9px;font-size:12px;cursor:pointer}
.side-foot .who2{flex:1;min-width:0;line-height:1.25;text-align:left}
.side-foot b{display:block;font-size:13.5px;font-weight:500}
.side-foot small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .icon-btn:hover svg{transform:rotate(60deg)}
.side-foot .icon-btn svg{transition:transform .5s var(--spring)}
.mgroup{font-size:12px;color:var(--faint);padding:8px 10px 2px}
.perm{border-top:1px solid var(--line);margin-top:6px}
.perm-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 6px 6px;font-size:13px;font-weight:500}
.perm-head span{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.perm .chev{color:var(--faint);transition:transform .3s var(--out)}
.perm.open .chev{transform:rotate(90deg)}
.perm .rlist{padding:4px 2px 6px}
.perm .rrow{padding:7px 10px}
.mpop{max-height:min(560px,calc(100vh - 160px));overflow-y:auto}

@media (max-width:640px){
  .cards3,.cgrid{grid-template-columns:1fr}
  .set{padding:0}
  .set-panel{height:100%;max-width:none;border-radius:0;border:0;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .set-nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
  .set-nav h2{display:none}
  .set-nav button{width:auto;white-space:nowrap}
  .set-head{padding:12px 10px 0 18px}.set-body{padding:10px 18px 24px}
  .onb{padding-left:10px;padding-right:10px}
  .onb-body{padding:20px 18px 10px;min-height:0}
  .onb-foot{padding:12px 14px 14px}
  .onb-foot{flex-wrap:wrap}
  .onb-foot .why{order:-1;flex-basis:100%}
  .onb-foot .why:empty{display:none}
  .methods button{font-size:12.5px;gap:4px}
}


/* ================= App rail + views ================= */
.rail{width:70px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px;position:relative}
.rail-logo{width:44px;height:44px;display:grid;place-items:center;margin-bottom:10px;border-radius:14px;transition:background .2s}
.rail-logo:hover{background:var(--raise)}
/* ---- Blob Scout (logo with moods) ---- */
.scout{overflow:visible;--sc-a:var(--accent);--sc-b:var(--warn);--sc-eye:#0c0f12;cursor:pointer;-webkit-tap-highlight-color:transparent}
body[data-skin="contrast"] .scout,body[data-skin="fjord"] .scout,body[data-skin="lagoon"] .scout,body[data-skin="iris"] .scout{--sc-eye:#fff}
.scout .sc-hop,.scout .sc-body{transform-box:view-box}
.scout .sc-body{transform-origin:32px 58px;animation:sc-breathe 3.4s ease-in-out infinite}
@keyframes sc-breathe{50%{transform:scale(1.03,.97)}}
.scout .sc-eye{fill:var(--sc-eye);transform-box:fill-box;transform-origin:center;animation:sc-blink 4.8s infinite;transition:opacity .2s}
.scout .sc-eye:nth-of-type(2){animation-delay:.04s}
@keyframes sc-blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.scout .sc-look{transition:transform .3s var(--out)}
.scout .sc-spark{transform-box:fill-box;transform-origin:center;animation:sc-twinkle 3s ease-in-out infinite}
@keyframes sc-twinkle{50%{transform:rotate(45deg) scale(.78);opacity:.8}}
.scout .sc-ant{transform-box:view-box;transform-origin:38px 19px}
.scout .sc-happy,.scout .sc-sleep{fill:none;stroke:var(--sc-eye);stroke-width:2.8;stroke-linecap:round;opacity:0;transition:opacity .2s}
.scout .sc-cheeks{fill:var(--sc-b);opacity:0;transition:opacity .3s}
.scout.working .sc-spark{animation:sc-spin .9s linear infinite;filter:drop-shadow(0 0 3px var(--sc-b))}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.scout.working .sc-look{animation:sc-scan 2.2s ease-in-out infinite}
@keyframes sc-scan{0%,100%{transform:translate(-1.8px,-1px)}50%{transform:translate(1.8px,-1px)}}
.scout.alert .sc-ant{animation:sc-wiggle .45s ease-in-out infinite}
@keyframes sc-wiggle{50%{transform:rotate(-12deg)}}
.scout.alert .sc-spark{animation:sc-ping .9s ease-in-out infinite}
@keyframes sc-ping{50%{transform:scale(1.4)}}
.scout.alert .sc-eye{animation:none;transform:scaleY(1.12)}
.scout.happy .sc-eye,.scout.sleep .sc-eye{opacity:0}
.scout.happy .sc-happy,.scout.sleep .sc-sleep{opacity:1}
.scout.happy .sc-cheeks{opacity:.55}
.scout.happy .sc-hop{animation:sc-hop .55s var(--spring) 2}
@keyframes sc-hop{40%{transform:translateY(-6px)}}
.scout.sad .sc-eye{animation:none;transform:translateY(2px) scaleY(.62)}
.scout.sad .sc-spark{animation:none;opacity:.35}
.scout.sad .sc-ant{transform:rotate(18deg)}
.scout.sleep .sc-spark{animation:none;opacity:.4}
.scout.poke .sc-body{animation:sc-squish .5s var(--spring)}
@keyframes sc-squish{30%{transform:scale(1.14,.84)}60%{transform:scale(.94,1.07)}}
.scout-say{position:absolute;left:68px;top:12px;z-index:45;width:max-content;max-width:250px;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--text);color:var(--panel);font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateX(-8px) scale(.94);transform-origin:left top;pointer-events:none;transition:opacity .2s,transform .4s var(--spring)}
.scout-say.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.hh{display:flex;align-items:center;gap:14px}
.empty .scout{display:block;margin:0 auto 14px}
.hero-scout{display:block}
.done-wrap .hero-scout{margin:0 auto}
.rail-ind{position:absolute;left:7px;top:0;width:56px;height:52px;border-radius:13px;background:var(--raise);transition:transform .5s var(--spring),height .3s;pointer-events:none}
.rail-ind::before{content:"";position:absolute;left:-7px;top:15px;bottom:15px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail-btn{position:relative;z-index:1;width:56px;padding:8px 0 6px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s}
.rail-btn svg{transition:transform .3s var(--spring),color .2s}
.rail-btn:hover{color:var(--text)}
.rail-btn:hover svg{transform:translateY(-2px)}
.rail-btn:active svg{transform:scale(.88)}
.rail-btn[aria-current="page"]{color:var(--text)}
.rail-btn[aria-current="page"] svg{color:var(--accent-text)}
.rbadge{position:absolute;top:3px;right:9px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:#1b1300;font-size:12px;font-weight:700;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:popin .45s var(--spring)}
.rbadge:empty{display:none}
.rail-sp{flex:1}
.rail-ava{width:34px;height:34px;border-radius:11px;font-size:12.5px;margin-top:8px;transition:transform .25s var(--spring)}
.rail-ava:hover{transform:scale(1.08)}
.view{flex:1;display:flex;min-width:0;height:100%}
.view[hidden]{display:none!important}
.view.in{animation:viewin .45s var(--out)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.page{margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;flex-direction:column}
.side-foot{display:none}

/* Home */
.home{flex:1;overflow-y:auto}
.home-wrap{max-width:860px;margin:0 auto;padding:44px 28px 56px}
.home-hero h1{font-size:30px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.2}
.home-hero p{margin:8px 0 0;color:var(--muted);font-size:15px}
.home-hero p b{color:var(--text);font-weight:500}
.home-compose{display:flex;align-items:center;gap:8px;margin:24px 0 34px;padding:6px 6px 6px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);transition:border-color .2s,box-shadow .3s var(--out)}
.home-compose:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.home-compose input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:9px 0}
.home-compose input::placeholder{color:var(--faint)}
.home-compose select{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted);outline:none;max-width:140px}
.hsec{margin-bottom:30px}
.hsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.hsec-h h2{font-size:15px;font-weight:600;margin:0}
.hsec-h button{font-size:13px;color:var(--muted)}
.hsec-h button:hover{color:var(--text)}
.hlist{display:flex;flex-direction:column;gap:8px}
.hcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s,transform .25s var(--spring),background .2s}
.hcard:hover{border-color:var(--faint);transform:translateY(-1px)}
.home-live.enter .hcard,.home-live.enter .hquiet,.home-live.enter .mrow{animation:rise .45s var(--out) both}
.hc-main{flex:1;min-width:0}
.hc-main b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-main small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj{color:var(--faint);margin-right:8px}
.hcard.asking{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 6%,transparent)}
.hcard.asking small{color:var(--warn)}
.hcard.error small{color:var(--danger)}
.hcard .go{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.hcard.asking .go{background:var(--text);color:var(--panel);border-color:transparent}
.hprog{display:block;height:3px;border-radius:3px;background:var(--raise);margin-top:8px;overflow:hidden}
.hprog i{display:block;height:100%;background:var(--accent);border-radius:3px;animation:progin .6s var(--out)}
@keyframes progin{from{transform:scaleX(.6);transform-origin:left;opacity:.5}}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hquiet{display:flex;align-items:center;gap:10px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13.5px}
.hquiet .btn{margin-left:auto}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);font-size:14px;transition:background .15s}
.mrow:hover{background:var(--raise)}
.mrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .k{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted)}

/* Tickets */
.tk{flex:1;display:flex;flex-direction:column;min-height:0}
.tk-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tk-head h2{margin:0 6px 0 0;font-size:17px;font-weight:600}
.tk-head .seg{width:240px}
.srcname{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tk-search{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--r-sm);background:var(--raise);color:var(--faint);font-size:13.5px}
.tk-search input{border:0;background:transparent;outline:none;width:160px;min-width:0}
.tk-body{flex:1;display:flex;min-height:0;position:relative}
.tk-list{flex:1;overflow-y:auto;min-width:0}
.tk-row{display:grid;grid-template-columns:16px 76px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;transition:background .15s;animation:rise .4s var(--out) both}
.tk-row:hover{background:var(--raise)}
.tk-row.sel{background:var(--accent-soft)}
.tk-key{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted)}
.tk-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-meta{display:flex;align-items:center;gap:10px}
.tk-meta .lk{color:var(--accent-text)}
.spill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--raise);color:var(--muted)}
.spill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.spill.prog{color:var(--accent-text);background:var(--accent-soft)}
.spill.rev{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.spill.done{color:var(--faint);text-decoration:line-through}
.spill.pop{animation:popin .45s var(--spring)}
.pri{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.pri i{width:3px;border-radius:1px;background:var(--line)}
.pri i:nth-child(1){height:5px}.pri i:nth-child(2){height:8px}.pri i:nth-child(3){height:12px}
.pri i.on{background:var(--muted)}
.pri.high i.on{background:var(--warn)}
.tk-detail{width:430px;flex-shrink:0;border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 28px;animation:slidein .4s var(--out)}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}}
.tk-detail h3{font-size:19px;font-weight:600;line-height:1.3;margin:6px 0 14px;letter-spacing:-.01em}
.tk-detail p{color:var(--muted);font-size:14px;margin:0 0 14px}
.tk-detail ul{margin:0 0 16px;padding-left:18px;font-size:14px;color:var(--muted)}
.tk-detail li{margin:4px 0}
.tk-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tk-props{display:grid;grid-template-columns:84px 1fr;gap:10px 12px;align-items:center;font-size:13.5px;margin:0 0 20px}
.tk-props dt{color:var(--faint)}
.tk-props dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-props .seg{width:100%}
.tk-props .seg button{font-size:12px}
.lbl{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--raise);color:var(--muted)}
.linked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px;margin-top:6px}
.tk-none{display:grid;place-items:center;text-align:center;color:var(--faint);font-size:14px}

.tk-empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px 22px;overflow-y:auto}
.tk-empty>div{max-width:440px}
.tk-empty .big{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;margin:0 auto 16px;animation:sparkin .8s var(--spring) both}
.tk-empty h2{margin:0 0 8px;font-size:21px;font-weight:600}
.tk-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media (max-width:1000px){.hgrid{grid-template-columns:1fr}}

}
@media (max-width:640px){
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:calc(60px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;align-items:flex-start;padding:4px 6px env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);z-index:18;gap:0}
  .rail-logo,.rail-sp,.rail-ava,.rail-ind{display:none}
  .rail-btn{flex:1;width:auto}
  .rail-btn[aria-current="page"]::after{content:"";position:absolute;top:-4px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--accent);animation:popin .35s var(--spring)}
  .rbadge{right:calc(50% - 22px)}
  .app{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .page{margin:0;border:0;border-radius:0}
  .home-wrap{padding:26px 16px 32px}
  .home-hero h1{font-size:25px}
  .home-compose select{max-width:110px}
  .tk-head{padding:12px 14px}

<body data-skin="graphite">
<div class="app">
  <nav class="rail" aria-label="Main">
    <button class="rail-logo" id="railLogo" aria-label="Spark Outpost. Tap for a status update"></button>
    <div class="scout-say" id="scoutSay" role="status" aria-live="polite"></div>
    <span class="rail-ind" id="railInd"></span>
    <button class="rail-btn" data-view="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>Home</button>
    <button class="rail-btn" data-view="chats"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chats<i class="rbadge" id="badgeChats" aria-label="chats need your input"></i></button>
    <button class="rail-btn" data-view="tickets"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M10 9v6"/></svg>Tickets</button>
    <span class="rail-sp"></span>
    <button class="rail-btn" id="railSettings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    <button class="ava rail-ava" id="railAva" aria-label="Your profile"></button>
  </nav>
  <div class="view" id="view-chats" hidden>
  <aside class="side" aria-label="Conversations"><div class="side-in">
    <div class="side-top">
      <span class="brandrow"><b>Chats</b></span>
      <button class="icon-btn" id="newChat" aria-label="New chat" title="New chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Search" aria-label="Search chats">
    </label>
    <div class="tabs" role="tablist">
      <span class="tab-ind" id="tabInd"></span>
      <button role="tab" id="tabActive" aria-selected="true">Active <span class="cnt" id="cntA"></span></button>
      <button role="tab" id="tabHistory" aria-selected="false">History <span class="cnt" id="cntH"></span></button>
    </div>
    <div class="collapse" id="attn"><div><button class="attn-btn" id="attnBtn"><i class="ask"></i><span id="attnText"></span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button></div></div>
    <nav class="list" id="list"></nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="side-foot">
      <span class="ava" id="footAva" role="button" tabindex="0" aria-label="Edit profile"></span>
      <div class="who2"><b id="footName"></b><small id="footProv"></small></div>
      <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div></aside>
  <div class="scrim" onclick="document.body.classList.remove('drawer')"></div>

  <main class="main">
    <header class="head">
      <button class="icon-btn" id="sideToggle" aria-label="Toggle sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="title"><span class="crumb" id="crumb"></span><h1 id="chatTitle"></h1><span class="branch mono" id="branch"></span></div>
      <div class="head-r">
        <button class="icon-btn" id="wpBtn" aria-label="Show work panel" title="Work panel" aria-pressed="false" aria-controls="wp" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16M18 8.5h-.01M18 12h-.01"/></svg></button>
        <button class="icon-btn" id="tvBtn" aria-pressed="false" aria-label="Agent TV" aria-describedby="tvTip" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="m8 3 4 4 4-4"/></svg><i class="live" aria-hidden="true"></i><span class="tip" id="tvTip" role="tooltip">Agent TV</span></button>
        <button class="icon-btn" id="themeBtn" aria-label="Change theme" aria-expanded="false"><span class="theme-dot"></span></button>
        <div class="pop" id="pop" role="menu"></div>
      </div>
    </header>

    <div class="thread-wrap">
      <div class="thread" id="thread"></div>
      <button class="jump" id="jump"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span id="jumpLabel">Latest</span></button>
    </div>

    <div class="cwrap">
      <div class="composer" id="composer">
        <div class="mpop left" id="plusPop" role="menu"></div>
        <div class="mpop" id="mpop" role="dialog" aria-label="Model, effort, and permissions"></div>
        <div class="mpop ctxpop" id="ctxPop" role="dialog" aria-label="Context window"></div>
        <div class="chips" id="chips"></div>
        <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
        <div class="bar">
          <button class="icon-btn" id="attach" aria-label="Add files and context" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="hint">Enter to send, Shift + Enter for a new line</span>
          <button class="mbtn" id="mbtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Model and effort">
            <span class="mblob" id="mblob"></span><span id="mname">Opus 5.5</span>
            <span class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <svg class="chev2" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="ctxbtn" id="ctxBtn" aria-haspopup="dialog" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" class="ring-bg"/><circle cx="10" cy="10" r="8" class="ring-fg"/></svg><span class="ctxpct">0%</span></button>
          <button class="send" id="send" aria-label="Send" disabled>
            <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="stop" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <div class="wp-scrim" data-hx="close"></div>
  <aside class="wp" id="wp" aria-label="Work panel"><div class="wp-in">
    <span class="wp-grab" aria-hidden="true"></span>
    <div class="wp-head"><b>Work</b>
      <button class="icon-btn" data-hx="close" aria-label="Hide work panel" title="Hide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="wp-body" id="wpBody"></div>
    <div class="wp-foot"><button class="btn ghost sm" data-hx="audit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Audit this session</button></div>
  </div></aside>
  </div>
  <div class="view page" id="view-home">
    <div class="home"><div class="home-wrap">
      <header class="home-hero"><div class="hh"><span id="homeScout" style="display:grid"></span><h1 id="homeGreet"></h1></div><p id="homeSummary"></p></header>
      <form class="home-compose" id="homeForm" onsubmit="return false">
        <input id="homeInput" placeholder="Start a new chat" aria-label="Start a new chat" autocomplete="off">
        <select id="homeProj" aria-label="Project"></select>
        <button class="send" id="homeSend" aria-label="Start chat" disabled><svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
      <div class="home-live" id="homeLive"></div>
    </div></div>
  </div>
  <div class="view page" id="view-tickets" hidden></div>
</div>

<div class="onb" id="onb" hidden>
  <div class="onb-card" role="dialog" aria-modal="true" aria-labelledby="onbTitle">

/* ======================= Context window ======================= */
const RING=50.27;
const fmtK=n=>n>=1000?(n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"K":String(Math.round(n));
const ATT_T={"spec-v3.pdf":12400,"divider.png":1600,"dates.ts":900};
const ctxOf=c=>c&&c.ctx?c.ctx:{sys:6200,files:0,convo:0,att:0};
const ctxUsed=c=>{const x=ctxOf(c);return x.sys+x.files+x.convo+x.att};
const ctxLevel=p=>p>=85?"hot":p>=60?"warm":"ok";
function addCtx(c,part,n){c.ctx=c.ctx||{sys:6200,files:0,convo:0,att:0};c.ctx[part]+=Math.round(n);if(c===cur){renderCtx();ctxBtn.classList.remove("tick");void ctxBtn.offsetWidth;ctxBtn.classList.add("tick")}}
function renderCtx(){
  if(!cur)return;
  const used=ctxUsed(cur),win=curP().ctx,p=Math.min(100,Math.round(used/win*100));
  ctxBtn.dataset.level=ctxLevel(p);
  ctxBtn.querySelector(".ring-fg").style.strokeDashoffset=RING*(1-Math.max(p,2)/100);
  ctxBtn.querySelector(".ctxpct").textContent=p+"%";
  const lbl=`Context window: ${p}% used, ${fmtK(used)} of ${fmtK(win)} tokens`;
  ctxBtn.setAttribute("aria-label",lbl);ctxBtn.title=lbl;
  if(ctxPop.classList.contains("open"))buildCtxPop();
}
function buildCtxPop(){
  const x=ctxOf(cur),used=ctxUsed(cur),win=curP().ctx,p=Math.min(100,Math.round(used/win*100)),lv=ctxLevel(p);
  const parts=[["sys","System and tools","var(--faint)"],["files","Files read","var(--accent)"],["convo","Conversation","color-mix(in srgb,var(--accent) 45%,var(--text))"],["att","Attachments","var(--warn)"]];
  const note=lv==="hot"?"Almost full. Replies can lose track of early details. Compact now, or Spark compacts automatically at 95%.":lv==="warm"?"Getting full. Compacting summarizes older messages and keeps replies sharp.":"Plenty of room left in this chat.";
  ctxPop.innerHTML=`<div class="ctx-h"><b>Context window</b><span>${fmtK(used)} of ${fmtK(win)} tokens (${p}%)</span></div>
    <div class="ctx-bar" role="img" aria-label="${p}% of the context window used">${parts.map(([k,,col],i)=>`<i style="width:${x[k]/win*100}%;background:${col};animation-delay:${i*70}ms"></i>`).join("")}</div>
    <div class="ctx-legend">${parts.map(([k,l,col])=>`<div><i style="background:${col}"></i><span>${l}</span><b>${fmtK(x[k])}</b></div>`).join("")}<div class="free"><i></i><span>Free</span><b>${fmtK(Math.max(0,win-used))}</b></div></div>
    <p class="ctx-note ${lv}">${note}</p>
    <div class="ctx-foot"><small>${curP().models[sel.model][1]} holds ${fmtK(win)} tokens per chat.</small><button class="btn sm ${lv==="ok"?"line":"primary"}" id="compactBtn" ${x.convo<8000||cur.busy?"disabled":""}>Compact</button></div>`;
  $("compactBtn").onclick=e=>{e.stopPropagation();compact(cur)};
}
async function compact(c){
  const b=$("compactBtn");if(b){b.disabled=true;b.innerHTML='<i class="spin"></i>Compacting'}
  await wait(1300);
  const before=c.ctx.convo+c.ctx.att;c.ctx.convo=Math.round(c.ctx.convo*.16);c.ctx.att=0;const freed=before-c.ctx.convo;

/* ======================= Send ======================= */
const input=$("input"),send=$("send"),chips=$("chips"),composer=$("composer");
function syncSend(){
  input.style.height="auto";input.style.height=input.scrollHeight+"px";
  const busy=cur&&cur.busy;send.classList.toggle("busy",!!busy);send.setAttribute("aria-label",busy?"Stop":"Send");
  send.disabled=!busy&&!input.value.trim()&&!chips.children.length;
}
input.addEventListener("input",syncSend);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!cur.busy)submit()}});

function submit(){
  const files=[...chips.children].map(c=>c.dataset.name);const t=input.value.trim();
  if(!t&&!files.length)return;
  const from=input.getBoundingClientRect();
  sendText(cur,t+(files.length?(t?"\n":"")+"📎 "+files.join(", "):""),from);
  input.value="";chips.innerHTML="";syncSend();
  // send motion: arrow launches, composer exhales
  [send,composer].forEach((x,i)=>{const k=i?"exhale":"launch";x.classList.remove(k);void x.offsetWidth;x.classList.add(k)});
}
function sendText(c,text,from){
  c.el.querySelector(".empty")?.remove();
  if(c.title==="New chat"){c.title=text.split("\n")[0].slice(0,40)+(text.length>40?"…":"");const r=list.querySelector(`[data-chat="${c.id}"] .tt`);if(r)r.textContent=c.title;updateHeader()}
  if(c.archived){c.archived=false;c.flash=true;setTab("active");renderSide();toast("Moved back to Active")}
  const attT=((text.match(/📎 (.*)$/m)||[])[1]||"").split(", ").filter(Boolean).reduce((t,n)=>t+(ATT_T[n]||1500),0);
  addCtx(c,"convo",text.length/3.6+40);if(attT)addCtx(c,"att",attT);
  const el=userMsg(c,text,now(),from?"flying":"fresh");el.querySelector(".bubble").classList.add("pending");
  threadEl.scrollTop=threadEl.scrollHeight;
  if(from&&!reduce){
    // FLIP: the bubble flies from the composer to its place in the thread
    const b=el.querySelector(".bubble"),to=b.getBoundingClientRect();
    const dx=from.left+16-to.left,dy=from.top+8-to.top;
    b.animate([{transform:`translate(${dx}px,${dy}px) scale(.92)`,opacity:.2,filter:"blur(2px)",borderRadius:"8px"},{opacity:1,filter:"none",offset:.45},{transform:"none",opacity:1,filter:"none"}],{duration:620,easing:"cubic-bezier(.3,1.25,.5,1)"});
  }
  follow(c,true);deliver(c,el,text,/\bfail\b/i.test(text));
}
async function deliver(c,el,text,fail){
  await wait(260);
  if(fail){markFailed(el,text);return}
  markSent(el);runAgent(c,pick(text));
}
function pick(t){
  if(/\bpr\b/i.test(t)&&/open/i.test(t))return{steps:["Created branch <code>fix/date-divider</code>","Pushed 2 commits","Opened PR <b>#418</b> against <code>main</code>"],text:"PR #418 is open with the fix and the new test. CI is running and usually takes about four minutes.",acts:[["View PR #418","Show me PR #418"],["Request review","Request review from Matt"]]};
  if(/lint/i.test(t))return{steps:["Ran <code>pnpm lint --changed</code>"],text:"No lint issues in the changed files. You're clear to merge once CI passes.",acts:[["Open a PR","Open a PR for this fix"]]};
  if(/wrap|scroll/i.test(t))return{steps:["Updated <code>FilterChips.tsx</code>","Added a +3 more overflow button","Ran visual snapshot tests"],text:"Done. Chips follow your choice on small screens, and anything past two lines collapses into a +3 more button.",acts:[["Open a PR","Open a PR for this fix"]]};
  if(/retry/i.test(t))return{steps:["Read <code>fetchWithRetry.ts</code>","Wrote <code>fetch.mock.ts</code>","Ran <code>pnpm vitest retry</code>"],text:"The mock is in place and all 12 retry tests pass without touching the network.",acts:[["Open a PR","Open a PR for the mock"]]};
  if(/prune|for real/i.test(t))return{steps:["Removed 9 worktrees","Pruned stale branch refs"],text:"Removed 9 merged worktrees and freed 4.2 GB. Your active worktrees weren't touched.",acts:[]};
  return{steps:["Read the conversation","Searched the repo for related code"],text:"Here's what I found. Two other components compare dates the same way and could show the same bug. I can fix them here or open a follow-up issue.",acts:[["Fix them here","Fix the other two components too"],["Open an issue","Open a follow-up issue"]]};
}
async function runAgent(c,r,startDelay=0){
  c.busy=true;c.stop=false;if(c===cur)syncSend();
  await wait(startDelay);
  c.prov=sel.prov;const k=effortFactor(),t0=Date.now();
  if(sel.eff>=2&&!r.ask)r={...r,steps:["Thought through the approach",...r.steps]};
  setStatus(c,"running","Starting");
  const el=aiMsg(c,`<div class="typing" aria-label="Spark is working"><i></i><i></i><i></i></div>`,now(),whoLabel());follow(c);
  const av=el.querySelector(".agent-ava svg")||[...c.el.querySelectorAll(".agent-ava svg")].pop();
  setTimeout(()=>mood(av,"thinking"),120);
  const body=el.querySelector(".body");await wait(600*k);
  body.innerHTML=`<div class="steps open"><button class="steps-head" aria-expanded="true">${I.chev}<span class="lbl">Working</span></button><div class="collapse"><div><ul></ul></div></div></div><div class="out"></div>`;
  const ul=body.querySelector("ul");let n=0;
  for(const s of r.steps){
    if(c.stop)break;n++;
    setStatus(c,"running",`Step ${n} of ${r.steps.length}: ${plain(s)}`);
    ul.insertAdjacentHTML("beforeend",`<li><span class="ic"><i class="spin"></i></span>${s}</li>`);follow(c);
    await wait(800*k);ul.lastElementChild.querySelector(".ic").innerHTML=I.ok;addCtx(c,"files",1200+Math.random()*2600);
  }
  const steps=body.querySelector(".steps");
  body.querySelector(".lbl").textContent=c.stop?"Stopped":`Worked for ${Math.max(1,Math.round((Date.now()-t0)/1000))}s`;
  await wait(250);steps.classList.remove("open");steps.querySelector(".steps-head").setAttribute("aria-expanded",false);
  const out=body.querySelector(".out");
  if(c.stop){mood(av,"sleepy");out.innerHTML=`<p style="color:var(--muted)">Stopped. Nothing after the last checked step was changed.</p>`;c.busy=false;setStatus(c,"idle");if(c===cur)syncSend();return}
  const p=document.createElement("p");
  if(r.ask){const q=document.createElement("div");q.className="question";q.appendChild(p);out.appendChild(q)}else out.appendChild(p);
  for(const w of r.text.split(" ")){if(c.stop)break;const s=document.createElement("span");s.className="w";s.textContent=w+" ";p.appendChild(s);await wait(34)}
  addCtx(c,"convo",r.text.length/3.6+300);
  if(r.acts&&r.acts.length)out.insertAdjacentHTML("beforeend",actsHTML(r.acts));
  follow(c);c.busy=false;if(c===cur)syncSend();
  mood(av,r.ask?"unsure":"happy");if(!r.ask)setTimeout(()=>{if(av&&av.dataset.expr==="happy")mood(av,"idle")},3200);
  if(r.ask)setStatus(c,"asking","Needs your input");
  else if(c===cur){setStatus(c,"done");setTimeout(()=>{if(c.status==="done"&&c===cur)setStatus(c,"idle")},2600)}
  else setStatus(c,"done","Finished. Open to review.");
}

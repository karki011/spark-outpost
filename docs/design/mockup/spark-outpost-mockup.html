function burst(x,y,n=16,spread=70){
  if(reduce)return;
  for(let i=0;i<n;i++){
    const d=document.createElement("i");const sz=3+Math.random()*5;
    d.className="spk"+(i%3===0?" star":"")+(i%4===1?" warm":"");
    d.style.width=d.style.height=sz+"px";d.style.left=x+"px";d.style.top=y+"px";
    document.body.appendChild(d);
    const ang=Math.random()*Math.PI*2,dist=spread*(.45+Math.random()*.8);
    d.animate([{transform:"translate(-50%,-50%) scale(1) rotate(0)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist+18}px)) scale(.2) rotate(180deg)`,opacity:0}],{duration:650+Math.random()*550,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>d.remove();
  }
}
function burstAt(el,n,spread){if(!el)return;const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n,spread)}

      :[{run:`Looking for <code>${P.cli}</code> on your PATH`,done:`Found <code>${P.cli} ${P.cliVer}</code> at <code>/usr/local/bin/${P.cli}</code>`},{run:"Checking your CLI login",done:id==="claude"?"Logged in to your Anthropic account":"Logged in with ChatGPT"},{run:"Sending a test request",done:"Test request succeeded in 412 ms"}];

  if(act==="addlink"){const slot=$("addLinkSlot");slot.innerHTML=`<input class="inp linkin" id="linkIn" placeholder="Paste a PR, ticket, or doc link" aria-label="Link URL"><div class="wnote">Enter to add, Esc to cancel</div>`;const i=$("linkIn");i.focus();
    i.onkeydown=e=>{if(e.key==="Escape"){renderWP();return}if(e.key==="Enter"&&i.value.trim()){const v=i.value.trim();let host=v;try{host=new URL(v.includes("://")?v:"https://"+v).hostname}catch(x){}LINKS.push({kind:"url",key:host,title:v.replace(/^https?:\/\//,"").slice(0,60)});renderWP()}};return}
}

  const h=e.target.closest("[data-hx]");if(h)hxAction(h.dataset.hx,h);

$("wp").addEventListener("keydown",e=>{

});

/* ---- Offline screen and reconnect banner (preview) ---- */
const RETRY_S=[1,2,4,8,10];
const retryDelay=n=>RETRY_S[Math.min(n,RETRY_S.length-1)];
const OFF_COPY={
  unreachable:{title:"Taking a quick nap",body:"The Spark Outpost server isn't answering. It may be restarting.",status:"502 Bad Gateway",mood:"sleep",fx:'<span class="zz"><i>z</i><i>z</i><i>z</i></span>'},
  server:{title:"Feeling a little dizzy",body:"Something went wrong on the server.",status:"500 Internal Server Error",mood:"sad",fx:'<span class="stars"><i></i><i></i><i></i></span>'}
};
function startRetry(o){
  let n=0,left=retryDelay(0),busy=false,timer=0,done=false;
  const show=()=>o.count(busy?"Reconnecting…":`Reconnecting in ${left}s…`,busy);
  const attempt=()=>{busy=true;show();setTimeout(()=>{if(done)return;busy=false;n++;if(n>=o.succeedOn){done=true;o.online();return}o.failed(n);left=retryDelay(n);show();loop()},reduce?300:800)};
  const loop=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(left>1){left--;show();loop()}else attempt()},1000)};
  show();loop();
  return {now(){if(busy||done)return;clearTimeout(timer);attempt()},stop(){done=true;clearTimeout(timer)}};
}
function onlineToast(){
  document.querySelectorAll(".online-toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="online-toast";t.setAttribute("role","status");t.innerHTML='<i></i>Back online';
  document.body.appendChild(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),260)},2400);
}
let offRun=null,banRun=null;
function closeOffline(){if(offRun)offRun.stop();offRun=null;const o=$("off");if(!o)return;o.classList.add("out");setTimeout(()=>o.remove(),reduce?0:440)}
function openOffline(kind){
  closeOffline();const c=OFF_COPY[kind],at=new Date().toLocaleTimeString();
  $("offRoot").innerHTML=`<div class="off ${kind}" id="off" role="dialog" aria-modal="true" aria-labelledby="offTitle"><div class="off-card">
    <div class="off-blob" aria-hidden="true">${scoutSVG(104,{cls:c.mood})}${c.fx}</div>
    <h1 id="offTitle">${c.title}</h1><p class="off-body">${c.body}</p>
    <div class="off-retry"><span class="off-count" id="offCount"></span><button class="btn primary sm" id="offTry">Try now</button></div>
    <p class="off-tries" id="offTries" role="status"></p>
    <details class="off-det"><summary>${I.chev}Details</summary><dl><dt>Status</dt><dd>${c.status}</dd><dt>URL</dt><dd class="mono">/api/setup</dd><dt>Time</dt><dd>${at}</dd></dl>
      <div class="off-hint"><span>If this keeps happening, restart it with <code>pnpm dev</code></span><button class="btn line sm" id="offCopy">${I.copy}<span>Copy</span></button></div></details>
    <button class="off-exit" id="offExit">Close preview</button></div></div>`;
  const box=$("off");
  offRun=startRetry({succeedOn:3,
    count:(t,busy)=>{$("offCount").innerHTML=(busy?'<i class="spin"></i>':"")+t;$("offTry").disabled=busy},
    failed:n=>{$("offTries").textContent=`Tried ${n} ${n===1?"time":"times"}. Still waiting.`},
    online:()=>{const sc=box.querySelector(".scout");setScoutMood(sc,"happy");box.querySelector(".zz,.stars")?.remove();$("offTitle").textContent="Back online";box.querySelector(".off-body").textContent="Picking up where you left off.";box.querySelector(".off-retry").style.visibility="hidden";box.querySelector(".off-det").hidden=true;$("offTries").textContent="";setTimeout(()=>{closeOffline();onlineToast()},reduce?200:900)}});
  $("offTry").onclick=()=>offRun&&offRun.now();
  $("offExit").onclick=closeOffline;
  $("offCopy").onclick=()=>{try{navigator.clipboard.writeText("pnpm dev").catch(()=>{})}catch(e){}const s=$("offCopy").querySelector("span");s.textContent="Copied";setTimeout(()=>s.textContent="Copy",1600)};
  $("offTry").focus();
}
function openBanner(){
  if(banRun)return;
  const el=document.createElement("div");el.className="recon";el.setAttribute("role","status");
  el.innerHTML=`<i class="spin"></i><b id="reconCount"></b><small>Your chat stays open.</small><button class="btn line sm" id="reconTry">Try now</button>`;
  document.body.appendChild(el);
  banRun=startRetry({succeedOn:2,
    count:(t,busy)=>{el.querySelector("#reconCount").textContent=t;el.querySelector("#reconTry").disabled=busy},
    failed:()=>{},
    online:()=>{banRun=null;el.classList.add("out");setTimeout(()=>el.remove(),260);onlineToast()}});
  el.querySelector("#reconTry").onclick=()=>banRun&&banRun.now();
}
pop.addEventListener("click",e=>{const b=e.target.closest("[data-prev]");if(!b)return;e.stopPropagation();togglePop(false);if(b.dataset.prev==="banner")openBanner();else openOffline(b.dataset.prev)});

/* ======================= Boot ======================= */
cur=main;main.el.hidden=false;
renderSide({noFlip:true});openChat("hx");
selFromDefaults();syncApp();
setView(view,true);
function startApp(){
  if(started)return;started=true;
runAgent(C("c2"),{steps:["Read <code>FilterChips.tsx</code>","Measured the toolbar at 3 breakpoints"],ask:true,text:"Two options fit the design system. Should chips wrap to a second line, or scroll horizontally in one row?",acts:[["Wrap to two lines","Wrap chips to two lines"],["Scroll in one row","Scroll chips horizontally in one row"]]},1200);
runAgent(C("c4"),{steps:["Listed 23 worktrees","Found 9 merged and older than 14 days","Wrote <code>scripts/prune-worktrees.sh</code>","Dry run: 9 would be removed"],text:"The script is ready. A dry run found 9 merged worktrees older than 14 days. Nothing was deleted yet.",acts:[["Run it for real","Run the prune script for real"],["Show the list","Show the 9 worktrees"]]},600);
}
if(acct.done&&connected().length){startApp()}else openOnb();
})();

name = "spark-outpost-share"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["17 3 * * *"]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "spark-outpost-shares"

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "ShareCounters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareCounters"]

[observability]
enabled = false
